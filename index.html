<script>
  (function () {
    const PREFIX = "gate_register__";
    window.storage = {
      async get(key, shared) { const raw = localStorage.getItem(PREFIX + key); if (raw === null) return null; return { key, value: raw, shared: !!shared }; },
      async set(key, value, shared) { localStorage.setItem(PREFIX + key, value); return { key, value, shared: !!shared }; },
      async delete(key, shared) { localStorage.removeItem(PREFIX + key); return { key, deleted: true, shared: !!shared }; },
      async list(prefix, shared) { const p = PREFIX + (prefix || ""); const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(PREFIX.length)); return { keys, prefix, shared: !!shared }; },

async function sha256(text) {
  try {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch {
    // fallback simple hash if subtle crypto unavailable
    let h = 0;
    for (let i = 0; i < text.length; i++) { h = (h << 5) - h + text.charCodeAt(i); h |= 0; }
    return "fb" + Math.abs(h).toString(16);
  }
}

function todayStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function nowTimeStr(d = new Date()) {
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}`;
}
function shiftTimeStr(hhmm, deltaMinutes) {
  const [h, m] = hhmm.split(":").map(Number);
  let total = ((h * 60 + m + deltaMinutes) % 1440 + 1440) % 1440;
  return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
}
function fmtTime(t) {
  if (!t) return "—";
  const [h, m] = t.split(":");
  const hh = parseInt(h, 10);
  const ampm = hh >= 12 ? "PM" : "AM";
  const h12 = hh % 12 === 0 ? 12 : hh % 12;
  return `${h12}:${m} ${ampm}`;
}
function timeGreeting() {
  const h = new Date().getHours();

  if (h < 17) return "Good afternoon";
  return "Good evening";
}
function fmtDate(dstr) {
  if (!dstr) return "—";
  const d = new Date(dstr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}
function minutesBetween(dateStr, timeIn, timeOut) {
  const a = new Date(`${dateStr}T${timeIn}`);
  const b = new Date(`${dateStr}T${timeOut}`);
  let diff = Math.round((b - a) / 60000);
  if (diff < 0) diff += 1440;
  return diff;
}
function attStartMs(a) { return new Date(`${a.date}T${a.time_in}`).getTime(); }
function attEndMs(a) {
  if (a.status === "INSIDE" || !a.time_out) return Date.now();
  let e = new Date(`${a.date_out || a.date}T${a.time_out}`).getTime();
  if (!a.date_out && a.time_out < a.time_in) e += 86400000; // older overnight records had no date_out
  return e;
}
function overlapsExisting(attendance, employeeId, startMs, endMs, ignoreId) {
  return attendance.some((a) => a.employee_id === employeeId && a.id !== ignoreId && startMs < attEndMs(a) && endMs > attStartMs(a));
}
function fmtTimeOut(a) {
  if (!a.time_out) return "—";
  return a.date_out && a.date_out !== a.date ? `${fmtTime(a.time_out)} (${dayLabelFor(a.date_out)})` : fmtTime(a.time_out);
}
function fmtDuration(mins) {
  if (mins == null) return "—";

}
function overtimeMinutes(totalMinutes, shiftHours) {
  if (totalMinutes == null || !shiftHours) return 0;

}

function startOfWeek(d) {
  const dt = new Date(d);

}
function toCSV(rows, headers) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map((h) => esc(h.label)).join(",")];
  rows.forEach((r) => lines.push(headers.map((h) => esc(h.get(r))).join(",")));

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });

  document.body.appendChild(a); a.click(); document.body.removeChild(a);

/* ---------------------------------------------------------------------
   REPORT SCHEDULING HELPERS
   Artifacts have no server/cron, so "every day / weekly / monthly" is
   implemented as a due-reminder inside the app: whoever opens it sees a
   banner once a report is due, and one tap builds the report and opens
   it in the device's email app (with the CSV downloaded to attach).
--------------------------------------------------------------------- */
function getPeriodRange(freq, ref = new Date()) {
  const day = todayStr(ref);
  if (freq === "weekly") {
    const start = startOfWeek(ref);
    const end = new Date(start); end.setDate(end.getDate() + 6);
    return { from: todayStr(start), to: todayStr(end), label: `${fmtDate(todayStr(start))} – ${fmtDate(todayStr(end))}` };
  }
  if (freq === "monthly") {
    const y = ref.getFullYear(), m = ref.getMonth();
    const from = `${y}-${String(m + 1).padStart(2, "0")}-01`;
    const last = new Date(y, m + 1, 0).getDate();
    const to = `${y}-${String(m + 1).padStart(2, "0")}-${String(last).padStart(2, "0")}`;
    return { from, to, label: ref.toLocaleDateString(undefined, { month: "long", year: "numeric" }) };
  }
  return { from: day, to: day, label: fmtDate(day) };
}
function isReportDue(rd) {
  if (!rd || !rd.enabled || !rd.recipient_email) return false;
  const today = todayStr();
  if (rd.frequency !== "weekly" && rd.frequency !== "monthly" && rd.time && nowTimeStr().slice(0, 5) < rd.time) return false; // daily: wait for the reminder time (end of day)
  if (!rd.last_sent) return true;
  if (rd.frequency === "weekly") return todayStr(startOfWeek(new Date(rd.last_sent + "T00:00:00"))) !== todayStr(startOfWeek(new Date()));
  if (rd.frequency === "monthly") return rd.last_sent.slice(0, 7) !== today.slice(0, 7);
  return rd.last_sent !== today; // daily
}
function buildReportPayload(freq, employees, attendance, empById, settings) {
  const shiftHours = (settings && settings.shift_hours) || 9;
  const { from, to, label } = getPeriodRange(freq);
  const rows = attendance.filter((a) => a.date >= from && a.date <= to).map((a) => ({ ...a, emp: empById[a.employee_id] })).filter((r) => r.emp);
  rows.sort((a, b) => (b.date + b.time_in).localeCompare(a.date + a.time_in));
  const inside = rows.filter((r) => r.status === "INSIDE").length;
  const overtimeTotal = rows.reduce((s, r) => s + overtimeMinutes(r.total_minutes, shiftHours), 0);
  const overtimeCount = rows.filter((r) => overtimeMinutes(r.total_minutes, shiftHours) > 0).length;
  const totalMinutes = rows.reduce((s, r) => s + (r.total_minutes || 0), 0);
  const activeCount = employees.filter((e) => e.active).length;
  const freqLabel = { daily: "Daily", weekly: "Weekly", monthly: "Monthly" }[freq] || "Attendance";

function buildShipmentReportPayload(freq, shipments, settings) {
  const thresholdDays = (settings && settings.shipment_threshold_days) || 3;
  const custom = (settings && settings.origin_custom) || {};
  const { from, to, label } = getPeriodRange(freq);
  const dk = dayKeys();
  const labelOf = (d) => (freq === "daily" ? dayLabelFor(d, dk) : fmtDate(d));
  const received = shipments.filter((s) => isArrival(s) && s.date_in >= from && s.date_in <= to);
  const released = shipments.filter((s) => isRelease(s) && s.date_out && s.date_out >= from && s.date_out <= to);
  const receivedQty = sumQty(received), releasedQty = sumQty(released);
  const receivedByCount = receivedQty - received.filter((s) => !isCountRecord(s)).length;
  const releasedByCount = releasedQty - released.filter((s) => !isCountRecord(s)).length;
  const damaged = shipments.filter((s) => s.damaged && s.date_in >= from && s.date_in <= to);
  const whoLine = (s, isOut) => {
    const day = labelOf(isOut ? s.date_out : s.date_in), time = fmtTime(isOut ? s.time_out : s.time_in);
    const person = isOut ? s.taken_by_name : s.brought_by_name, pid = isOut ? s.taken_by_id : s.brought_by_id;
    const what = isCountRecord(s) ? `${shipQty(s)} shipment${shipQty(s) === 1 ? "" : "s"} (count only)` : shipRef(s);
    return `- ${day} ${time} — ${person || "—"}${pid ? ` (ID ${pid})` : ""}: ${what}${s.damaged ? " [DAMAGED]" : ""}${isOut ? ` → ${s.destination || "—"}` : (s.origin ? ` from ${String(s.origin).toUpperCase()}` : "")}`;
  };
  const remaining = shipments.filter((s) => s.status === "IN_WAREHOUSE").sort((a, b) => (a.date_in + a.time_in).localeCompare(b.date_in + b.time_in));
  const overdueCount = remaining.filter((s) => shipmentState(s, thresholdDays) === "OVERDUE").length;
  const tally = (list, getKey, fmt) => {
    const m = new Map();
    list.forEach((s) => { const k = getKey(s) || "—"; m.set(k, (m.get(k) || 0) + shipQty(s)); });
    return [...m.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([k, n]) => `- ${fmt ? fmt(k) : k}: ${n}`);
  };
  const freqLabel = { daily: "Daily", weekly: "Weekly", monthly: "Monthly" }[freq] || "Shipment";

  const lines = [
    `${freqLabel} Shipment Report`, `Period: ${label}`, "",
    `Received: ${receivedQty}${receivedByCount ? ` (${receivedQty - receivedByCount} with arrival numbers, ${receivedByCount} counted only)` : ""}`,
    `Released: ${releasedQty}${releasedByCount ? ` (${releasedQty - releasedByCount} individually recorded, ${releasedByCount} counted only)` : ""}`,
    damaged.length ? `DAMAGED: ${damaged.length}` : "",
    `Still in warehouse: ${remaining.length}${overdueCount ? ` (${overdueCount} overdue, limit ${thresholdDays} day${thresholdDays === 1 ? "" : "s"})` : ""}`, "",
    received.length ? "Received by origin:" : "",
    ...(received.length ? tally(received, (s) => (s.origin || "").toUpperCase(), (k) => originLabel(k, custom)) : []),
    released.filter((s) => !isCountRecord(s)).length ? "" : "", released.filter((s) => !isCountRecord(s)).length ? "Released — by day they arrived:" : "",
    ...(released.filter((s) => !isCountRecord(s)).length ? tally(released.filter((s) => !isCountRecord(s)), (s) => s.date_in, (k) => labelOf(k)).sort().reverse() : []),
    released.length ? "Released — where to:" : "",
    ...(released.length ? tally(released, (s) => s.destination) : []),
    received.length ? "" : "", received.length ? "Received — who brought them, what time:" : "",
    ...received.slice().sort((a, b) => (a.date_in + a.time_in).localeCompare(b.date_in + b.time_in)).slice(0, 20).map((x) => whoLine(x, false)),
    received.length > 20 ? `…and ${received.length - 20} more — see the attached CSV.` : "",
    released.length ? "" : "", released.length ? "Released — who took them, where, what time:" : "",
    ...released.slice().sort((a, b) => (a.date_out + a.time_out).localeCompare(b.date_out + b.time_out)).slice(0, 20).map((x) => whoLine(x, true)),
    released.length > 20 ? `…and ${released.length - 20} more — see the attached CSV.` : "",
    damaged.length ? "" : "", damaged.length ? "DAMAGED shipments (photos are saved in the app):" : "",
    ...damaged.slice(0, 15).map((x) => `- ${shipRef(x)}${x.origin ? ` from ${String(x.origin).toUpperCase()}` : ""} — ${x.damage_notes || "no description"} (${(x.photo_ids || []).length} photo${(x.photo_ids || []).length === 1 ? "" : "s"})`),
    remaining.length ? "" : "", remaining.length ? "Still in warehouse — by day they arrived:" : "",
    ...(remaining.length ? tally(remaining, (s) => s.date_in, (k) => labelOf(k)) : []),
    remaining.length ? "" : "", remaining.length ? "Still here (oldest first):" : "",
    ...remaining.slice(0, 12).map((s) => {
      const note = (s.hold_notes || []).slice(-1)[0];
      return `- ${shipRef(s)}${s.origin ? ` from ${String(s.origin).toUpperCase()}` : ""} — arrived ${labelOf(s.date_in)} ${fmtTime(s.time_in)}, held ${fmtAgeMs(shipmentAgeMs(s))}${shipmentState(s, thresholdDays) === "OVERDUE" ? " [OVERDUE]" : ""}${note ? ` — Reason: ${note.text}` : ""}`;
    }),
    remaining.length > 12 ? `…and ${remaining.length - 12} more — full list in the attached CSV.` : "",
    "", "Sent from the Aramex Gatehouse Register app.",
  ].filter((l, i, arr) => !(l === "" && (arr[i - 1] === "" || i === 0)));

  const rowMap = new Map();
  [...received, ...released, ...remaining].forEach((s) => rowMap.set(s.id, s));
  const rows = [...rowMap.values()].sort((a, b) => (b.date_in + b.time_in).localeCompare(a.date_in + a.time_in));
  const csvHeaders = [
    { label: "Arrival No.", get: (r) => r.arrival_no || "" }, { label: "AWB", get: (r) => r.awb || "" }, { label: "Status", get: (r) => r.status },
    { label: "Type", get: (r) => (isCountRecord(r) ? "Count only" : "Individual") }, { label: "Quantity", get: (r) => shipQty(r) },
    { label: "Origin Code", get: (r) => r.origin || "" }, { label: "Origin", get: (r) => originName(r.origin, custom) },
    { label: "Arrived Date", get: (r) => r.date_in }, { label: "Arrived Day", get: (r) => dayLabelFor(r.date_in, dk) }, { label: "Time In", get: (r) => r.time_in },
    { label: "Brought By", get: (r) => r.brought_by_name }, { label: "Brought By ID", get: (r) => r.brought_by_id || "" },
    { label: "Date Out", get: (r) => r.date_out || "" }, { label: "Time Out", get: (r) => r.time_out || "" },
    { label: "Destination", get: (r) => r.destination || "" },
    { label: "Taken By (Staff)", get: (r) => r.taken_by_name }, { label: "Staff Number", get: (r) => r.taken_by_id || "" },
    { label: "Days in Warehouse", get: (r) => {
      if (isCountRecord(r)) return "";
      const end = r.status === "DISPATCHED" ? new Date(`${r.date_out}T${r.time_out}`).getTime() : Date.now();
      return (Math.max(0, end - new Date(`${r.date_in}T${r.time_in}`).getTime()) / 86400000).toFixed(1);
    } },
    { label: "Overdue", get: (r) => (shipmentState(r, thresholdDays) === "OVERDUE" ? "Yes" : "") },
    { label: "Why Still Here (notes)", get: (r) => (r.hold_notes || []).map((n) => `${n.date} ${n.by}: ${n.text}`).join(" | ") },
    { label: "Damaged", get: (r) => (r.damaged ? "Yes" : "") }, { label: "Damage Notes", get: (r) => r.damage_notes || "" }, { label: "Damage Photos", get: (r) => (r.photo_ids || []).length || "" },
  ];
  return {
    subject: `${freqLabel} Shipment Report — ${label} (${receivedQty} in, ${releasedQty} out, ${remaining.length} remaining${damaged.length ? `, ${damaged.length} damaged` : ""})`,
    body: lines.join("\n"), csv: toCSV(rows, csvHeaders), filename: `shipments-${freq}-report-${from}_${to}.csv`, label, rowCount: rows.length,
  };
}

/* ---------------------------------------------------------------------
   STORAGE LAYER (shared, so guards + admin see one live register)
--------------------------------------------------------------------- */
const KEYS = {
  employees: "employees", users: "users", attendance: "attendance", audit: "auditLogs", settings: "settings", leaves: "leaves",
  visitors: "visitors", stockItems: "stockItems", stockMovements: "stockMovements",
  handoverItems: "handoverItems", handoverRecords: "handoverRecords", incidents: "incidents", shipments: "shipments",
};
async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, true);
    return res && res.value ? JSON.parse(res.value) : fallback;
  } catch { return fallback; }
}
async function saveKey(key, value) {
  try { await window.storage.set(key, JSON.stringify(value), true); } catch (e) { console.error("storage save failed", key, e); }
}

/* ---------------------------------------------------------------------
   SHARED DB SYNC (Claude's cross-device db capability, when available)
   Keeps the app's existing "replace the whole array" call sites unchanged
   by diffing old vs new array and writing only the changed documents —
   this is what makes two devices checking people in at the same time
   not clobber each other.
--------------------------------------------------------------------- */
function cleanForStore(obj) {
  // Firestore rejects `undefined` field values outright; Claude's db is fine
  // with them but there's no reason not to normalize either way.
  return JSON.parse(JSON.stringify(obj));
}
async function syncArrayToCollection(db, collectionPath, prevArray, nextArray) {
  const prevById = new Map((prevArray || []).map((x) => [x.id, x]));
  const nextById = new Map((nextArray || []).map((x) => [x.id, x]));
  const col = db.collection(collectionPath);
  const ops = [];
  for (const [id, rec] of nextById) {
    const prev = prevById.get(id);
    if (!prev || JSON.stringify(prev) !== JSON.stringify(rec)) ops.push(col.doc(id).set(cleanForStore(rec)));
  }
  for (const id of prevById.keys()) {
    if (!nextById.has(id)) ops.push(col.doc(id).delete());
  }
  await Promise.all(ops);
}

/* ---------------------------------------------------------------------
   LOCATION-SCOPED DATA (Firebase mode)
   Every location's records live under locations/{locationId}/...
   Settings live in locations/{locationId}/config/app.
--------------------------------------------------------------------- */
const LOCATION_COLLECTIONS = [
  "employees", "attendance", "auditLogs", "leaves", "visitors", "stockItems",
  "stockMovements", "handoverItems", "handoverRecords", "incidents", "shipments",
];
const ACTIVE_LOCATION_KEY = "gate_register__active_location";

function locationCollectionPath(locationId, name) {
  return `locations/${locationId}/${name}`;
}
function locationSettingsPath(locationId) {
  return `locations/${locationId}/config/app`;
}

// Firestore returns documents in id order; the app expects newest first
// (it always prepends new records), so restore that order.
function sortNewestFirst(records) {
  const stamp = (r) => Number(r.created_at ?? r.timestamp ?? r.updated_at ?? 0) || 0;
  return records.slice().sort((a, b) => (stamp(b) - stamp(a)) || String(a.id).localeCompare(String(b.id)));
}

function describeFirestoreError(e, what) {
  const code = e && e.code ? String(e.code) : "";
  const msg = e && e.message ? String(e.message) : "";
  if (code === "permission-denied") {
    return `Not allowed to ${what}. Your account may not have access to this location, or the Firestore rules do not allow it.`;
  }
  if (code === "unavailable" || /offline/i.test(msg)) {
    return `Could not ${what}: cannot reach Firestore. Check the internet connection.`;
  }
  return `Could not ${what}: ${msg || code || "unknown error"}`;
}

function encodeFirebaseConfig(cfg) {

function decodeFirebaseConfig(code) {

async function initFirebaseDb(config) {
  if (!window.firebase) {
    throw new Error("Firebase SDK did not load");
  }

  const existing = window.firebase.apps && window.firebase.apps.length
    ? window.firebase.apps[0]
    : null;

  const app = existing || window.firebase.initializeApp(config);
  const auth = window.firebase.auth(app);
  const db = window.firebase.firestore(app);

  return { app, auth, db };
}
// SECURE GATEHOUSE LOGIN HELPERS
// Keeps the visible login as username + password.
// Firebase Authentication uses a private email-format identity internally.

function usernameToAuthEmail(username, authDomain) {
  const normalized = String(username || "").trim().toLowerCase();

  if (!/^[a-z0-9._-]{3,40}$/.test(normalized)) {
    throw new Error("Username must contain 3–40 letters, numbers, dots, underscores or hyphens.");
  }

  const domain = String(authDomain || "").trim().toLowerCase();

  if (!domain) {
    throw new Error("Firebase authentication domain is missing.");
  }

  return `${normalized}@${domain}`;
}

// If the entered value contains "@" it is used exactly as typed (only
// surrounding whitespace is removed) as the Firebase Authentication email.
// Otherwise it is treated as an existing guard username and mapped to its
// private email-format identity, exactly as before.
function resolveLoginEmail(identifier, authDomain) {
  const raw = String(identifier || "").trim();

  if (raw.includes("@")) {
    return raw;
  }

  return usernameToAuthEmail(raw, authDomain);
}

// Extra email domains a guard username may have been registered under in Firebase Authentication.
const LEGACY_USERNAME_DOMAINS = ["security.aramex.invalid"];

async function signInWithGatehouseUsername(auth, identifier, password, authDomain) {
  if (!auth) {
    throw new Error("Firebase Authentication is not initialized.");
  }

  if (!password) {
    throw new Error("Please enter your password.");
  }

  const raw = String(identifier || "").trim();
  const email = resolveLoginEmail(identifier, authDomain);

  try {
    return await auth.signInWithEmailAndPassword(email, password);
  } catch (firstError) {
    const code = firstError && firstError.code;
    const credentialProblem = code === "auth/invalid-credential" || code === "auth/user-not-found" || code === "auth/wrong-password";

    // A guard username may also have been created with a legacy email domain.
    // Only usernames (no "@") get this second try; the first error is reported.
    if (raw.includes("@") || !credentialProblem) throw firstError;

    for (const domain of LEGACY_USERNAME_DOMAINS) {
      try {
        return await auth.signInWithEmailAndPassword(`${raw.toLowerCase()}@${domain}`, password);
      } catch (e) { /* try the next domain, then report the first error */ }
    }

    throw firstError;
  }
}

// Turns a Firebase Authentication error into a clear, user-facing message.
function describeAuthError(e) {
  const code = e && e.code ? String(e.code) : "";

  switch (code) {
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
      return "Incorrect email/username or password.";
    case "auth/invalid-email":
      return "That email address is not valid.";
    case "auth/user-disabled":
      return "This account has been disabled in Firebase Authentication. Contact the administrator.";
    case "auth/too-many-requests":
      return "Too many failed sign-in attempts. Wait a few minutes and try again.";
    case "auth/network-request-failed":
      return "Network error while signing in. Check your internet connection and try again.";
    case "auth/operation-not-allowed":
      return "Email/Password sign-in is not enabled for this Firebase project. Enable it under Authentication → Sign-in method.";
    default:
      return (e && e.message) || "Login failed. Please try again.";
  }
}

// Shared staff profile loader: the ONLY place the app reads the signed-in
// user's profile. Reads staff/{uid}, validates it and returns the session
// object. Throws an Error with a clear message on any problem.
// "username" is optional (administrators may not have one).
const STAFF_COLLECTION = "staff";

async function loadStaffProfile(db, firebaseUser) {
  if (!db || !firebaseUser || !firebaseUser.uid) {
    throw new Error("Cannot load your staff profile because you are not signed in.");
  }

  const uid = firebaseUser.uid;
  let snap;

  try {
    snap = await db.collection(STAFF_COLLECTION).doc(uid).get();
  } catch (e) {
    console.error("Staff profile read failed:", e);
    const code = e && e.code ? String(e.code) : "";
    const msg = e && e.message ? String(e.message) : "";

    if (code === "permission-denied") {
      throw new Error(
        `Firestore denied access to your staff profile (${STAFF_COLLECTION}/${uid}). ` +
        "The Firestore security rules must allow a signed-in user to read their own staff document. Contact the administrator."
      );
    }

    if (code === "unavailable" || /offline/i.test(msg)) {
      throw new Error(
        "Cannot reach Firestore (the connection appears to be offline). Check your internet connection and try again."
      );
    }

    throw new Error(`Could not load your staff profile: ${msg || code || "unknown error"}`);
  }

  if (!snap.exists) {
    throw new Error(
      `No staff profile was found for this account (${STAFF_COLLECTION}/${uid}). Contact the administrator.`
    );
  }

  const profile = snap.data() || {};

  if (profile.active !== true) {
    throw new Error("This account is disabled. Contact the administrator.");
  }

  if (typeof profile.name !== "string" || !profile.name.trim()) {
    throw new Error("Your staff profile is incomplete: the name is missing. Contact the administrator.");
  }

  if (typeof profile.role !== "string" || !profile.role.trim()) {
    throw new Error("Your staff profile is incomplete: the role is missing. Contact the administrator.");
  }

  if (!["admin","supervisor","manager","guard"].includes(profile.role.trim())) throw new Error("Your staff profile has an unrecognised role. Contact the administrator.");
  const locationIds = Array.isArray(profile.locationIds)
    ? profile.locationIds.filter((id) => typeof id === "string" && id.trim() !== "")
    : [];

  if (locationIds.length === 0) {
    throw new Error("Your staff profile has no assigned locations. Contact the administrator.");
  }

  return {
    id: uid,
    name: profile.name.trim(),
    username: typeof profile.username === "string" ? profile.username : "",
    email: typeof profile.email === "string" && profile.email ? profile.email : (firebaseUser.email || ""),
    role: profile.role.trim(),
    locationIds
  };
}

function defaultChannel() {

function defaultSettings() {
  return {
    shift_hours: 9,
    report_channels: { attendance: defaultChannel(), security: defaultChannel(), inventory: defaultChannel(), shipments: defaultChannel() },
    handover_alert: { recipient_name: "", recipient_email: "" },
    incident_alert: { recipient_name: "", recipient_email: "" },
    shipment_threshold_days: 3,
    origin_custom: {},
  };
}
// Older saves had one shared `report_delivery` channel — carry it forward as the
// attendance channel the first time it's seen, rather than losing that setup.
function migrateSettings(raw) {
  if (!raw) return defaultSettings();
  let out = raw;
  if (!out.report_channels) {
    if (out.report_delivery) {
      const { report_delivery, ...rest } = out;
      out = { ...rest, report_channels: { attendance: report_delivery, security: defaultChannel(), inventory: defaultChannel(), shipments: defaultChannel() } };
    } else {
      out = { ...defaultSettings(), ...out };
    }
  }
  if (!out.handover_alert) out = { ...out, handover_alert: { recipient_name: "", recipient_email: "" } };
  if (!out.incident_alert) out = { ...out, incident_alert: { recipient_name: "", recipient_email: "" } };
  if (!out.shipment_threshold_days) out = { ...out, shipment_threshold_days: 3 };
  if (!out.origin_custom) out = { ...out, origin_custom: {} };
  if (out.report_channels && !out.report_channels.shipments) out = { ...out, report_channels: { ...out.report_channels, shipments: defaultChannel() } };
  return out;
}

  useEffect(() => { const f = () => setVw(window.innerWidth); window.addEventListener("resize", f); return () => window.removeEventListener("resize", f); }, []);
  const authApiRef = useRef(null);

  // LOCAL (per-device) boot path — used when the shared db capability

      emp = emp && Array.isArray(emp) && emp.length ? emp : fresh.employees;
      usr = fresh.users;

      aud = aud && Array.isArray(aud) ? aud : fresh.audit;

        saveKey(KEYS.stockItems, si), saveKey(KEYS.stockMovements, sm),
        saveKey(KEYS.handoverItems, hi), saveKey(KEYS.handoverRecords, hr),
        saveKey(KEYS.incidents, inc), saveKey(KEYS.shipments, shp), saveKey(KEYS.settings, set),
      ]);
    }
    setEmployees(emp || []); setUsers(usr || []); setAttendance(att || []);
    setAudit(aud || []); setLeaves(lv || []);
    setVisitors(vis || []); setStockItems(si || []); setStockMovements(sm || []);
    setHandoverItems(hi || []); setHandoverRecords(hr || []); setIncidents(inc || []); setShipments(shp || []);
    setSettings(migrateSettings(set));
    setSyncMode("local");
    setBooted(true);
  }, []);

  // SYNCED (shared db) boot path — live subscriptions so every device
  // that opens this page sees the same data in real time.
   
  useEffect(() => {
    let cancelled = false;
    let authUnsubscribe = null;
    let loadSeq = 0;          // ignores results of superseded auth events
    let pendingAuthError = ""; // error to keep visible across the sign-out that follows a failed profile check

    const clearUserData = () => {
      setUsers([]);
      setEmployees([]);
      setAttendance([]);
      setAudit([]);
      setLeaves([]);
      setVisitors([]);
      setStockItems([]);
      setStockMovements([]);
      setHandoverItems([]);
      setHandoverRecords([]);
      setIncidents([]);
      setShipments([]);
      setSettings(defaultSettings());
    };

    const startFirebase = async () => {
      setBooted(false);
      setFirebaseError("");

      const fbConfig = getSavedFirebaseConfig();

      if (!fbConfig) {
        setFirebaseError("Firebase configuration is missing. Contact the administrator.");
        setSession(null);
        setBooted(true);
        return;
      }

      try {
        const services = await initFirebaseDb(fbConfig);

        if (cancelled) return;

        const auth = services.auth;
        const db = services.db;

        authApiRef.current = auth;
        dbApiRef.current = db;
        dbModeRef.current = "firebase";

        setSyncMode("firebase");

        // onAuthStateChanged is the single owner of session initialization:
        // it loads staff/{uid} exactly once per auth event and sets the session.
        authUnsubscribe = auth.onAuthStateChanged(async (firebaseUser) => {
          if (cancelled) return;

          const seq = ++loadSeq;

          if (!firebaseUser) {
            setSession(null);
            clearUserData();

            // Keep a profile/permission error visible; it was set just before
            // the sign-out that produced this signed-out event.
            if (pendingAuthError) {
              pendingAuthError = "";
            } else {
              setFirebaseError("");
            }

            setBooted(true);
            return;
          }

          setFirebaseError("");

          try {
            const profile = await loadStaffProfile(db, firebaseUser);

            if (cancelled || seq !== loadSeq) return;

            setSession(profile);
            setFirebaseError("");
            setBooted(true);

          } catch (error) {
            console.error("Authentication profile check failed:", error);

            if (cancelled || seq !== loadSeq) return;

            const message = error.message || "Unable to verify your account permissions.";

            // Show the reason first, then sign out so a half-authenticated
            // user is not left holding a session without a valid profile.
            pendingAuthError = message;
            setSession(null);
            clearUserData();
            setFirebaseError(message);
            setBooted(true);

            try {
              await auth.signOut();
            } catch (signOutError) {
              console.error("Sign-out after failed profile check failed:", signOutError);
            }
          }
        });

      } catch (error) {
        console.error("Firebase startup failed:", error);

        if (cancelled) return;

        authApiRef.current = null;
        dbApiRef.current = null;
        setSession(null);
        clearUserData();
        setFirebaseError(
          error.message || "Could not connect to Firebase."
        );
        setBooted(true);
      }
    };

    startFirebase();

    return () => {
      cancelled = true;

      if (authUnsubscribe) {
        authUnsubscribe();
      }
    };
  }, []);
 
    
  // Saves one array. Local mode: device storage. Claude shared db: root
  // collections, as before. Firebase mode: locations/{activeLocation}/...
  // On a failed save the screen is restored, an error is shown, and the
  // error is re-thrown so callers do not report success.
  const saveRecords = async (name, storageKey, setter, ref, next) => {
    const prev = ref.current;

    let path = name;

      const locationId = activeLocationIdRef.current;

      if (!locationId) {
        setter(prev);
        const msg = "Choose a location before saving.";
        notify(msg, "error");
        throw new Error(msg);
      }

      path = locationCollectionPath(locationId, name);
    }

    try {
      await syncArrayToCollection(db, path, prev, next);
    } catch (e) {
      console.error("Save failed:", path, e);
      setter(prev);
      notify(describeFirestoreError(e, `save ${name}`), "error");

    employees: (next) => saveRecords("employees", KEYS.employees, setEmployees, employeesRef, next),

    stockItems: (next) => saveRecords("stockItems", KEYS.stockItems, setStockItems, stockItemsRef, next),
    stockMovements: (next) => saveRecords("stockMovements", KEYS.stockMovements, setStockMovements, stockMovementsRef, next),
    handoverItems: (next) => saveRecords("handoverItems", KEYS.handoverItems, setHandoverItems, handoverItemsRef, next),
    handoverRecords: (next) => saveRecords("handoverRecords", KEYS.handoverRecords, setHandoverRecords, handoverRecordsRef, next),
    incidents: (next) => saveRecords("incidents", KEYS.incidents, setIncidents, incidentsRef, next),
    shipments: (next) => saveRecords("shipments", KEYS.shipments, setShipments, shipmentsRef, next),
    users: async (next) => {
      // In Firebase mode accounts live in Firebase Authentication and the
      // staff collection, not in this app, so there is nothing to save here.
      if (dbModeRef.current === "firebase") return;
      await saveRecords("users", KEYS.users, setUsers, usersRef, next);
    },
    settings: async (next) => {
      const prevSettings = settings;
      if (session && session.role === "manager") { const m = "Read-only access: managers cannot change settings."; notify(m, "error"); throw new Error(m); }
      setSettings(next);
      const db = dbApiRef.current;

      if (!db) {
        await saveKey(KEYS.settings, next);
        return;
      }

      let docPath = "config/app";

      if (dbModeRef.current === "firebase") {
        const locationId = activeLocationIdRef.current;

        if (!locationId) {
          setSettings(prevSettings);
          const msg = "Choose a location before saving.";
          notify(msg, "error");
          throw new Error(msg);
        }

        docPath = locationSettingsPath(locationId);
      }

      try {
        await db.doc(docPath).set(cleanForStore(next));
      } catch (e) {
        console.error("Save failed:", docPath, e);
        setSettings(prevSettings);
        notify(describeFirestoreError(e, "save settings"), "error");
        throw e;
      }
    },
  };

  // FIREBASE MODE: pick the active location once signed in.
  useEffect(() => {
    if (!session || dbModeRef.current !== "firebase") {
      setActiveLocationId(null);
      return;
    }

    const ids = Array.isArray(session.locationIds) ? session.locationIds : [];
    let saved = null;
    try { saved = localStorage.getItem(ACTIVE_LOCATION_KEY); } catch (e) { saved = null; }
    setActiveLocationId(saved && ids.includes(saved) ? saved : (ids[0] || null));
  }, [session]);

  const changeLocation = (locationId) => {
    setActiveLocationId(locationId);
    try { localStorage.setItem(ACTIVE_LOCATION_KEY, locationId); } catch (e) { /* ignore */ }
  };

  // One-time read of stock items and movements for several locations
  // (used by the Inventory "All my locations" report). A location that
  // cannot be read is returned with an error instead of failing the rest.
  const loadLocationStock = async (ids) => {
    const db = dbApiRef.current;
    if (dbModeRef.current !== "firebase" || !db) {
      throw new Error("Reports across locations need Firebase mode.");
    }

    return Promise.all(ids.map(async (locationId) => {
      try {
        const [itemsSnap, movesSnap] = await Promise.all([
          getLocationCollection(db, locationId, "stockItems").get(),
          getLocationCollection(db, locationId, "stockMovements").get(),
        ]);
        return {
          locationId,
          items: itemsSnap.docs.map((d) => ({ ...d.data(), id: d.id })),
          movements: movesSnap.docs.map((d) => ({ ...d.data(), id: d.id })),
        };
      } catch (e) {
        console.error("Stock load failed for", locationId, e);
        return { locationId, items: [], movements: [], error: describeFirestoreError(e, "read stock") };
      }
    }));
  };

  // FIREBASE MODE: roster of guards at the active location. Used for the
  // handover "incoming guard" list (other users' staff profiles are private).
  useEffect(() => {
    const db = dbApiRef.current;

    if (dbModeRef.current !== "firebase" || !db || !session || !activeLocationId) {
      setRoster([]);
      return undefined;
    }

    let cancelled = false;
    const stop = db.collection(`locations/${activeLocationId}/roster`).onSnapshot(
      (snap) => { if (!cancelled) setRoster(snap.docs.map((d) => ({ ...d.data(), id: d.id }))); },
      (err) => { console.warn("Roster read failed:", err); if (!cancelled) setRoster([]); }
    );

    return () => { cancelled = true; try { stop(); } catch (e) { /* ignore */ } };
  }, [session, activeLocationId]);

  // Each guard adds their own entry to the roster of every location they work at.
  useEffect(() => {
    const db = dbApiRef.current;
    if (dbModeRef.current !== "firebase" || !db || !session || !["guard","supervisor"].includes(session.role)) return;

    (session.locationIds || []).forEach((locationId) => {
      db.doc(`locations/${locationId}/roster/${session.id}`)
        .set({ id: session.id, name: session.name, role: session.role, active: true, updated_at: Date.now() })
        .catch((e) => console.warn("Roster update failed:", locationId, e));
    });
  }, [session]);

  // FIREBASE MODE: live subscriptions for the active location only.
  // Re-runs (and cleanly unsubscribes) when the location changes or the
  // user signs out.
  useEffect(() => {
    const db = dbApiRef.current;

    if (dbModeRef.current !== "firebase" || !db || !session || !activeLocationId) {
      return undefined;
    }

    let cancelled = false;
    const locationId = activeLocationId;

    setDataError("");
    setEmployees([]); setAttendance([]); setAudit([]); setLeaves([]); setVisitors([]);
    setStockItems([]); setStockMovements([]); setHandoverItems([]); setHandoverRecords([]);
    setIncidents([]); setShipments([]); setSettings(defaultSettings());

    const setters = {
      employees: setEmployees, attendance: setAttendance, auditLogs: setAudit, leaves: setLeaves,
      visitors: setVisitors, stockItems: setStockItems, stockMovements: setStockMovements,
      handoverItems: setHandoverItems, handoverRecords: setHandoverRecords,
      incidents: setIncidents, shipments: setShipments,
    };

    const onReadError = (label, err) => {
      if (cancelled) return;
      console.error("Firestore read failed:", locationId, label, err);
      setDataError(describeFirestoreError(err, `read ${label} for ${locationId}`));
    };

    const unsubscribers = [];

    LOCATION_COLLECTIONS.forEach((name) => {
      unsubscribers.push(
        getLocationCollection(db, locationId, name).onSnapshot(
          (snap) => {
            if (cancelled) return;
            setters[name](sortNewestFirst(snap.docs.map((d) => ({ ...d.data(), id: d.id }))));
          },
          (err) => onReadError(name, err)
        )
      );
    });

    unsubscribers.push(
      db.doc(locationSettingsPath(locationId)).onSnapshot(
        (snap) => {
          if (cancelled) return;
          setSettings(migrateSettings(snap.exists ? snap.data() : null));
        },
        (err) => onReadError("settings", err)
      )
    );

    return () => {
      cancelled = true;
      unsubscribers.forEach((unsubscribe) => {
        try { unsubscribe(); } catch (e) { /* ignore */ }
      });
    };
  }, [session, activeLocationId]);

  // LOCATION ACCESS HELPERS
function getUserLocationIds(session) {
  if (!session || !Array.isArray(session.locationIds)) {
    return [];
  }

  return session.locationIds.filter(
    (id) => typeof id === "string" && id.trim() !== ""
  );
}

function getLocationCollection(db, locationId, collectionName) {
  if (!db || !locationId || !collectionName) {
    throw new Error("Location database information is missing.");
  }

  return db
    .collection("locations")
    .doc(locationId)
    .collection(collectionName);
}
  
  const empById = useMemo(() => Object.fromEntries(employees.map((e) => [e.id, e])), [employees]);
  const today = todayStr();

  const sendReport = useCallback(async (section, freq) => {
    const channels = settings.report_channels || { attendance: defaultChannel(), security: defaultChannel(), inventory: defaultChannel(), shipments: defaultChannel() };
    const ch = channels[section] || defaultChannel();
    const sectionLabel = { attendance: "Attendance", security: "Security", inventory: "Inventory", shipments: "Shipments" }[section] || section;
    if (!ch.recipient_email) { notify(`Add the recipient's email for ${sectionLabel} reports in Settings first`, "error"); return; }

    let payload;
    if (section === "attendance") payload = buildReportPayload(freq, employees, attendance, empById, settings);
    else if (section === "security") payload = buildSecurityReportPayload(freq, visitors);
    else if (section === "inventory") payload = buildInventoryReportPayload(freq, stockItems, stockMovements);
    else payload = buildShipmentReportPayload(freq, shipments, settings);

    downloadFile(payload.filename, payload.csv, "text/csv");
    const body = payload.body + "\n\n(A CSV of the full period was just downloaded to your device — attach it to this email before sending.)";
    const mailto = `mailto:${encodeURIComponent(ch.recipient_email)}?subject=${encodeURIComponent(payload.subject)}&body=${encodeURIComponent(body)}`;
    const a = document.createElement("a");
    a.href = mailto; a.target = "_blank";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    // "last sent" is stored in the settings, which only admins may change; for everyone else just skip it.
    if (session && isMgmt(session)) {
      try {
        await persist.settings({ ...settings, report_channels: { ...channels, [section]: { ...ch, last_sent: todayStr() } } });
      } catch (e) { /* the failed save already showed an error */ }
    }
    notify(`${payload.label} ${sectionLabel.toLowerCase()} report ready — check your email app`);
  }, [settings, employees, attendance, empById, visitors, stockItems, stockMovements, shipments, notify, session]);

  if (!booted) {
    return (
      <div style={{ minHeight: "100vh", background: C.paper, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 10 }}>
        <Loader2 className="spin" size={26} color={C.navy} />
        <div style={{ fontFamily: FONT_SANS, color: C.ink50, fontSize: 13 }}>Opening the gate register…</div>
        <style>{`.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      </div>
    );
  }

  if (!session) {
  return <LoginScreen authError={firebaseError} onClearAuthError={() => setFirebaseError("")} notify={notify} />;
  }
  return (
    <div style={{ minHeight: "100vh", background: C.paper, fontFamily: FONT_SANS, paddingBottom: vw >= 640 ? 0 : 76, paddingLeft: vw >= 1024 ? 220 : vw >= 640 ? 76 : 0 }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          body { background: #fff !important; }
        }
        ::selection { background: ${C.amber}; color: #fff; }
      `}</style>
      <Toast toast={toast} />
      <Header
  session={session}
  onLogout={async () => {
    const auth = authApiRef.current;

    if (auth) {
      await auth.signOut();
    } else {
      setSession(null);
    }

    setView("dashboard");
  }}
  syncMode={syncMode}
  canWriteShared={canWriteShared}
  activeLocationId={activeLocationId}
  onLocationChange={changeLocation}
/>
      {dataError && (
        <div style={{ background: "#FDE8E8", borderBottom: "1px solid #F5B5B5", padding: "9px 14px", textAlign: "center", fontSize: 12.5, color: C.redDeep }}>
          {dataError}
        </div>
      )}
      {syncMode === "synced" && canWriteShared === false && (
        <div style={{ background: "#FEF3C7", borderBottom: `1px solid #FDE68A`, padding: "9px 14px", textAlign: "center", fontSize: 12.5, color: C.amberDeep }}>
          You can see live data here, but can't save changes yet — ask whoever owns this page to give you edit access (see Settings for details).
        </div>
      )}
      <main style={{ maxWidth: vw >= 1024 ? 1440 : 1100, margin: "0 auto", padding: vw >= 1024 ? "24px 32px 40px" : "18px 16px 30px" }}>
        {view === "dashboard" && (
          <Dashboard
            session={session} employees={employees} attendance={attendance} settings={settings}
            empById={empById} today={today} goto={setView} sendReport={sendReport} leaves={leaves}
            stockItems={stockItems} stockMovements={stockMovements} visitors={visitors} handoverRecords={handoverRecords} incidents={incidents} shipments={shipments}
          />
        )}
        {view === "checkin" && (
          <CheckInScreen
            session={session} employees={employees} attendance={attendance} settings={settings} leaves={leaves}
            persistAttendance={persist.attendance} audit={audit} persistAudit={persist.audit}
            notify={notify} today={today}
          />
        )}
        {view === "checkout" && (
          <CheckOutScreen
            session={session} employees={employees} attendance={attendance} settings={settings}
            persistAttendance={persist.attendance} audit={audit} persistAudit={persist.audit}
            notify={notify} today={today}
          />
        )}
        {view === "attendance" && (
          <AttendanceToday
            employees={employees} attendance={attendance} empById={empById} today={today} settings={settings} leaves={leaves}
          />
        )}
        {view === "history" && (
          <HistoryScreen employees={employees} attendance={attendance} empById={empById} session={session} settings={settings}
            persistAttendance={persist.attendance} audit={audit} persistAudit={persist.audit} notify={notify} />
        )}
        {view === "leave" && (
          <LeaveScreen session={session} employees={employees} empById={empById} leaves={leaves}
            persistLeaves={persist.leaves} notify={notify} />
        )}
        {view === "visitors" && (
          <VisitorsScreen session={session} visitors={visitors} persistVisitors={persist.visitors} notify={notify} today={today} />
        )}
        {view === "inventory" && (
          <InventoryScreen session={session} stockItems={stockItems} stockMovements={stockMovements}
            persistStockItems={persist.stockItems} persistStockMovements={persist.stockMovements} notify={notify}
            settings={settings} activeLocationId={activeLocationId} locationIds={Array.isArray(session.locationIds) ? session.locationIds : []}
            loadLocationStock={dbModeRef.current === "firebase" ? loadLocationStock : undefined} />
        )}
        {view === "sealreg" && canUseSealRegister(session) && (
          <SealRegisterScreen session={session} getDb={() => dbApiRef.current} firebaseMode={dbModeRef.current === "firebase"} notify={notify} />
        )}
        {view === "handover" && (
          <HandoverScreen session={session} users={users} roster={roster} handoverItems={handoverItems} handoverRecords={handoverRecords}
            persistHandoverItems={persist.handoverItems} persistHandoverRecords={persist.handoverRecords}
            settings={settings} persistSettings={persist.settings} notify={notify} />
        )}
        {view === "shipments" && (
          <ShipmentsScreen session={session} shipments={shipments} persistShipments={persist.shipments}
            settings={settings} persistSettings={persist.settings} notify={notify} sendReport={sendReport}
            getDb={() => dbApiRef.current} firebaseMode={dbModeRef.current === "firebase"} activeLocationId={activeLocationId} />
        )}
        {view === "incidents" && (
          <IncidentsScreen session={session} incidents={incidents} persistIncidents={persist.incidents}
            settings={settings} persistSettings={persist.settings} notify={notify} />
        )}
        {view === "employees" && ["admin","supervisor","manager"].includes(session.role) && (
          <EmployeesScreen employees={employees} persistEmployees={persist.employees} notify={notify} />
        )}
        {view === "reports" && ["admin","supervisor","manager"].includes(session.role) && (
          <ReportsScreen employees={employees} attendance={attendance} empById={empById} settings={settings} />
        )}
        {view === "settings" && session.role === "admin" && (
          <SettingsScreen settings={settings} persistSettings={persist.settings} users={users}
            persistUsers={persist.users} notify={notify} sendReport={sendReport} syncMode={syncMode} canWriteShared={canWriteShared} firebaseError={firebaseError}
            loadSample={async () => {
              setBusy(true);
              try {
                const sample = await buildSampleData();
                await persist.employees(sample.employees); await persist.users(sample.users);
                await persist.attendance(sample.attendance); await persist.audit(sample.audit);
                await persist.leaves(sample.leaves); await persist.visitors(sample.visitors);
                await persist.stockItems(sample.stockItems); await persist.stockMovements(sample.stockMovements);
                await persist.handoverItems(sample.handoverItems); await persist.handoverRecords(sample.handoverRecords);
                await persist.incidents(sample.incidents); await persist.shipments(sample.shipments); await persist.settings(sample.settings);
                notify("Sample data loaded");
              } catch (e) {
                console.error("Load sample failed:", e); // the failed save already showed an error
              } finally {
                setBusy(false);
              }
            }}
            eraseAll={async () => {
              setBusy(true);
              try {
                const fresh = await buildFreshData();
                await persist.employees(fresh.employees); await persist.users(fresh.users);
                await persist.attendance(fresh.attendance); await persist.audit(fresh.audit);
                await persist.leaves(fresh.leaves); await persist.visitors(fresh.visitors);
                await persist.stockItems(fresh.stockItems); await persist.stockMovements(fresh.stockMovements);
                await persist.handoverItems(fresh.handoverItems); await persist.handoverRecords(fresh.handoverRecords);
                await persist.incidents(fresh.incidents); await persist.shipments(fresh.shipments); await persist.settings(fresh.settings);
                notify("All data erased — starting fresh");
              } catch (e) {
                console.error("Erase failed:", e); // the failed save already showed an error
              } finally {
                setBusy(false);
              }
            }}
            busy={busy}
          />
        )}
      </main>
      <BottomNav view={view} setView={setView} role={session.role} canSealRegister={canUseSealRegister(session)} vw={vw} locationId={activeLocationId} />
    </div>
  );
}

function FirebaseConnectPanel({ onConnected, initial }) {
  const [mode, setMode] = useState("code"); // "code" | "manual"
  const [code, setCode] = useState("");
  const [fbForm, setFbForm] = useState(initial || { apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" });
  const [error, setError] = useState("");

  const connectWithCode = () => {
    const cfg = decodeFirebaseConfig(code);
    if (!cfg) { setError("That code doesn't look right — ask the admin to resend it."); return; }
    saveFirebaseConfig(cfg);
    onConnected();
  };
  const connectManual = () => {
    if (!fbForm.apiKey.trim() || !fbForm.authDomain.trim() || !fbForm.projectId.trim() || !fbForm.appId.trim()) {
      setError("API Key, Auth Domain, Project ID, and App ID are required"); return;
    }
    saveFirebaseConfig(fbForm);
    onConnected();
  };

  return (
    <div>
      {mode === "code" ? (
        <>
          <Field label="Connection code (from your admin)">
            <textarea style={{ ...inputStyle, minHeight: 64, fontFamily: FONT_MONO, fontSize: 11.5 }} value={code}
              onChange={(e) => { setCode(e.target.value); setError(""); }} placeholder="Paste the code your admin sent you" />
          </Field>
          {error && <div style={{ color: C.redDeep, fontSize: 12, marginBottom: 8 }}>{error}</div>}
          <Btn full tone="navy" onClick={connectWithCode} disabled={!code.trim()}>Connect</Btn>
          <button type="button" onClick={() => { setMode("manual"); setError(""); }} style={{ background: "none", border: "none", color: C.ink50, fontSize: 11.5, marginTop: 10, cursor: "pointer", textDecoration: "underline", display: "block" }}>
            Enter the Firebase details manually instead
          </button>
        </>
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <Field label="API Key"><input style={inputStyle} value={fbForm.apiKey} onChange={(e) => setFbForm((f) => ({ ...f, apiKey: e.target.value }))} /></Field>
            <Field label="Auth Domain"><input style={inputStyle} value={fbForm.authDomain} onChange={(e) => setFbForm((f) => ({ ...f, authDomain: e.target.value }))} /></Field>
            <Field label="Project ID"><input style={inputStyle} value={fbForm.projectId} onChange={(e) => setFbForm((f) => ({ ...f, projectId: e.target.value }))} /></Field>
            <Field label="App ID"><input style={inputStyle} value={fbForm.appId} onChange={(e) => setFbForm((f) => ({ ...f, appId: e.target.value }))} /></Field>
            <Field label="Storage Bucket (optional)"><input style={inputStyle} value={fbForm.storageBucket} onChange={(e) => setFbForm((f) => ({ ...f, storageBucket: e.target.value }))} /></Field>
            <Field label="Sender ID (optional)"><input style={inputStyle} value={fbForm.messagingSenderId} onChange={(e) => setFbForm((f) => ({ ...f, messagingSenderId: e.target.value }))} /></Field>
          </div>
          {error && <div style={{ color: C.redDeep, fontSize: 12, marginBottom: 8 }}>{error}</div>}
          <Btn full tone="navy" onClick={connectManual}>Connect</Btn>
          <button type="button" onClick={() => { setMode("code"); setError(""); }} style={{ background: "none", border: "none", color: C.ink50, fontSize: 11.5, marginTop: 10, cursor: "pointer", textDecoration: "underline", display: "block" }}>
            Use a connection code instead
          </button>
        </>
      )}
    </div>
  );
}

function LoginScreen({ authError, onClearAuthError, notify }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [showFbConnect, setShowFbConnect] = useState(false);
  const [fbJustConnected, setFbJustConnected] = useState(false);
  const alreadyConnected = !!getSavedFirebaseConfig();
  const busyTimerRef = useRef(null);

  // The session is set by onAuthStateChanged, not here. Keep the button busy
  // until that finishes; stop as soon as it reports an error.
  useEffect(() => {
    if (authError) {
      setBusy(false);
      clearTimeout(busyTimerRef.current);
    }
  }, [authError]);

  useEffect(() => () => clearTimeout(busyTimerRef.current), []);
    
   const doLogin = async (u, p) => {
  setError("");
  if (onClearAuthError) onClearAuthError();

  if (!u.trim() || !p) {
    setError("Enter your email or username and your password.");
    return;
  }

  let auth = null;
  try {
    auth = window.firebase && window.firebase.apps && window.firebase.apps.length
      ? window.firebase.auth()
      : null;
  } catch (e) {
    auth = null;
  }
  const config = getSavedFirebaseConfig();

  if (!auth || !config) {
    setError("Firebase Authentication is not connected on this device. Use \"Trouble logging in?\" below to connect it.");
    return;
  }

  setBusy(true);

  try {
    // Only authenticates. The staff profile is loaded once, by
    // onAuthStateChanged, which then sets the session.
    await signInWithGatehouseUsername(auth, u, p, config.authDomain);

    // Safety net so the button can never stay busy forever.
    clearTimeout(busyTimerRef.current);
    busyTimerRef.current = setTimeout(() => {
      setBusy(false);
      setError("Signing in is taking longer than expected. Check your connection and try again.");
    }, 20000);

  } catch (e) {
    console.error("Login failed:", e);
    setError(describeAuthError(e));
    setBusy(false);
  }
};

  return (

          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, marginBottom: 8 }}>
            <GuardShieldIcon size={34} />
            <div style={{ fontFamily: FONT_SANS, fontSize: 25, fontWeight: 800, color: C.ink }}>Gatehouse Register</div>
          </div>
          <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.ink50, letterSpacing: 2, fontWeight: 600 }}>
            SECURITY <span style={{ color: C.line }}>•</span> ACCESS <span style={{ color: C.line }}>•</span> CONTROL
          </div>
          <div style={{ width: 46, height: 2.5, background: C.aramexRed, borderRadius: 2, margin: "6px auto 14px" }} />
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
            <span style={{ width: 34, height: 1, background: C.line }} />
            <span style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.ink50, letterSpacing: 1.5 }}>DIGITAL GATE REGISTER · V2.0</span>

        </div>

        <div style={{ background: "#fff", borderRadius: 18, padding: 24, boxShadow: "0 20px 50px rgba(15,23,42,0.14)" }}>

          <div style={{ fontSize: 13.5, color: C.ink50, marginBottom: 18 }}>Please log in to continue</div>

          <form onSubmit={(e) => { e.preventDefault(); doLogin(username, password); }}>
            <div style={{ position: "relative", marginBottom: 12 }}>
              <div style={{ position: "absolute", left: 12, top: 11, color: C.ink50 }}><Users size={16} /></div>
              <div style={{ border: `1px solid ${C.line}`, borderRadius: 9, padding: "8px 12px 8px 36px" }}>

                <button type="button" onClick={() => setShow((s) => !s)} style={{ position: "absolute", right: 10, top: 20, background: "none", border: "none", color: C.ink50, cursor: "pointer" }}>

            </div>
            {(error || authError) && (
              <div style={{ background: "#FEE2E2", color: C.redDeep, border: `1px solid #FECACA`, borderRadius: 8, padding: "9px 11px", fontSize: 13, marginBottom: 12, display: "flex", alignItems: "center", gap: 7 }}>
                <AlertTriangle size={15} style={{ flexShrink: 0 }} /> {error || authError}
              </div>
            )}
            <Btn full tone="red" size="lg" icon={LogIn} type="submit" disabled={busy}>{busy ? "Signing in…" : "Log In"}</Btn>
          </form>

        
          <div style={{ marginTop: 18, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
            <button type="button" onClick={() => setShowFbConnect((s) => !s)} style={{ background: "none", border: "none", color: C.ink50, fontSize: 12, textDecoration: "underline", cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
              <Package size={14} /> Trouble logging in?
            </button>
                      </div>

          
          {showFbConnect && (
            <div style={{ background: "#F3F6FA", border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px", textAlign: "left", marginTop: 10 }}>
              {fbJustConnected ? (
                <>
                  <div style={{ fontSize: 12.5, color: C.greenDeep, marginBottom: 8 }}>Connected. Reload this page for it to take effect.</div>
                  <Btn full size="sm" tone="green" icon={RefreshCw} onClick={() => window.location.reload()}>Reload Now</Btn>
                </>
              ) : (
                <>
                  <div style={{ fontSize: 12.5, color: C.ink, marginBottom: 10, lineHeight: 1.5 }}>

function Dashboard({ session, employees, attendance, settings, empById, today, goto, sendReport, leaves, stockItems, stockMovements, visitors, handoverRecords, incidents, shipments }) {
  const todays = attendance.filter((a) => a.date === today);
  const inside = todays.filter((a) => a.status === "INSIDE");
  const checkedOutToday = todays.filter((a) => a.status === "CHECKED_OUT");
  const staleInside = attendance.filter((a) => a.status === "INSIDE" && a.date < today);
  const activeEmployees = employees.filter((e) => e.active);
  const checkedInIds = new Set(todays.map((a) => a.employee_id));
  const onLeaveToday = activeEmployees.filter((e) => findLeave(leaves, e.id, today));
  const onLeaveIds = new Set(onLeaveToday.map((e) => e.id));
  const notCheckedIn = activeEmployees.filter((e) => !checkedInIds.has(e.id) && !onLeaveIds.has(e.id));
  const shiftHours = settings.shift_hours || 9;
  const overtimeToday = todays.filter((a) => {
    if (a.status === "INSIDE") return elapsedMinutes(a.date, a.time_in) > shiftHours * 60;
    return overtimeMinutes(a.total_minutes, shiftHours) > 0;
  });
  const visitorsInside = (visitors || []).filter((v) => v.status === "INSIDE");
  const lowStockItems = (stockItems || []).filter((i) => i.active).map((i) => ({ ...i, level: stockLevel(i.id, stockMovements || []) })).filter((i) => i.level <= i.min_threshold);
  const openIncidents = (incidents || []).filter((i) => i.status === "Open" || i.status === "Under Investigation");
  const seriousOpenIncidents = openIncidents.filter((i) => i.severity === "High" || i.severity === "Critical");
  const shipThreshold = settings.shipment_threshold_days || 3;
  const shipmentsInWh = (shipments || []).filter((x) => x.status === "IN_WAREHOUSE");
  const overdueShipments = shipmentsInWh.filter((x) => shipmentState(x, shipThreshold) === "OVERDUE");

  const channels = settings.report_channels || { attendance: defaultChannel(), security: defaultChannel(), inventory: defaultChannel(), shipments: defaultChannel() };
  const dueSections = isMgmt(session)
    ? ["attendance", "security", "inventory", "shipments"].filter((s) => isReportDue(channels[s]))
    : [];
  const sectionLabel = { attendance: "Attendance", security: "Security", inventory: "Inventory", shipments: "Shipments" };

  return (
    <div>
      <div style={{
        background: "#fff", borderRadius: 18, marginBottom: 22, border: `1px solid ${C.line}`,
        boxShadow: "0 2px 10px rgba(15,23,42,0.07)", display: "flex", overflow: "hidden", minHeight: 150,
      }}>
        <div style={{ flex: "1 1 58%", padding: "20px 22px", display: "flex", flexDirection: "column", justifyContent: "center", minWidth: 0 }}>
          <div style={{ fontSize: 13.5, color: C.ink50, marginBottom: 2 }}>☀️ {timeGreeting()},</div>
          <div style={{ fontFamily: FONT_SERIF, fontSize: 27, fontWeight: 800, color: C.ink, lineHeight: 1.15, marginBottom: 5 }}>{session.name.split(" ")[0]}</div>
          <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 12 }}>{fmtDate(today)} · Today's Dashboard</div>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: C.aramexRed, color: "#fff", borderRadius: 20, padding: "5px 14px", fontSize: 11, fontWeight: 700, letterSpacing: 0.3, width: "fit-content" }}>
            <ShieldCheck size={13} /> {session.role.toUpperCase()}
          </div>
        </div>
        <div style={{
          flex: "0 0 40%", position: "relative", background: `linear-gradient(135deg, ${C.aramexRed}, #8C001E)`,
          clipPath: "polygon(22% 0, 100% 0, 100% 100%, 0% 100%)", display: "flex", alignItems: "center", justifyContent: "center",
          padding: "20px 14px", textAlign: "center",
        }}>
          <div>
            <div style={{ color: "#fff", fontFamily: FONT_SANS, fontWeight: 800, fontSize: 15, lineHeight: 1.3 }}>Gatehouse<br />Register</div>
            <div style={{ color: "rgba(255,255,255,0.82)", fontSize: 9, marginTop: 7, letterSpacing: 1.2, fontWeight: 600 }}>SECURITY · ACCESS · CONTROL</div>
          </div>
        </div>
      </div>

      {staleInside.length > 0 && (
        <div style={{ background: "#FEF3C7", border: `1px solid #FDE68A`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Clock size={18} color={C.amberDeep} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.ink }}>{staleInside.length} still checked in from earlier days</div>
              <div style={{ fontSize: 12, color: C.ink50 }}>{staleInside.slice(0, 4).map((a) => (empById[a.employee_id] ? empById[a.employee_id].name : "—") + " (" + dayLabelFor(a.date) + ")").join(", ")}{staleInside.length > 4 ? "…" : ""} — check them out with the real date &amp; time</div>
            </div>
          </div>
          <Btn size="sm" tone="amber" onClick={() => goto("checkout")}>Check Them Out</Btn>
        </div>
      )}

      {(session.role === "guard" || session.role === "supervisor") && (
        <div style={{ background: "#fff", border: `2px solid ${C.aramexRed}`, borderRadius: 12, padding: "14px 16px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div><div style={{ fontWeight: 800, fontSize: 15 }}>Shift Handover</div><div style={{ fontSize: 12.5, color: C.ink50 }}>Ending your shift? Choose the incoming guard and complete the checklist.</div></div>
          <Btn tone="red" icon={RefreshCw} onClick={() => { window.__startHandover = true; goto("handover"); }}>Start Shift Handover</Btn>
        </div>
      )}

      {(handoverRecords || []).some((r) => r.status === "PENDING" && r.incoming_uid === session.id) && (
        <div style={{ background: "#FEF3C7", border: `1px solid #FDE68A`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <RefreshCw size={18} color={C.amberDeep} />
            <div style={{ fontWeight: 700, fontSize: 13.5, color: C.ink }}>A shift handover is waiting for you to take over</div>
          </div>
          <Btn size="sm" tone="amber" onClick={() => goto("handover")}>Review &amp; Take Over</Btn>
        </div>
      )}

      {dueSections.map((s) => {

        return (
          <div key={s} style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <AlertTriangle size={18} color={C.amberDeep} />
              <div>
                <div style={{ fontWeight: 700, fontSize: 13.5, color: C.ink }}>
                  {sectionLabel[s]}: {ch.frequency[0].toUpperCase() + ch.frequency.slice(1)} report due to {ch.recipient_name || ch.recipient_email}

                <div style={{ fontSize: 12, color: C.ink50 }}>Opens your email app with the report — you attach and send.</div>

            </div>
            <Btn size="sm" tone="amber" onClick={() => sendReport(s, ch.frequency)}>Send Report</Btn>

      {lowStockItems.length > 0 && (
        <div style={{ background: "#F7E7E5", border: `1px solid #E9C3BE`, borderRadius: 10, padding: "12px 14px", marginBottom: 18, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Package size={18} color={C.redDeep} />

              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>{lowStockItems.length} item(s) low on stock — reorder needed</div>

          <Btn size="sm" tone="red" onClick={() => goto("inventory")}>View Inventory</Btn>

          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Truck size={18} color={C.redDeep} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>{overdueShipments.length} shipment(s) held longer than {shipThreshold} day(s)</div>
              <div style={{ fontSize: 12, color: C.ink50 }}>{overdueShipments.slice(0, 5).map((x) => shipRef(x)).join(", ")}{overdueShipments.length > 5 ? "…" : ""}</div>

          </div>
          <Btn size="sm" tone="red" onClick={() => goto("shipments")}>View Shipments</Btn>
        </div>

      {seriousOpenIncidents.length > 0 && (

          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <AlertTriangle size={18} color={C.redDeep} />

        <StatCard label="Checked Out Today" value={checkedOutToday.length} icon={DoorClosed} tone="slate" onClick={() => goto("attendance")} />
        <StatCard label="Not Checked In" value={notCheckedIn.length} icon={XCircle} tone="red" onClick={() => goto("attendance")} />
