function HistoryScreen({ employees, attendance, empById, session, persistAttendance, audit, persistAudit, notify, settings }) {
  const [filters, setFilters] = useState({ dateFrom: "", dateTo: "", employee: "", company: "", department: "", guard: "", status: "" });
  const [sortBy, setSortBy] = useState("latest");
  const [editing, setEditing] = useState(null);

  const companies = useMemo(() => [...new Set(employees.map((e) => e.company))], [employees]);
  const departments = useMemo(() => [...new Set(employees.map((e) => e.department))], [employees]);
  const guards = useMemo(() => [...new Set(attendance.flatMap((a) => [a.checked_in_by, a.checked_out_by]).filter(Boolean))], [attendance]);

  const filtered = useMemo(() => {
    let rows = attendance.map((a) => ({ ...a, emp: empById[a.employee_id] })).filter((r) => r.emp);
    if (filters.dateFrom) rows = rows.filter((r) => r.date >= filters.dateFrom);
    if (filters.dateTo) rows = rows.filter((r) => r.date <= filters.dateTo);
    if (filters.employee) {
      const t = filters.employee.toLowerCase();
      rows = rows.filter((r) => r.emp.name.toLowerCase().includes(t) || r.emp.employee_number.toLowerCase().includes(t));
    }
    if (filters.company) rows = rows.filter((r) => r.emp.company === filters.company);
    if (filters.department) rows = rows.filter((r) => r.emp.department === filters.department);
    if (filters.guard) rows = rows.filter((r) => r.checked_in_by === filters.guard || r.checked_out_by === filters.guard);
    if (filters.status) {
      const shiftHours = settings.shift_hours || 9;
      rows = rows.filter((r) => {
        if (filters.status === "OVERTIME") {
          return r.status === "INSIDE" ? elapsedMinutes(r.date, r.time_in) > shiftHours * 60 : overtimeMinutes(r.total_minutes, shiftHours) > 0;
        }
        return r.status === filters.status;
      });
    }
    rows.sort((a, b) => {
      if (sortBy === "latest") return (b.date + b.time_in).localeCompare(a.date + a.time_in);
      if (sortBy === "earliest") return (a.date + a.time_in).localeCompare(b.date + b.time_in);
      if (sortBy === "name") return a.emp.name.localeCompare(b.emp.name);
      if (sortBy === "timein") return a.time_in.localeCompare(b.time_in);
      return 0;
    });
    return rows;
  }, [attendance, filters, sortBy, empById]);

  const exportCSV = () => {
    const shiftHours = settings.shift_hours || 9;
    const headers = [
      { label: "Date", get: (r) => r.date }, { label: "Employee", get: (r) => r.emp.name },
      { label: "Employee ID", get: (r) => r.emp.employee_number }, { label: "Company", get: (r) => r.emp.company },
      { label: "Department", get: (r) => r.emp.department }, { label: "Time In", get: (r) => r.time_in },
      { label: "Date Out", get: (r) => (r.time_out ? (r.date_out || r.date) : "") }, { label: "Time Out", get: (r) => r.time_out || "" }, { label: "Total Hours", get: (r) => r.total_minutes != null ? fmtDuration(r.total_minutes) : "" },
      { label: "Overtime", get: (r) => fmtDuration(overtimeMinutes(r.total_minutes, shiftHours)) },
      { label: "Status", get: (r) => r.status }, { label: "Recorded By", get: (r) => r.status === "INSIDE" ? r.checked_in_by : r.checked_out_by },
      { label: "Remarks", get: (r) => [r.remarks_in, r.remarks_out].filter(Boolean).join(" / ") },
    ];
    downloadFile(`attendance-history-${todayStr()}.csv`, toCSV(filtered, headers), "text/csv");
  };

  return (
    <div>
      <SectionTitle title="Attendance History" sub={`${filtered.length} record(s)`} />

      <details style={{ marginBottom: 14, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 14px" }}>
        <summary style={{ cursor: "pointer", fontWeight: 600, fontSize: 13.5, color: C.navy }}>Filters &amp; Sort</summary>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 12 }}>
          <Field label="From"><input type="date" style={inputStyle} value={filters.dateFrom} onChange={(e) => setFilters((f) => ({ ...f, dateFrom: e.target.value }))} /></Field>
          <Field label="To"><input type="date" style={inputStyle} value={filters.dateTo} onChange={(e) => setFilters((f) => ({ ...f, dateTo: e.target.value }))} /></Field>
          <Field label="Employee (name/ID)"><input style={inputStyle} value={filters.employee} onChange={(e) => setFilters((f) => ({ ...f, employee: e.target.value }))} /></Field>
          <Field label="Guard">
            <select style={inputStyle} value={filters.guard} onChange={(e) => setFilters((f) => ({ ...f, guard: e.target.value }))}>
              <option value="">All</option>{guards.map((g) => <option key={g} value={g}>{g}</option>)}
            </select>
          </Field>
          <Field label="Company">
            <select style={inputStyle} value={filters.company} onChange={(e) => setFilters((f) => ({ ...f, company: e.target.value }))}>
              <option value="">All</option>{companies.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Department">
            <select style={inputStyle} value={filters.department} onChange={(e) => setFilters((f) => ({ ...f, department: e.target.value }))}>
              <option value="">All</option>{departments.map((d) => <option key={d} value={d}>{d}</option>)}
            </select>
          </Field>
          <Field label="Status">
            <select style={inputStyle} value={filters.status} onChange={(e) => setFilters((f) => ({ ...f, status: e.target.value }))}>
              <option value="">All</option><option value="INSIDE">Inside</option><option value="CHECKED_OUT">Checked Out</option><option value="OVERTIME">Overtime</option>
            </select>
          </Field>
          <Field label="Sort by">
            <select style={inputStyle} value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
              <option value="latest">Latest first</option><option value="earliest">Earliest first</option>
              <option value="name">Employee name</option><option value="timein">Time in</option>
            </select>
          </Field>
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <Btn size="sm" tone="ghost" onClick={() => setFilters({ dateFrom: "", dateTo: "", employee: "", company: "", department: "", guard: "", status: "" })}>Clear filters</Btn>
          <Btn size="sm" tone="paper" icon={Download} onClick={exportCSV}>Export CSV</Btn>
        </div>
      </details>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        {filtered.length === 0 ? <EmptyState icon={CalendarDays} title="No records match these filters" /> : (
          <TableScroll headers={["Date", "Employee", "ID", "Company", "Time In", "Time Out", "Total Hours", "Status", "Recorded By", "Remarks", ""]}>
            {filtered.slice(0, 200).map((r) => (
              <tr key={r.id}>
                <Td>{r.date}</Td><Td>{r.emp.name}</Td><TdMono>{r.emp.employee_number}</TdMono><Td>{r.emp.company}</Td>
                <TdMono>{fmtTime(r.time_in)}</TdMono><TdMono>{fmtTimeOut(r)}</TdMono>
                <Td>{r.total_minutes != null ? fmtDuration(r.total_minutes) : "—"}</Td>
                <Td><StatusBadge a={r} shiftHours={settings.shift_hours} /></Td>
                <Td>{r.status === "INSIDE" ? r.checked_in_by : r.checked_out_by}</Td>
                <Td>{[r.remarks_in, r.remarks_out].filter(Boolean).join(" / ") || "—"}</Td>
                <Td>{session.role === "admin" && (
                  <button onClick={() => setEditing(r)} style={{ background: "none", border: "none", color: C.navy, cursor: "pointer" }} title="Correct record"><Edit3 size={15} /></button>
                )}</Td>
              </tr>
            ))}
          </TableScroll>
        )}
      </div>

      {editing && (
        <CorrectionModal record={editing} onClose={() => setEditing(null)} attendance={attendance}
          persistAttendance={persistAttendance} audit={audit} persistAudit={persistAudit} session={session} notify={notify} />
      )}
    </div>
  );
}

function CorrectionModal({ record, onClose, attendance, persistAttendance, audit, persistAudit, session, notify }) {
  const [dateIn, setDateIn] = useState(record.date || "");
  const [timeIn, setTimeIn] = useState(record.time_in || "");
  const [dateOut, setDateOut] = useState(record.time_out ? (record.date_out || record.date) : "");
  const [timeOut, setTimeOut] = useState(record.time_out || "");
  const [reason, setReason] = useState("");

  const save = async () => {
    if (!reason.trim()) { notify("A reason is required to correct a record", "error"); return; }
    if (!dateIn || !timeIn) { notify("Check-in date and time are required", "error"); return; }
    let total_minutes = null, date_out = null;
    if (timeOut) {
      const od = dateOut || dateIn;
      const inMs = new Date(`${dateIn}T${timeIn}`).getTime(), outMs = new Date(`${od}T${timeOut}`).getTime();
      if (outMs <= inMs) { notify("Check-out must be after check-in", "error"); return; }
      date_out = od; total_minutes = Math.round((outMs - inMs) / 60000);
    }
    const updated = { ...record, date: dateIn, time_in: timeIn, date_out, time_out: timeOut || null, total_minutes, status: timeOut ? "CHECKED_OUT" : "INSIDE", updated_at: Date.now() };
    delete updated.emp;
    await persistAttendance(attendance.map((a) => (a.id === record.id ? updated : a)));
    const logs = [];
    const oldOut = record.time_out ? `${record.date_out || record.date} ${record.time_out}` : "—";
    const newOut = timeOut ? `${date_out} ${timeOut}` : "—";
    if (dateIn !== record.date || timeIn !== record.time_in) logs.push({ id: uid("log_"), attendance_id: record.id, action: "CORRECTION", old_value: `in=${record.date} ${record.time_in}`, new_value: `in=${dateIn} ${timeIn}`, performed_by: session.name, reason, timestamp: Date.now() });
    if (oldOut !== newOut) logs.push({ id: uid("log_"), attendance_id: record.id, action: "CORRECTION", old_value: `out=${oldOut}`, new_value: `out=${newOut}`, performed_by: session.name, reason, timestamp: Date.now() });
    if (logs.length) await persistAudit([...logs, ...audit]);
    notify("Attendance record corrected");
    onClose();
  };

  return (
    <Modal title="Correct Attendance Record" onClose={onClose}>
      <div style={{ fontSize: 13, color: C.ink50, marginBottom: 12 }}>{record.emp?.name}</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Check-in date"><input type="date" style={inputStyle} value={dateIn} max={todayStr()} onChange={(e) => setDateIn(e.target.value)} /></Field>
        <Field label="Check-in time"><input type="time" step="1" style={inputStyle} value={timeIn} onChange={(e) => setTimeIn(e.target.value)} /></Field>
        <Field label="Check-out date"><input type="date" style={inputStyle} value={dateOut} max={todayStr()} onChange={(e) => setDateOut(e.target.value)} /></Field>
        <Field label="Check-out time"><input type="time" step="1" style={inputStyle} value={timeOut} onChange={(e) => setTimeOut(e.target.value)} /></Field>
      </div>
      <div style={{ fontSize: 11.5, color: C.ink50, marginTop: -4, marginBottom: 10 }}>Leave the check-out time blank if they are still inside.</div>
      <Field label="Reason for correction (required)"><textarea style={{ ...inputStyle, minHeight: 70 }} value={reason} onChange={(e) => setReason(e.target.value)} placeholder="e.g. Guard entered wrong time, correcting per CCTV footage" /></Field>
      <div style={{ background: C.paperDim, borderRadius: 8, padding: "8px 10px", fontSize: 12, color: C.ink50, marginBottom: 14 }}>
        Original: in {record.date} {record.time_in}, out {record.time_out ? `${record.date_out || record.date} ${record.time_out}` : "—"} — this change is logged in the audit trail, not silently overwritten.
      </div>
      <Btn full tone="navy" onClick={save}>Save Correction</Btn>
    </Modal>
  );
}

   they're there to see, check them out when they leave. Deliberately does

   at the gate, which is the safer thing for a client-side app to keep.
--------------------------------------------------------------------- */
function VisitorsScreen({ session, visitors, persistVisitors, notify, today }) {
  const [tab, setTab] = useState("inside");
  const [showForm, setShowForm] = useState(false);
  const [q, setQ] = useState("");

  const inside = visitors.filter((v) => v.status === "INSIDE");
  const sorted = useMemo(() => [...visitors].sort((a, b) => (b.date + b.time_in).localeCompare(a.date + a.time_in)), [visitors]);

  const filteredHistory = useMemo(() => {
    if (!q.trim()) return sorted.slice(0, 100);
    const t = q.toLowerCase();
    return sorted.filter((v) => v.name.toLowerCase().includes(t) || (v.pass_number || "").toLowerCase().includes(t) || (v.company || "").toLowerCase().includes(t)).slice(0, 100);
  }, [sorted, q]);

  const logIn = async (data) => {
    const now = new Date();
    const rec = {
      id: uid("v_"), ...data, date: todayStr(now), time_in: nowTimeStr(now), time_out: null,
      status: "INSIDE", checked_in_by: session.name, checked_out_by: null, created_at: Date.now(), updated_at: Date.now(),
    };
    await persistVisitors([rec, ...visitors]);
    notify(`${data.name} logged in`);
    setShowForm(false);
  };

  const checkOut = async (v) => {
    const now = new Date();
    const updated = { ...v, time_out: nowTimeStr(now), status: "CHECKED_OUT", checked_out_by: session.name, updated_at: Date.now() };
    await persistVisitors(visitors.map((x) => (x.id === v.id ? updated : x)));
    notify(`${v.name} checked out`);
  };

  return (
    <div>
      <SectionTitle title="Visitors & Contractors" sub={`${inside.length} currently inside`} action={{ label: "+ Log In", onClick: () => setShowForm(true) }} />

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>

            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>

        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {(tab === "inside" ? inside : filteredHistory).length === 0 ? (
          <EmptyState icon={UserPlus} title={tab === "inside" ? "No visitors or contractors currently inside" : "No records found"} />
        ) : (
          (tab === "inside" ? inside : filteredHistory).map((v) => (
            <div key={v.id} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{v.name}</span>
                    <Badge tone={v.type === "Contractor" ? "overtime" : "neutral"}>{v.type.toUpperCase()}</Badge>
                    {v.status === "INSIDE" ? <Badge tone="inside">INSIDE</Badge> : <Badge tone="out">CHECKED OUT</Badge>}
                  </div>
                  <div style={{ fontSize: 12.5, color: C.ink50, marginTop: 3 }}>
                    {v.company && <>{v.company} · </>}{v.purpose}
                  </div>
                  <div style={{ fontSize: 12, color: C.ink50, marginTop: 2 }}>
                    To see: {v.host_name || "—"} {v.department ? `(${v.department})` : ""}
                  </div>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.navy, marginTop: 4 }}>
                    Pass {v.pass_number || "—"} · {v.phone || "—"}

/* ---------------------------------------------------------------------
   INVENTORY — goods in/out through the chamber (tea, sugar, tags,
   wrapping materials, etc.), with a per-item reorder threshold so low
   stock surfaces on the dashboard instead of being discovered too late.
--------------------------------------------------------------------- */
function InventoryScreen({ session, stockItems, stockMovements, persistStockItems, persistStockMovements, notify }) {
  const [tab, setTab] = useState("items");
  const [showItemForm, setShowItemForm] = useState(false);
  const [showMoveForm, setShowMoveForm] = useState(null); // null | {item, type}
  const [editingItem, setEditingItem] = useState(null);

  const activeItems = stockItems.filter((i) => i.active);
  const withLevels = activeItems.map((i) => ({ ...i, level: stockLevel(i.id, stockMovements) }));
  const lowStock = withLevels.filter((i) => i.level <= i.min_threshold);
  const recentMoves = useMemo(() => [...stockMovements].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).slice(0, 50), [stockMovements]);
  const itemById = useMemo(() => Object.fromEntries(stockItems.map((i) => [i.id, i])), [stockItems]);

  const addItem = async (data) => {
    const { starting_quantity, ...itemFields } = data;
    const newItem = { id: uid("si_"), ...itemFields, active: true, created_at: Date.now() };
    await persistStockItems([newItem, ...stockItems]);
    const qty = Number(starting_quantity) || 0;
    if (qty > 0) {
      const now = new Date();
      const rec = {
        id: uid("sm_"), item_id: newItem.id, type: "IN", quantity: qty, date: todayStr(now), time: nowTimeStr(now),
        recorded_by: session.name, person_name: "", phone: "", company: "", id_card_number: "", remarks: "Starting stock",
        created_at: Date.now(),
      };
      await persistStockMovements([rec, ...stockMovements]);
    }
    notify(`${data.name} added${qty > 0 ? ` with ${qty} ${data.unit} on hand` : ""}`);
    setShowItemForm(false);
  };
  const saveItem = async (data) => {
    const { starting_quantity, ...itemFields } = data;
    await persistStockItems(stockItems.map((i) => (i.id === editingItem.id ? { ...i, ...itemFields } : i)));
    notify("Item updated");
    setEditingItem(null);
  };
  const toggleItemActive = async (item) => {
    await persistStockItems(stockItems.map((i) => (i.id === item.id ? { ...i, active: !i.active } : i)));
  };
  const logMovement = async (data) => {
    const now = new Date();
    const { backdateDate, backdateTime, ...fields } = data;
    const rec = {
      id: uid("sm_"), ...fields,
      date: backdateDate || todayStr(now), time: backdateTime ? `${backdateTime}:00` : nowTimeStr(now),
      recorded_by: session.name, created_at: Date.now(),
    };
    await persistStockMovements([rec, ...stockMovements]);
    notify(`${data.type === "IN" ? "Stock in" : "Stock out"} recorded${backdateDate ? ` for ${fmtDate(backdateDate)}` : ""}`);
    setShowMoveForm(null);
  };

  return (
    <div>
      <SectionTitle title="Inventory" sub={`${activeItems.length} item(s) tracked${lowStock.length ? ` · ${lowStock.length} low` : ""}`}
        action={session.role === "admin" ? { label: "+ Add Item", onClick: () => setShowItemForm(true) } : undefined} />

      {lowStock.length > 0 && (
        <div style={{ background: "#F7E7E5", border: `1px solid #E9C3BE`, borderRadius: 10, padding: "12px 14px", marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <AlertTriangle size={16} color={C.redDeep} />
            <span style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>Low stock — reorder needed</span>
          </div>
          {lowStock.map((i) => (
            <div key={i.id} style={{ fontSize: 12.5, color: C.redDeep, padding: "2px 0" }}>
              {i.name}: {i.level} {i.unit} left (minimum {i.min_threshold})
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {[["items", "Items"], ["history", "Movement History"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      {tab === "items" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {withLevels.length === 0 ? <EmptyState icon={Package} title="No inventory items yet" sub={session.role === "admin" ? "Tap + Add Item to start tracking stock" : "Ask admin to add items to track"} /> : (
            withLevels.sort((a, b) => (a.level <= a.min_threshold ? -1 : 1) - (b.level <= b.min_threshold ? -1 : 1)).map((i) => (
              <div key={i.id} style={{ background: "#fff", border: `1px solid ${i.level <= i.min_threshold ? "#E9C3BE" : C.line}`, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                      <span style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{i.name}</span>
                      {i.level <= i.min_threshold && <Badge tone="missing">LOW STOCK</Badge>}
                    </div>
                    <div style={{ fontSize: 13, color: C.ink50, marginTop: 3 }}>
                      <span style={{ fontFamily: FONT_MONO, color: C.ink, fontWeight: 600 }}>{i.level} {i.unit}</span> on hand · minimum {i.min_threshold} {i.unit}
                    </div>
                  </div>
                  {session.role === "admin" && (
                    <button onClick={() => setEditingItem(i)} style={{ background: "none", border: "none", color: C.navy, cursor: "pointer" }}><Edit3 size={15} /></button>
                  )}
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <Btn size="sm" tone="green" icon={DoorOpen} onClick={() => setShowMoveForm({ item: i, type: "IN" })}>Stock In</Btn>
                  <Btn size="sm" tone="red" icon={DoorClosed} onClick={() => setShowMoveForm({ item: i, type: "OUT" })}>Stock Out</Btn>
                </div>
              </div>
            ))
          )}
        </div>
      ) : (
        <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
          {recentMoves.length === 0 ? <EmptyState icon={ClipboardList} title="No movements recorded yet" /> : (
            <TableScroll headers={["Date", "Item", "Type", "Qty", "Person", "Company", "Recorded By"]}>
              {recentMoves.map((m) => {
                const item = itemById[m.item_id];
                return (
                  <tr key={m.id}>
                    <Td>{m.date} {fmtTime(m.time)}</Td>
                    <Td>{item ? item.name : "—"}</Td>
                    <Td><Badge tone={m.type === "IN" ? "inside" : "out"}>{m.type}</Badge></Td>
                    <Td>{m.quantity} {item ? item.unit : ""}</Td>
                    <Td>{m.person_name || "—"}{m.phone ? ` · ${m.phone}` : ""}</Td>
                    <Td>{m.company || "—"}</Td>
                    <Td>{m.recorded_by}</Td>
                  </tr>
                );
              })}
            </TableScroll>
          )}
        </div>
      )}

      {showItemForm && <StockItemForm onClose={() => setShowItemForm(false)} onSave={addItem} />}
      {editingItem && (
        <StockItemForm item={editingItem} onClose={() => setEditingItem(null)} onSave={saveItem}
          onToggleActive={() => { toggleItemActive(editingItem); setEditingItem(null); }} />
      )}
      {showMoveForm && (
        <StockMovementForm item={showMoveForm.item} type={showMoveForm.type} onClose={() => setShowMoveForm(null)} onSave={logMovement} />
      )}
    </div>
  );
}

function StockItemForm({ item, onClose, onSave, onToggleActive }) {
  const isNew = !item;
  const [name, setName] = useState(item?.name || "");
  const [unit, setUnit] = useState(item?.unit || "pcs");
  const [minThreshold, setMinThreshold] = useState(item?.min_threshold ?? 5);
  const [startingQuantity, setStartingQuantity] = useState(0);

  const save = () => {
    if (!name.trim()) return;
    onSave({ name: name.trim(), unit: unit.trim() || "pcs", min_threshold: Number(minThreshold) || 0, starting_quantity: Number(startingQuantity) || 0 });
  };

  return (
    <Modal title={isNew ? "Add Inventory Item" : "Edit Inventory Item"} onClose={onClose}>
      <Field label="Item Name"><input autoFocus style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Tea, Shipping Tags" /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Unit"><input style={inputStyle} value={unit} onChange={(e) => setUnit(e.target.value)} placeholder="boxes, kg, rolls…" /></Field>
        <Field label="Reorder Threshold"><input type="number" min="0" style={inputStyle} value={minThreshold} onChange={(e) => setMinThreshold(e.target.value)} /></Field>
      </div>
      {isNew && (
        <Field label={`Starting Quantity (how much is on hand right now, in ${unit || "units"})`}>
          <input type="number" min="0" style={inputStyle} value={startingQuantity} onChange={(e) => setStartingQuantity(e.target.value)} />
        </Field>
      )}
      <p style={{ fontSize: 12, color: C.ink50, marginTop: -4, marginBottom: 14 }}>
        {isNew ? "This records an initial \"Stock In\" so the item shows the right quantity immediately. You'll get a low-stock warning once it falls to or below the reorder threshold." : "You'll get a low-stock warning once the item's quantity on hand falls to or below this number."}
      </p>
      <Btn full tone="navy" onClick={save} disabled={!name.trim()}>{isNew ? "Add Item" : "Save Changes"}</Btn>
      {!isNew && (
        <div style={{ marginTop: 10 }}>
          <Btn full tone={item.active ? "red" : "green"} onClick={onToggleActive}>{item.active ? "Deactivate Item" : "Reactivate Item"}</Btn>
        </div>
      )}
    </Modal>
  );
}

function StockMovementForm({ item, type, onClose, onSave }) {
  const [quantity, setQuantity] = useState("");
  const [personName, setPersonName] = useState("");
  const [phone, setPhone] = useState("");
  const [company, setCompany] = useState("");
  const [idCard, setIdCard] = useState("");
  const [remarks, setRemarks] = useState("");
  const [backdate, setBackdate] = useState(false);
  const [bdDate, setBdDate] = useState(todayStr());
  const [bdTime, setBdTime] = useState(nowTimeStr().slice(0, 5));
  const [bdError, setBdError] = useState("");

  const save = () => {
    const q = Number(quantity);
    if (!q || q <= 0) return;
    if (backdate) {
      const now = new Date();
      const chosen = new Date(`${bdDate}T${bdTime}:00`);
      if (chosen.getTime() > now.getTime() + 60000) { setBdError("That date/time is in the future"); return; }
    }
    onSave({
      item_id: item.id, type, quantity: q, person_name: personName.trim(), phone: phone.trim(), company: company.trim(),
      id_card_number: idCard.trim(), remarks: remarks.trim(),
      backdateDate: backdate ? bdDate : null, backdateTime: backdate ? bdTime : null,
    });
  };

  return (
    <Modal title={`${type === "IN" ? "Stock In" : "Stock Out"} — ${item.name}`} onClose={onClose}>
      <Field label={`Quantity (${item.unit})`}>
        <input autoFocus type="number" min="1" style={inputStyle} value={quantity} onChange={(e) => setQuantity(e.target.value)} />
      </Field>
      <Field label={type === "IN" ? "Delivered By (person's name)" : "Collected By (person's name)"}>
        <input style={inputStyle} value={personName} onChange={(e) => setPersonName(e.target.value)} />
      </Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Phone (optional)"><input style={inputStyle} value={phone} onChange={(e) => setPhone(e.target.value)} /></Field>
        <Field label={type === "IN" ? "Company / Supplier" : "Department"}><input style={inputStyle} value={company} onChange={(e) => setCompany(e.target.value)} /></Field>
      </div>
      <Field label="ID / Card Number (optional)"><input style={inputStyle} value={idCard} onChange={(e) => setIdCard(e.target.value)} placeholder="whatever ID the gate records, if any" /></Field>

      {!backdate ? (
        <button type="button" onClick={() => { setBackdate(true); setBdError(""); }} style={{
          background: "none", border: "none", color: C.navy, fontSize: 12.5, fontWeight: 600,
          cursor: "pointer", textDecoration: "underline", padding: 0, marginBottom: 14, display: "block",
        }}>
          This actually happened earlier? Set the real date &amp; time
        </button>
      ) : (
        <div style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 9, padding: "12px 14px", marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 9 }}>
            <span style={{ fontSize: 12, fontWeight: 700, color: C.amberDeep, letterSpacing: 0.3 }}>ACTUAL DATE &amp; TIME</span>
            <button type="button" onClick={() => { setBackdate(false); setBdError(""); }} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer", fontSize: 12 }}>Use now instead</button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <input type="date" style={{ ...inputStyle, background: "#fff" }} value={bdDate} max={todayStr()} onChange={(e) => { setBdDate(e.target.value); setBdError(""); }} />
            <input type="time" style={{ ...inputStyle, background: "#fff" }} value={bdTime} onChange={(e) => { setBdTime(e.target.value); setBdError(""); }} />
          </div>
          {bdError && <div style={{ fontSize: 12, color: C.redDeep, marginTop: 6 }}>{bdError}</div>}
        </div>
      )}
      <Field label="Remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      <Btn full tone={type === "IN" ? "green" : "red"} onClick={save} disabled={!Number(quantity)}>Record {type === "IN" ? "Stock In" : "Stock Out"}</Btn>
    </Modal>
  );
}

/* ---------------------------------------------------------------------
   SHIFT HANDOVER / TAKEOVER
   The outgoing guard checks off every piece of equipment and pass count
   on the post, then the incoming guard reviews and formally takes over.
   Anything missing is flagged immediately and can be emailed straight to
   a manager rather than waiting for a scheduled report.
--------------------------------------------------------------------- */
function HandoverScreen({ session, users, handoverItems, handoverRecords, persistHandoverItems, persistHandoverRecords, settings, persistSettings, notify }) {
  const [tab, setTab] = useState("current");
  const [showStart, setShowStart] = useState(false);
  const [takingOver, setTakingOver] = useState(null);
  const [managingItems, setManagingItems] = useState(false);

  const pending = handoverRecords.find((r) => r.status === "PENDING");
  const activeItems = handoverItems.filter((i) => i.active);
  const history = useMemo(() => [...handoverRecords].filter((r) => r.status === "COMPLETED").sort((a, b) => (b.date + b.time_out).localeCompare(a.date + a.time_out)), [handoverRecords]);

  const startHandover = async (data) => {
    const now = new Date();
    const missing = data.items.filter((it) => !handoverItemOk(it));
    const rec = {
      id: uid("ho_"), date: todayStr(now), time_out: nowTimeStr(now), time_in: null,
      outgoing_guard: session.name, incoming_guard_expected: data.incoming_guard_expected, incoming_guard_confirmed: null,
      status: "PENDING", items: data.items, remarks_out: data.remarks, remarks_in: "",
      created_at: Date.now(), updated_at: Date.now(),
    };
    await persistHandoverRecords([rec, ...handoverRecords]);
    setShowStart(false);
    notify("Handover submitted — waiting for the next guard to take over");
    if (missing.length > 0) notify(`${missing.length} item(s) flagged as missing or short`, "error");
  };

  const completeTakeover = async (remarksIn, updatedItems) => {
    const now = new Date();
    const updated = { ...pending, status: "COMPLETED", time_in: nowTimeStr(now), incoming_guard_confirmed: session.name, remarks_in: remarksIn, items: updatedItems, updated_at: Date.now() };
    await persistHandoverRecords(handoverRecords.map((r) => (r.id === pending.id ? updated : r)));
    setTakingOver(null);
    notify("Shift taken over");
  };

  const sendMissingAlert = async (record) => {
    const alert = settings.handover_alert || { recipient_name: "", recipient_email: "" };
    if (!alert.recipient_email) { notify("Add a manager's email in Settings → Handover Alerts first", "error"); return; }
    const missing = record.items.filter((it) => !handoverItemOk(it));
    const subject = `Gate Handover — ${missing.length} item(s) missing or short (${record.date})`;
    const lines = [
      `Shift handover reported missing/short items.`, `Date: ${fmtDate(record.date)}`, `Outgoing guard: ${record.outgoing_guard}`,
      `Incoming guard: ${record.incoming_guard_confirmed || record.incoming_guard_expected}`, "", "Missing / short:",
      ...missing.map((it) => it.type === "quantity" ? `- ${it.name}: ${it.actual_quantity ?? 0} / ${it.expected_quantity} expected` : `- ${it.name}: missing`),
      "", record.remarks_out ? `Outgoing notes: ${record.remarks_out}` : "", record.remarks_in ? `Incoming notes: ${record.remarks_in}` : "",
      "", "Sent from the Aramex Gatehouse Register app.",
    ].filter(Boolean);
    const mailto = `mailto:${encodeURIComponent(alert.recipient_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;
    const a = document.createElement("a"); a.href = mailto; a.target = "_blank";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    notify("Alert ready — check your email app");
  };

  return (
    <div>
      <SectionTitle title="Shift Handover" sub={pending ? "A handover is waiting to be taken over" : "No handover currently pending"}
        action={session.role === "admin" ? { label: "Manage Checklist", onClick: () => setManagingItems(true) } : undefined} />

      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {[["current", "Current"], ["history", "History"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      {tab === "current" ? (
        <div>
          {pending ? (
            <div style={{ background: "#fff", border: `2px solid ${C.amber}`, borderRadius: 12, padding: 18, marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                <RefreshCw size={17} color={C.amberDeep} />
                <span style={{ fontWeight: 700, fontSize: 14.5, color: C.amberDeep }}>Pending Takeover</span>
              </div>
              <div style={{ fontSize: 13, color: C.ink, marginBottom: 4 }}>Handed over by <b>{pending.outgoing_guard}</b> at {fmtTime(pending.time_out)}</div>
              <div style={{ fontSize: 13, color: C.ink50, marginBottom: 12 }}>Expected incoming guard: {pending.incoming_guard_expected}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 12 }}>
                {pending.items.map((it) => (
                  <div key={it.item_id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "3px 0", borderBottom: `1px dashed ${C.line}` }}>
                    <span>{it.name}</span>
                    {it.type === "quantity" ? (
                      <span style={{ fontFamily: FONT_MONO, color: handoverItemOk(it) ? C.greenDeep : C.redDeep, fontWeight: 600 }}>{it.actual_quantity ?? 0} / {it.expected_quantity}</span>
                    ) : (
                      <Badge tone={it.present ? "inside" : "missing"}>{it.present ? "OK" : "MISSING"}</Badge>
                    )}
                  </div>
                ))}
              </div>
              {pending.remarks_out && <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 12 }}>Notes from outgoing guard: {pending.remarks_out}</div>}
              {pending.items.some((it) => !handoverItemOk(it)) && (
                <div style={{ background: "#FEE2E2", color: C.redDeep, borderRadius: 8, padding: "9px 11px", fontSize: 12.5, marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <span>Some items are missing or short.</span>
                  <Btn size="sm" tone="red" onClick={() => sendMissingAlert(pending)}>Alert Manager</Btn>
                </div>
              )}
              <Btn full tone="amber" icon={RefreshCw} onClick={() => setTakingOver(pending)}>Take Over Shift</Btn>
            </div>
          ) : (
            <div style={{ marginBottom: 16 }}>
              <EmptyState icon={RefreshCw} title="No handover pending" sub="Starting a new handover below will post it for the next guard" />
            </div>
          )}

          <Btn full tone="navy" icon={DoorOpen} onClick={() => setShowStart(true)} disabled={!!pending}>
            {pending ? "Complete the pending takeover first" : "+ Start Handover (End of My Shift)"}
          </Btn>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {history.length === 0 ? <EmptyState icon={ClipboardList} title="No completed handovers yet" /> : (
            history.map((r) => {
              const missing = r.items.filter((it) => !handoverItemOk(it));
              return (
                <div key={r.id} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                    <span style={{ fontWeight: 600, fontSize: 13.5 }}>{fmtDate(r.date)}</span>
                    {missing.length > 0 ? <Badge tone="missing">{missing.length} ISSUE(S)</Badge> : <Badge tone="inside">ALL CLEAR</Badge>}
                  </div>
                  <div style={{ fontSize: 12.5, color: C.ink50 }}>{r.outgoing_guard} → {r.incoming_guard_confirmed} · {fmtTime(r.time_out)} to {fmtTime(r.time_in)}</div>
                  {missing.length > 0 && <div style={{ fontSize: 12, color: C.redDeep, marginTop: 4 }}>{missing.map((m) => m.name).join(", ")}</div>}
                </div>
              );
            })
          )}
        </div>
      )}

      {showStart && <HandoverForm items={activeItems} users={users} session={session} onClose={() => setShowStart(false)} onSave={startHandover} />}
      {takingOver && <TakeoverForm record={takingOver} onClose={() => setTakingOver(null)} onConfirm={completeTakeover} />}
      {managingItems && (
        <HandoverItemsManager items={handoverItems} persistItems={persistHandoverItems}
          settings={settings} persistSettings={persistSettings} notify={notify} onClose={() => setManagingItems(false)} />
      )}
    </div>
  );
}

function HandoverForm({ items, users, session, onClose, onSave }) {
  const [state, setState] = useState(() => Object.fromEntries(items.map((i) => [i.id, i.type === "check" ? true : i.expected_quantity])));
  const [incomingGuard, setIncomingGuard] = useState("");
  const [remarks, setRemarks] = useState("");

  const otherUsers = users.filter((u) => u.active && u.name !== session.name);

  const save = () => {
    if (!incomingGuard.trim()) return;
    const builtItems = items.map((i) => ({
      item_id: i.id, name: i.name, type: i.type,
      present: i.type === "check" ? !!state[i.id] : null,
      expected_quantity: i.expected_quantity,
      actual_quantity: i.type === "quantity" ? Number(state[i.id]) : null,
    }));
    onSave({ incoming_guard_expected: incomingGuard.trim(), remarks: remarks.trim(), items: builtItems });
  };

  return (
    <Modal title="Start Shift Handover" onClose={onClose} wide>
      <Field label="Incoming guard">
        <select style={inputStyle} value={incomingGuard} onChange={(e) => setIncomingGuard(e.target.value)}>
          <option value="">Select…</option>
          {otherUsers.map((u) => <option key={u.id} value={u.name}>{u.name}</option>)}
        </select>
      </Field>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink50, margin: "6px 0" }}>CHECKLIST</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
        {items.map((i) => (
          <div key={i.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.paperDim, borderRadius: 8, padding: "9px 12px" }}>
            <span style={{ fontSize: 13.5 }}>{i.name}</span>
            {i.type === "check" ? (
              <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer" }}>
                <input type="checkbox" checked={!!state[i.id]} onChange={(e) => setState((s) => ({ ...s, [i.id]: e.target.checked }))} />
                <span style={{ fontSize: 12.5, color: state[i.id] ? C.greenDeep : C.redDeep, fontWeight: 600 }}>{state[i.id] ? "Present" : "Missing"}</span>
              </label>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <input type="number" min="0" style={{ ...inputStyle, width: 72, padding: "6px 8px" }} value={state[i.id]} onChange={(e) => setState((s) => ({ ...s, [i.id]: e.target.value }))} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink50 }}>/ {i.expected_quantity}</span>
              </div>
            )}
          </div>
        ))}
      </div>
      <Field label="Remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      <Btn full tone="navy" onClick={save} disabled={!incomingGuard.trim()}>Submit Handover</Btn>
    </Modal>
  );
}

function TakeoverForm({ record, onClose, onConfirm }) {
  const [items, setItems] = useState(record.items);
  const [remarks, setRemarks] = useState("");

  const toggleCheck = (itemId) => setItems((list) => list.map((i) => (i.item_id === itemId ? { ...i, present: !i.present } : i)));
  const setQty = (itemId, val) => setItems((list) => list.map((i) => (i.item_id === itemId ? { ...i, actual_quantity: Number(val) } : i)));

  return (
    <Modal title="Take Over Shift" onClose={onClose} wide>
      <p style={{ fontSize: 12.5, color: C.ink50, marginTop: 0 }}>Review what the outgoing guard reported. Adjust anything that doesn't match what you actually find.</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
        {items.map((i) => (
          <div key={i.item_id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.paperDim, borderRadius: 8, padding: "9px 12px" }}>
            <span style={{ fontSize: 13.5 }}>{i.name}</span>
            {i.type === "check" ? (
              <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer" }}>
                <input type="checkbox" checked={!!i.present} onChange={() => toggleCheck(i.item_id)} />
                <span style={{ fontSize: 12.5, color: i.present ? C.greenDeep : C.redDeep, fontWeight: 600 }}>{i.present ? "Present" : "Missing"}</span>
              </label>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <input type="number" min="0" style={{ ...inputStyle, width: 72, padding: "6px 8px" }} value={i.actual_quantity ?? 0} onChange={(e) => setQty(i.item_id, e.target.value)} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink50 }}>/ {i.expected_quantity}</span>
              </div>
            )}
          </div>
        ))}
      </div>
      <Field label="Your remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      <Btn full tone="amber" onClick={() => onConfirm(remarks.trim(), items)}>Confirm Takeover</Btn>
    </Modal>
  );
}

function HandoverItemsManager({ items, persistItems, settings, persistSettings, notify, onClose }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [newType, setNewType] = useState("check");
  const [newQty, setNewQty] = useState(10);
  const alert0 = settings.handover_alert || { recipient_name: "", recipient_email: "" };
  const [alertForm, setAlertForm] = useState(alert0);

  const addItem = async () => {
    if (!newName.trim()) return;
    await persistItems([{ id: uid("hi_"), name: newName.trim(), type: newType, expected_quantity: newType === "quantity" ? Number(newQty) || 0 : null, active: true, created_at: Date.now() }, ...items]);
    setNewName(""); setNewQty(10); setAdding(false);
    notify("Checklist item added");
  };
  const toggleActive = async (item) => {
    await persistItems(items.map((i) => (i.id === item.id ? { ...i, active: !i.active } : i)));
  };
  const saveAlert = async () => {
    if (alertForm.recipient_email && !alertForm.recipient_name) { notify("Add a name for the recipient too", "error"); return; }
    await persistSettings({ ...settings, handover_alert: alertForm });
    notify("Handover alert settings saved");
  };

  return (
    <Modal title="Manage Handover Checklist" onClose={onClose} wide>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>Checklist Items</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {items.map((i) => (
            <div key={i.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.paperDim, borderRadius: 7, padding: "7px 10px" }}>
              <span style={{ fontSize: 13, opacity: i.active ? 1 : 0.5 }}>{i.name} {i.type === "quantity" ? `(expect ${i.expected_quantity})` : ""}{!i.active ? " — inactive" : ""}</span>
              <button onClick={() => toggleActive(i)} style={{ background: "none", border: `1px solid ${C.line}`, borderRadius: 6, padding: "3px 8px", fontSize: 11, cursor: "pointer" }}>{i.active ? "Remove" : "Restore"}</button>
            </div>
          ))}
        </div>
        {!adding ? (
          <Btn size="sm" tone="paper" icon={UserPlus} onClick={() => setAdding(true)}>Add Item</Btn>
        ) : (
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 8, padding: 10 }}>
            <Field label="Item name"><input style={inputStyle} value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="e.g. Torch, Radio" /></Field>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              <Field label="Type">
                <select style={inputStyle} value={newType} onChange={(e) => setNewType(e.target.value)}>
                  <option value="check">Checkbox (present/missing)</option>
                  <option value="quantity">Quantity (count)</option>
                </select>
              </Field>
              {newType === "quantity" && <Field label="Expected quantity"><input type="number" min="0" style={inputStyle} value={newQty} onChange={(e) => setNewQty(e.target.value)} /></Field>}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn size="sm" tone="ghost" onClick={() => setAdding(false)}>Cancel</Btn>
              <Btn size="sm" tone="navy" onClick={addItem} disabled={!newName.trim()}>Add</Btn>
            </div>
          </div>
        )}
      </div>

      <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 14 }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>Handover Alert Email</div>
        <p style={{ fontSize: 12, color: C.ink50, margin: "0 0 10px" }}>Who gets notified immediately when a handover has missing or short items.</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <Field label="Manager's name"><input style={inputStyle} value={alertForm.recipient_name} onChange={(e) => setAlertForm((f) => ({ ...f, recipient_name: e.target.value }))} /></Field>
          <Field label="Manager's email"><input type="email" style={inputStyle} value={alertForm.recipient_email} onChange={(e) => setAlertForm((f) => ({ ...f, recipient_email: e.target.value }))} /></Field>
        </div>
        <Btn size="sm" tone="navy" onClick={saveAlert}>Save</Btn>
      </div>
    </Modal>
  );
}

/* ---------------------------------------------------------------------
   INCIDENT REPORTS
   Anything out of the ordinary at the gate — theft, fire, altercation,
   safety hazard, trespassing, and so on — with severity levels and an
   immediate manager alert for anything serious, separate from the
   scheduled reports.
--------------------------------------------------------------------- */
const INCIDENT_TYPES = ["Theft", "Fire", "Altercation / Dispute", "Safety Hazard", "Trespassing", "Medical Emergency", "Property Damage", "Suspicious Activity", "Other"];
const INCIDENT_SEVERITIES = ["Low", "Medium", "High", "Critical"];
const INCIDENT_STATUSES = ["Open", "Under Investigation", "Resolved", "Closed"];

function severityTone(sev) {
  if (sev === "Critical" || sev === "High") return "missing";
  if (sev === "Medium") return "overtime";
  return "neutral";
}

function IncidentsScreen({ session, incidents, persistIncidents, settings, persistSettings, notify }) {
  const [tab, setTab] = useState("open");
  const [showForm, setShowForm] = useState(false);
  const [viewing, setViewing] = useState(null);
  const [alertSettings, setAlertSettings] = useState(false);

  const sorted = useMemo(() => [...incidents].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)), [incidents]);
  const open = sorted.filter((i) => i.status === "Open" || i.status === "Under Investigation");
  const list = tab === "open" ? open : sorted;

  const report = async (data) => {
    const now = new Date();
    const rec = {
      id: uid("inc_"), date: todayStr(now), time: nowTimeStr(now), ...data,
      status: "Open", reported_by: session.name, resolved_by: null, resolution_notes: "",
      created_at: Date.now(), updated_at: Date.now(),
    };
    await persistIncidents([rec, ...incidents]);
    setShowForm(false);
    notify("Incident reported");
  };

  const updateStatus = async (incident, status, resolutionNotes) => {
    const updated = {
      ...incident, status, updated_at: Date.now(),
      resolution_notes: resolutionNotes != null ? resolutionNotes : incident.resolution_notes,
      resolved_by: (status === "Resolved" || status === "Closed") ? session.name : incident.resolved_by,
    };
    await persistIncidents(incidents.map((i) => (i.id === incident.id ? updated : i)));
    setViewing(updated);
    notify("Incident updated");
  };

  const sendAlert = async (incident) => {
    const alert = settings.incident_alert || { recipient_name: "", recipient_email: "" };
    if (!alert.recipient_email) { notify("Add a manager's email in Alert Settings first", "error"); return; }
    const subject = `[${incident.severity.toUpperCase()}] Incident: ${incident.type} — ${fmtDate(incident.date)}`;
    const lines = [
      `Incident Report`, `Type: ${incident.type}`, `Severity: ${incident.severity}`, `Date/Time: ${fmtDate(incident.date)} ${fmtTime(incident.time)}`,
      `Location: ${incident.location || "—"}`, `Reported by: ${incident.reported_by}`, "",
      `Description:`, incident.description || "—", "",
      incident.people_involved ? `People involved: ${incident.people_involved}` : "",
      incident.action_taken ? `Action taken: ${incident.action_taken}` : "",
      "", "Sent from the Aramex Gatehouse Register app.",
    ].filter(Boolean);
    const mailto = `mailto:${encodeURIComponent(alert.recipient_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;
    const a = document.createElement("a"); a.href = mailto; a.target = "_blank";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    notify("Alert ready — check your email app");
  };

  return (
    <div>
      <SectionTitle title="Incident Reports" sub={`${open.length} open`} action={{ label: "+ Report Incident", onClick: () => setShowForm(true) }} />
      {session.role === "admin" && (
        <button onClick={() => setAlertSettings(true)} style={{ background: "none", border: "none", color: C.navy, fontSize: 12, fontWeight: 600, cursor: "pointer", textDecoration: "underline", marginBottom: 12, display: "block" }}>
          Alert Settings
        </button>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {[["open", `Open (${open.length})`], ["all", "All"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {list.length === 0 ? <EmptyState icon={AlertTriangle} title={tab === "open" ? "No open incidents" : "No incidents reported yet"} /> : (
          list.map((i) => (
            <button key={i.id} onClick={() => setViewing(i)} style={{ textAlign: "left", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px", cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 600, fontSize: 14, color: C.ink }}>{i.type}</span>
                    <Badge tone={severityTone(i.severity)}>{i.severity.toUpperCase()}</Badge>
                    <Badge tone="neutral">{i.status.toUpperCase()}</Badge>
                  </div>
                  <div style={{ fontSize: 12.5, color: C.ink50, marginTop: 3 }}>{i.location || "—"} · {fmtDate(i.date)} {fmtTime(i.time)}</div>
                  <div style={{ fontSize: 12.5, color: C.ink, marginTop: 4 }}>{i.description}</div>
                  <div style={{ fontSize: 11.5, color: C.ink50, marginTop: 4 }}>Reported by {i.reported_by}</div>
                </div>
                <ChevronRight size={16} color={C.ink50} style={{ flexShrink: 0 }} />
              </div>
            </button>
          ))
        )}
      </div>

      {showForm && <IncidentForm onClose={() => setShowForm(false)} onSave={report} />}
      {viewing && (
        <IncidentDetailModal incident={viewing} onClose={() => setViewing(null)} onUpdateStatus={updateStatus} onAlert={sendAlert} />
      )}
      {alertSettings && (
        <IncidentAlertSettings settings={settings} persistSettings={persistSettings} notify={notify} onClose={() => setAlertSettings(false)} />
      )}
    </div>
  );
}

function IncidentForm({ onClose, onSave }) {
  const [type, setType] = useState(INCIDENT_TYPES[0]);
  const [severity, setSeverity] = useState("Low");
  const [location, setLocation] = useState("");
  const [description, setDescription] = useState("");
  const [peopleInvolved, setPeopleInvolved] = useState("");
  const [actionTaken, setActionTaken] = useState("");

  const save = () => {
    if (!description.trim()) return;
    onSave({ type, severity, location: location.trim(), description: description.trim(), people_involved: peopleInvolved.trim(), action_taken: actionTaken.trim() });
  };

  return (
    <Modal title="Report Incident" onClose={onClose} wide>
      <Field label="Type">
        <select style={inputStyle} value={type} onChange={(e) => setType(e.target.value)}>
          {INCIDENT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
      </Field>
      <Field label="Severity">
        <div style={{ display: "flex", gap: 6 }}>
          {INCIDENT_SEVERITIES.map((s) => (
            <button key={s} type="button" onClick={() => setSeverity(s)} style={{
              flex: 1, padding: "8px 6px", borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${severity === s ? C.navy : C.line}`, background: severity === s ? C.navy : "#fff", color: severity === s ? "#fff" : C.ink,
            }}>{s}</button>
          ))}
        </div>
      </Field>
      <Field label="Location"><input style={inputStyle} value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Main Gate, Loading Bay 2" /></Field>
      <Field label="Description"><textarea style={{ ...inputStyle, minHeight: 80 }} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What happened?" /></Field>
      <Field label="People Involved (optional)"><input style={inputStyle} value={peopleInvolved} onChange={(e) => setPeopleInvolved(e.target.value)} /></Field>
      <Field label="Immediate Action Taken (optional)"><input style={inputStyle} value={actionTaken} onChange={(e) => setActionTaken(e.target.value)} /></Field>
      <Btn full tone="red" icon={AlertTriangle} onClick={save} disabled={!description.trim()}>Submit Report</Btn>
    </Modal>
  );
}

function IncidentDetailModal({ incident, onClose, onUpdateStatus, onAlert }) {
  const [notes, setNotes] = useState(incident.resolution_notes || "");

  return (
    <Modal title={incident.type} onClose={onClose} wide>
      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        <Badge tone={severityTone(incident.severity)}>{incident.severity.toUpperCase()}</Badge>
        <Badge tone="neutral">{incident.status.toUpperCase()}</Badge>
      </div>
      <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 10 }}>
        {incident.location || "—"} · {fmtDate(incident.date)} {fmtTime(incident.time)} · Reported by {incident.reported_by}
      </div>
      <div style={{ fontSize: 13.5, color: C.ink, marginBottom: 10, lineHeight: 1.5 }}>{incident.description}</div>
      {incident.people_involved && <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 6 }}>People involved: {incident.people_involved}</div>}
      {incident.action_taken && <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 6 }}>Action taken: {incident.action_taken}</div>}

      {(incident.severity === "High" || incident.severity === "Critical") && incident.status !== "Closed" && (
        <div style={{ background: "#FEE2E2", borderRadius: 8, padding: "9px 11px", marginBottom: 14, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <span style={{ fontSize: 12.5, color: C.redDeep, fontWeight: 600 }}>{incident.severity} severity — consider alerting a manager</span>
          <Btn size="sm" tone="red" onClick={() => onAlert(incident)}>Alert Manager</Btn>
        </div>
      )}

      <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 14 }}>
        <Field label="Resolution notes"><textarea style={{ ...inputStyle, minHeight: 60 }} value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink50, marginBottom: 8 }}>Update status</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {INCIDENT_STATUSES.map((s) => (
            <button key={s} type="button" onClick={() => onUpdateStatus(incident, s, notes)} style={{
              padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${incident.status === s ? C.navy : C.line}`, background: incident.status === s ? C.navy : "#fff", color: incident.status === s ? "#fff" : C.ink,
            }}>{s}</button>
          ))}
        </div>
      </div>
    </Modal>
  );
}

function IncidentAlertSettings({ settings, persistSettings, notify, onClose }) {
  const alert0 = settings.incident_alert || { recipient_name: "", recipient_email: "" };
  const [form, setForm] = useState(alert0);

  const save = async () => {
    await persistSettings({ ...settings, incident_alert: form });
    notify("Incident alert settings saved");
    onClose();
  };

  return (
    <Modal title="Incident Alert Settings" onClose={onClose}>
      <p style={{ fontSize: 12.5, color: C.ink50, marginTop: 0 }}>Who gets the "Alert Manager" email for High or Critical severity incidents.</p>
      <Field label="Manager's name"><input style={inputStyle} value={form.recipient_name} onChange={(e) => setForm((f) => ({ ...f, recipient_name: e.target.value }))} /></Field>
      <Field label="Manager's email"><input type="email" style={inputStyle} value={form.recipient_email} onChange={(e) => setForm((f) => ({ ...f, recipient_email: e.target.value }))} /></Field>
      <Btn full tone="navy" onClick={save}>Save</Btn>
    </Modal>
  );
}

const ORIGIN_NAMES = Object.fromEntries(ORIGIN_TABLE.split("|").map((x) => { const i = x.indexOf(":"); return [x.slice(0, i), x.slice(i + 1)]; }));
function originName(code, custom) {
  const c = String(code || "").trim().toUpperCase();
  if (!c) return "";
  return (custom && custom[c]) || ORIGIN_NAMES[c] || "";
}
function originLabel(code, custom) {
  const c = String(code || "").trim().toUpperCase();
  if (!c) return "";
  const n = originName(c, custom);
  return n ? `${c} — ${n}` : c;
}
function shipRef(s) { return (s.arrival_no || s.awb || "—"); }
function shipKey(s) { return String(s.arrival_no || s.awb || "").trim().toUpperCase(); }

function shipmentAgeMs(s) {
  return Date.now() - new Date(`${s.date_in}T${s.time_in}`).getTime();
}
function shipmentState(s, thresholdDays) {
  if (s.status !== "IN_WAREHOUSE") return "DISPATCHED";
  const limit = (thresholdDays || 3) * 86400000;
  const age = shipmentAgeMs(s);
  if (age >= limit) return "OVERDUE";
  if (age >= limit * 0.75) return "DUE_SOON";
  return "OK";
}
function fmtAgeMs(ms) {
  const mins = Math.max(0, Math.floor(ms / 60000));
  const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}
function dayKeys() {
  return {
    today: todayStr(),
    yesterday: todayStr(new Date(Date.now() - 86400000)),
    d2: todayStr(new Date(Date.now() - 2 * 86400000)),
  };
}
function dayLabelFor(dateStr, keys) {
  const k = keys || dayKeys();
  if (!dateStr) return "";
  if (dateStr === k.today) return "Today";
  if (dateStr === k.yesterday) return "Yesterday";
  if (dateStr === k.d2) return "2 days ago";
  return new Date(dateStr + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function inDayBucket(dateStr, bucket, keys) {
  if (!dateStr) return false;
  if (bucket === "all") return true;
  if (bucket === "today") return dateStr === keys.today;
  if (bucket === "yesterday") return dateStr === keys.yesterday;
  if (bucket === "d2") return dateStr === keys.d2;
  if (bucket === "older") return dateStr < keys.d2;
  return false;
}
const SHIPMENT_DAY_CHIPS = [["today", "Today"], ["yesterday", "Yesterday"], ["d2", "2 Days Ago"], ["older", "Older"], ["all", "All"]];
const HOLD_REASONS = ["Waiting for consignee to collect", "Customs / documents pending", "Under inspection", "Consignee not reachable", "Damaged — awaiting instructions", "Other"];

function BackdateDateTime({ active, setActive, date, setDate, time, setTime, error, setError, label }) {
  if (!active) {
    return (
      <button type="button" onClick={() => { setActive(true); setError(""); }} style={{
        background: "none", border: "none", color: C.navy, fontSize: 12.5, fontWeight: 600,
        cursor: "pointer", textDecoration: "underline", padding: 0, marginBottom: 14, display: "block",
      }}>{label}</button>
    );
  }
  return (
    <div style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 9, padding: "12px 14px", marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 9 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: C.amberDeep, letterSpacing: 0.3 }}>ACTUAL DATE &amp; TIME</span>
        <button type="button" onClick={() => { setActive(false); setError(""); }} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer", fontSize: 12 }}>Use now instead</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        <input type="date" style={{ ...inputStyle, background: "#fff" }} value={date} max={todayStr()} onChange={(e) => { setDate(e.target.value); setError(""); }} />
        <input type="time" style={{ ...inputStyle, background: "#fff" }} value={time} onChange={(e) => { setTime(e.target.value); setError(""); }} />
      </div>
      {error && <div style={{ fontSize: 12, color: C.redDeep, marginTop: 6 }}>{error}</div>}
    </div>
  );
}

function OriginField({ value, onChange, custom }) {
  const name = originName(value, custom);
  return (
    <Field label="Origin (short code, e.g. AUH, LON)">
      <input style={{ ...inputStyle, fontFamily: FONT_MONO, textTransform: "uppercase" }} value={value} onChange={(e) => onChange(e.target.value.toUpperCase())} maxLength={4} autoCapitalize="characters" placeholder="AUH" />
      {value.trim() && (
        <div style={{ fontSize: 12, marginTop: 4, color: name ? C.greenDeep : C.amberDeep }}>{name ? `✓ ${name}` : "Code not in the list — it will be saved as typed (admin can add its name)."}</div>
      )}
    </Field>
  );
}

function ShipmentsScreen({ session, shipments, persistShipments, settings, persistSettings, notify, sendReport }) {
  const threshold = settings.shipment_threshold_days || 3;
  const custom = settings.origin_custom || {};
  const keys = dayKeys();
  const [day, setDay] = useState("today");
  const [mode, setMode] = useState("arrived");
  const [q, setQ] = useState("");
  const [showReceive, setShowReceive] = useState(false);
  const [showScan, setShowScan] = useState(false);
  const [releasing, setReleasing] = useState(null);
  const [noting, setNoting] = useState(null);
  const [showThreshold, setShowThreshold] = useState(false);
  const [showCodes, setShowCodes] = useState(false);

  const inWh = useMemo(() => shipments.filter((s) => s.status === "IN_WAREHOUSE").sort((a, b) => (a.date_in + a.time_in).localeCompare(b.date_in + b.time_in)), [shipments]);
  const overdue = inWh.filter((s) => shipmentState(s, threshold) === "OVERDUE");
  const carry = inWh.filter((s) => s.date_in < keys.today);
  const carryBy = [
    ["yesterday", "Yesterday", carry.filter((s) => s.date_in === keys.yesterday).length],
    ["d2", "2 days ago", carry.filter((s) => s.date_in === keys.d2).length],
    ["older", "Older", carry.filter((s) => s.date_in < keys.d2).length],
  ].filter((x) => x[2] > 0);

  const inMode = (s, bucket, m) => {
    if (m === "arrived") return inDayBucket(s.date_in, bucket, keys);
    if (m === "released") return s.status === "DISPATCHED" && inDayBucket(s.date_out, bucket, keys);
    return s.status === "IN_WAREHOUSE" && inDayBucket(s.date_in, bucket, keys);
  };
  const countFor = (bucket, m) => shipments.filter((s) => inMode(s, bucket, m)).length;

  const matches = (s) => {
    if (!q.trim()) return true;
    const t = q.toLowerCase();
    return [s.arrival_no, s.awb, s.origin, originName(s.origin, custom), s.brought_by_name, s.brought_by_id, s.taken_by_name, s.taken_by_id, s.destination].some((v) => (v || "").toLowerCase().includes(t));
  };
  const list = shipments.filter((s) => inMode(s, day, mode)).filter(matches).sort((a, b) => {
    if (mode === "remaining") return (a.date_in + a.time_in).localeCompare(b.date_in + b.time_in);
    if (mode === "released") return ((b.date_out || "") + (b.time_out || "")).localeCompare((a.date_out || "") + (a.time_out || ""));
    return (b.date_in + b.time_in).localeCompare(a.date_in + a.time_in);
  }).slice(0, 300);

  const baseRecord = (now, fields, backdateDate, backdateTime) => ({
    ...fields, status: "IN_WAREHOUSE",
    date_in: backdateDate || todayStr(now), time_in: backdateTime ? `${backdateTime}:00` : nowTimeStr(now),
    received_by: session.name, date_out: null, time_out: null,
    taken_by_name: "", taken_by_company: "", taken_by_phone: "", taken_by_id: "", destination: "", released_by: null, remarks_out: "",
    hold_notes: [], created_at: Date.now(), updated_at: Date.now(),
  });

  const receive = async (data) => {
    const now = new Date();
    const { backdateDate, backdateTime, ...fields } = data;
    const rec = { id: uid("sh_"), ...baseRecord(now, fields, backdateDate, backdateTime) };
    await persistShipments([rec, ...shipments]);
    setShowReceive(false);
    notify(`Shipment ${shipRef(rec)} received`);
  };

  const receiveBulk = async (items, shared) => {
    const now = new Date();
    const { backdateDate, backdateTime, ...fields } = shared;
    const recs = items.map((it) => ({ id: uid("sh_"), arrival_no: it.arrival || "", awb: it.awb || "", origin: (it.origin || "").toUpperCase(), ...baseRecord(now, fields, backdateDate, backdateTime) }));
    await persistShipments([...recs, ...shipments]);
    setShowScan(false);
    setDay("today"); setMode("arrived");
    notify(`${recs.length} shipment${recs.length === 1 ? "" : "s"} received`);
  };

  const release = async (shipment, data) => {
    const now = new Date();
    const { backdateDate, backdateTime, ...fields } = data;
    const updated = {
      ...shipment, ...fields, status: "DISPATCHED",
      date_out: backdateDate || todayStr(now), time_out: backdateTime ? `${backdateTime}:00` : nowTimeStr(now),
      released_by: session.name, updated_at: Date.now(),
    };
    await persistShipments(shipments.map((s) => (s.id === shipment.id ? updated : s)));
    setReleasing(null);
    notify(`Shipment ${shipRef(shipment)} released`);
  };

  const addNote = async (shipment, text) => {
    const now = new Date();
    const note = { date: todayStr(now), time: nowTimeStr(now), by: session.name, text };
    const updated = { ...shipment, hold_notes: [...(shipment.hold_notes || []), note], updated_at: Date.now() };
    await persistShipments(shipments.map((s) => (s.id === shipment.id ? updated : s)));
    setNoting(null);
    notify("Reason noted");
  };

  const exportCSV = () => {
    const dk = dayKeys();
    const headers = [
      { label: "Arrival No.", get: (r) => r.arrival_no || "" }, { label: "AWB", get: (r) => r.awb || "" }, { label: "Status", get: (r) => r.status },
      { label: "Origin Code", get: (r) => r.origin || "" }, { label: "Origin", get: (r) => originName(r.origin, custom) },
      { label: "Arrived Date", get: (r) => r.date_in }, { label: "Arrived Day", get: (r) => dayLabelFor(r.date_in, dk) }, { label: "Time In", get: (r) => r.time_in },
      { label: "Brought By", get: (r) => r.brought_by_name }, { label: "Brought By ID", get: (r) => r.brought_by_id || "" },
      { label: "Date Out", get: (r) => r.date_out || "" }, { label: "Time Out", get: (r) => r.time_out || "" },
      { label: "Destination", get: (r) => r.destination || "" },
      { label: "Taken By (Staff)", get: (r) => r.taken_by_name }, { label: "Staff Number", get: (r) => r.taken_by_id || "" },
      { label: "Days in Warehouse", get: (r) => {
        const end = r.status === "DISPATCHED" ? new Date(`${r.date_out}T${r.time_out}`).getTime() : Date.now();
        return (Math.max(0, end - new Date(`${r.date_in}T${r.time_in}`).getTime()) / 86400000).toFixed(1);
      } },
      { label: "Why Still Here (notes)", get: (r) => (r.hold_notes || []).map((n) => `${n.date} ${n.by}: ${n.text}`).join(" | ") },
      { label: "Remarks In", get: (r) => r.remarks_in || "" }, { label: "Remarks Out", get: (r) => r.remarks_out || "" },
      { label: "Logged In By (system)", get: (r) => r.received_by || "" }, { label: "Logged Out By (system)", get: (r) => r.released_by || "" },
    ];
    downloadFile(`shipments-${todayStr()}.csv`, toCSV(shipments, headers), "text/csv");
  };

  const dayName = SHIPMENT_DAY_CHIPS.find((c) => c[0] === day)[1];
  const modeTiles = [
    ["arrived", "Received", countFor(day, "arrived"), C.navy],
    ["released", "Released", countFor(day, "released"), C.green],
    ["remaining", "Still in warehouse", countFor(day, "remaining"), countFor(day, "remaining") > 0 && day !== "today" && day !== "all" ? C.red : C.amber],
  ];

  return (
    <div>
      <SectionTitle title="Shipments" sub={`${inWh.length} in warehouse${overdue.length ? ` · ${overdue.length} overdue` : ""}`} action={{ label: "+ Receive Shipment", onClick: () => setShowReceive(true) }} />

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        <Btn size="sm" tone="navy" icon={Camera} onClick={() => setShowScan(true)}>Scan / Paste Manifest</Btn>
        <Btn size="sm" tone="paper" icon={FileDown} onClick={() => sendReport("shipments", "daily")}>Send Day Report to Manager</Btn>
      </div>
      <div style={{ display: "flex", gap: 14, alignItems: "center", marginBottom: 12, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12.5, color: C.ink50 }}>Flag after <b style={{ color: C.ink }}>{threshold} day{threshold === 1 ? "" : "s"}</b> in warehouse</span>
        {session.role === "admin" && (
          <>
            <button onClick={() => setShowThreshold(true)} style={{ background: "none", border: "none", color: C.navy, fontSize: 12, fontWeight: 600, cursor: "pointer", textDecoration: "underline", padding: 0 }}>Change</button>
            <button onClick={() => setShowCodes(true)} style={{ background: "none", border: "none", color: C.navy, fontSize: 12, fontWeight: 600, cursor: "pointer", textDecoration: "underline", padding: 0 }}>Origin codes</button>
          </>
        )}
        <button onClick={exportCSV} style={{ background: "none", border: "none", color: C.navy, fontSize: 12, fontWeight: 600, cursor: "pointer", textDecoration: "underline", padding: 0, display: "flex", alignItems: "center", gap: 4 }}>
          <Download size={13} /> Export CSV
        </button>
      </div>

      {carry.length > 0 && (
        <div style={{ background: "#FEF3C7", border: `1px solid #FDE68A`, borderRadius: 10, padding: "12px 14px", marginBottom: 12 }}>
          <div style={{ fontWeight: 700, fontSize: 13.5, color: C.amberDeep, marginBottom: 6 }}>{carry.length} shipment{carry.length === 1 ? "" : "s"} from earlier days still in the warehouse</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {carryBy.map(([bucket, label, n]) => (
              <button key={bucket} onClick={() => { setDay(bucket); setMode("remaining"); }} style={{ background: "#fff", border: `1px solid #FDE68A`, borderRadius: 16, padding: "5px 11px", fontSize: 12.5, fontWeight: 600, color: C.amberDeep, cursor: "pointer" }}>
                {label}: {n}
              </button>
            ))}
          </div>
        </div>
      )}
      {overdue.length > 0 && (
        <div style={{ background: "#FEE2E2", border: `1px solid #FECACA`, borderRadius: 10, padding: "12px 14px", marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
            <AlertTriangle size={16} color={C.redDeep} />
            <span style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>{overdue.length} overdue — held longer than {threshold} day(s)</span>
          </div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.redDeep }}>{overdue.slice(0, 8).map((s) => shipRef(s)).join(", ")}{overdue.length > 8 ? "…" : ""}</div>
        </div>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 10, overflowX: "auto", paddingBottom: 2 }}>
        {SHIPMENT_DAY_CHIPS.map(([k, label]) => (
          <button key={k} onClick={() => setDay(k)} style={{
            flexShrink: 0, padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${day === k ? C.aramexRed : C.line}`, background: day === k ? C.aramexRed : "#fff", color: day === k ? "#fff" : C.ink,
          }}>{label} ({countFor(k, mode)})</button>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
        {modeTiles.map(([k, label, n, color]) => (
          <button key={k} onClick={() => setMode(k)} style={{
            textAlign: "left", background: "#fff", borderRadius: 10, padding: "10px 11px", cursor: "pointer",
            border: `2px solid ${mode === k ? color : C.line}`,
          }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: C.ink50, lineHeight: 1.2, minHeight: 26 }}>{label}</div>
            <div style={{ fontFamily: FONT_SERIF, fontSize: 24, fontWeight: 800, color: mode === k ? color : C.ink, lineHeight: 1.1 }}>{n}</div>
          </button>
        ))}
      </div>

      <div style={{ position: "relative", marginBottom: 10 }}>
        <Search size={15} style={{ position: "absolute", left: 10, top: 11, color: C.ink50 }} />
