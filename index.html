<script>
  (function () {
    const PREFIX = "gate_register__";
    window.storage = {
      async get(key, shared) { const raw = localStorage.getItem(PREFIX + key); if (raw === null) return null; return { key, value: raw, shared: !!shared }; },
      async set(key, value, shared) { localStorage.setItem(PREFIX + key, value); return { key, value, shared: !!shared }; },
      async delete(key, shared) { localStorage.removeItem(PREFIX + key); return { key, deleted: true, shared: !!shared }; },
      async list(prefix, shared) { const p = PREFIX + (prefix || ""); const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(PREFIX.length)); return { keys, prefix, shared: !!shared }; },

--------------------------------------------------------------------- */

async function sha256(text) {
  try {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch {
    // fallback simple hash if subtle crypto unavailable
    let h = 0;
    for (let i = 0; i < text.length; i++) { h = (h << 5) - h + text.charCodeAt(i); h |= 0; }
    return "fb" + Math.abs(h).toString(16);
  }
}

function todayStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function nowTimeStr(d = new Date()) {
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}`;
}
function shiftTimeStr(hhmm, deltaMinutes) {
  const [h, m] = hhmm.split(":").map(Number);
  let total = ((h * 60 + m + deltaMinutes) % 1440 + 1440) % 1440;
  return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
}
function fmtTime(t) {
  if (!t) return "—";
  const [h, m] = t.split(":");
  const hh = parseInt(h, 10);
  const ampm = hh >= 12 ? "PM" : "AM";
  const h12 = hh % 12 === 0 ? 12 : hh % 12;
  return `${h12}:${m} ${ampm}`;
}
function timeGreeting() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}
function fmtDate(dstr) {
  if (!dstr) return "—";
  const d = new Date(dstr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}
function minutesBetween(dateStr, timeIn, timeOut) {
  const a = new Date(`${dateStr}T${timeIn}`);
  const b = new Date(`${dateStr}T${timeOut}`);
  let diff = Math.round((b - a) / 60000);
  if (diff < 0) diff += 1440;
  return diff;
}
function attStartMs(a) { return new Date(`${a.date}T${a.time_in}`).getTime(); }
function attEndMs(a) {
  if (a.status === "INSIDE" || !a.time_out) return Date.now();
  let e = new Date(`${a.date_out || a.date}T${a.time_out}`).getTime();
  if (!a.date_out && a.time_out < a.time_in) e += 86400000; // older overnight records had no date_out
  return e;
}
function overlapsExisting(attendance, employeeId, startMs, endMs, ignoreId) {
  return attendance.some((a) => a.employee_id === employeeId && a.id !== ignoreId && startMs < attEndMs(a) && endMs > attStartMs(a));
}
function fmtTimeOut(a) {
  if (!a.time_out) return "—";
  return a.date_out && a.date_out !== a.date ? `${fmtTime(a.time_out)} (${dayLabelFor(a.date_out)})` : fmtTime(a.time_out);
}
function fmtDuration(mins) {
  if (mins == null) return "—";
  const h = Math.floor(mins / 60), m = mins % 60;
  return `${h}h ${m}m`;
}
function overtimeMinutes(totalMinutes, shiftHours) {
  if (totalMinutes == null || !shiftHours) return 0;
  const limit = shiftHours * 60;
  return totalMinutes > limit ? totalMinutes - limit : 0;
}
function elapsedMinutes(dateStr, timeIn) {
  return Math.round((Date.now() - new Date(`${dateStr}T${timeIn}`)) / 60000);
}
function findLeave(leaves, employeeId, dateStr) {
  return leaves.find((l) => l.employee_id === employeeId && dateStr >= l.date_from && dateStr <= l.date_to) || null;
}
function stockLevel(itemId, movements) {
  return movements.filter((m) => m.item_id === itemId).reduce((s, m) => s + (m.type === "IN" ? m.quantity : -m.quantity), 0);
}
function handoverItemOk(item) {
  if (item.type === "quantity") return item.actual_quantity != null && item.actual_quantity >= item.expected_quantity;
  return item.present === true;
}
function startOfWeek(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = dt.getDate() - day;
  return new Date(dt.setDate(diff));
}
function toCSV(rows, headers) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map((h) => esc(h.label)).join(",")];
  rows.forEach((r) => lines.push(headers.map((h) => esc(h.get(r))).join(",")));
  return lines.join("\n");
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------------------------------------------------------------------
   REPORT SCHEDULING HELPERS
   Artifacts have no server/cron, so "every day / weekly / monthly" is
   implemented as a due-reminder inside the app: whoever opens it sees a
   banner once a report is due, and one tap builds the report and opens
   it in the device's email app (with the CSV downloaded to attach).
--------------------------------------------------------------------- */
function getPeriodRange(freq, ref = new Date()) {
  const day = todayStr(ref);
  if (freq === "weekly") {
    const start = startOfWeek(ref);
    const end = new Date(start); end.setDate(end.getDate() + 6);
    return { from: todayStr(start), to: todayStr(end), label: `${fmtDate(todayStr(start))} – ${fmtDate(todayStr(end))}` };
  }
  if (freq === "monthly") {
    const y = ref.getFullYear(), m = ref.getMonth();
    const from = `${y}-${String(m + 1).padStart(2, "0")}-01`;
    const last = new Date(y, m + 1, 0).getDate();
    const to = `${y}-${String(m + 1).padStart(2, "0")}-${String(last).padStart(2, "0")}`;
    return { from, to, label: ref.toLocaleDateString(undefined, { month: "long", year: "numeric" }) };
  }
  return { from: day, to: day, label: fmtDate(day) };
}
function isReportDue(rd) {
  if (!rd || !rd.enabled || !rd.recipient_email) return false;
  const today = todayStr();
  if (rd.frequency !== "weekly" && rd.frequency !== "monthly" && rd.time && nowTimeStr().slice(0, 5) < rd.time) return false; // daily: wait for the reminder time (end of day)
  if (!rd.last_sent) return true;
  if (rd.frequency === "weekly") return todayStr(startOfWeek(new Date(rd.last_sent + "T00:00:00"))) !== todayStr(startOfWeek(new Date()));
  if (rd.frequency === "monthly") return rd.last_sent.slice(0, 7) !== today.slice(0, 7);
  return rd.last_sent !== today; // daily
}
function buildReportPayload(freq, employees, attendance, empById, settings) {
  const shiftHours = (settings && settings.shift_hours) || 9;
  const { from, to, label } = getPeriodRange(freq);
  const rows = attendance.filter((a) => a.date >= from && a.date <= to).map((a) => ({ ...a, emp: empById[a.employee_id] })).filter((r) => r.emp);
  rows.sort((a, b) => (b.date + b.time_in).localeCompare(a.date + a.time_in));
  const inside = rows.filter((r) => r.status === "INSIDE").length;
  const overtimeTotal = rows.reduce((s, r) => s + overtimeMinutes(r.total_minutes, shiftHours), 0);
  const overtimeCount = rows.filter((r) => overtimeMinutes(r.total_minutes, shiftHours) > 0).length;
  const totalMinutes = rows.reduce((s, r) => s + (r.total_minutes || 0), 0);
  const activeCount = employees.filter((e) => e.active).length;
  const freqLabel = { daily: "Daily", weekly: "Weekly", monthly: "Monthly" }[freq] || "Attendance";

  const subject = `${freqLabel} Gate Attendance Report — ${label}`;
  const lines = [
    `${freqLabel} Gate Attendance Report`, `Period: ${label}`, "",

      return `- ${shipRef(s)}${s.origin ? ` from ${String(s.origin).toUpperCase()}` : ""} — arrived ${labelOf(s.date_in)} ${fmtTime(s.time_in)}, held ${fmtAgeMs(shipmentAgeMs(s))}${shipmentState(s, thresholdDays) === "OVERDUE" ? " [OVERDUE]" : ""}${note ? ` — Reason: ${note.text}` : ""}`;

    "", "Sent from the Aramex Gatehouse Register app.",

  const csvHeaders = [

    { label: "Origin Code", get: (r) => r.origin || "" }, { label: "Origin", get: (r) => originName(r.origin, custom) },
    { label: "Arrived Date", get: (r) => r.date_in }, { label: "Arrived Day", get: (r) => dayLabelFor(r.date_in, dk) }, { label: "Time In", get: (r) => r.time_in },
    { label: "Brought By", get: (r) => r.brought_by_name }, { label: "Brought By ID", get: (r) => r.brought_by_id || "" },
    { label: "Date Out", get: (r) => r.date_out || "" }, { label: "Time Out", get: (r) => r.time_out || "" },
    { label: "Destination", get: (r) => r.destination || "" },
    { label: "Taken By (Staff)", get: (r) => r.taken_by_name }, { label: "Staff Number", get: (r) => r.taken_by_id || "" },
    { label: "Days in Warehouse", get: (r) => {
      const end = r.status === "DISPATCHED" ? new Date(`${r.date_out}T${r.time_out}`).getTime() : Date.now();
      return (Math.max(0, end - new Date(`${r.date_in}T${r.time_in}`).getTime()) / 86400000).toFixed(1);

    { label: "Why Still Here (notes)", get: (r) => (r.hold_notes || []).map((n) => `${n.date} ${n.by}: ${n.text}`).join(" | ") },
  ];
  return {
    subject: `${freqLabel} Shipment Report — ${label} (${received.length} in, ${released.length} out, ${remaining.length} remaining)`,
    body: lines.join("\n"), csv: toCSV(rows, csvHeaders), filename: `shipments-${freq}-report-${from}_${to}.csv`, label, rowCount: rows.length,
  };

const KEYS = {

async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, true);
    return res && res.value ? JSON.parse(res.value) : fallback;
  } catch { return fallback; }

/* ---------------------------------------------------------------------
   SHARED DB SYNC (Claude's cross-device db capability, when available)
   Keeps the app's existing "replace the whole array" call sites unchanged
   by diffing old vs new array and writing only the changed documents —
   this is what makes two devices checking people in at the same time
   not clobber each other.
--------------------------------------------------------------------- */
function cleanForStore(obj) {
  // Firestore rejects `undefined` field values outright; Claude's db is fine
  // with them but there's no reason not to normalize either way.
  return JSON.parse(JSON.stringify(obj));
}
async function syncArrayToCollection(db, collectionPath, prevArray, nextArray) {
  const prevById = new Map((prevArray || []).map((x) => [x.id, x]));
  const nextById = new Map((nextArray || []).map((x) => [x.id, x]));
  const col = db.collection(collectionPath);
  const ops = [];
  for (const [id, rec] of nextById) {
    const prev = prevById.get(id);
    if (!prev || JSON.stringify(prev) !== JSON.stringify(rec)) ops.push(col.doc(id).set(cleanForStore(rec)));
  }
  for (const id of prevById.keys()) {
    if (!nextById.has(id)) ops.push(col.doc(id).delete());
  }
  await Promise.all(ops);
}

   The Firestore compat SDK's collection/doc/onSnapshot shape is close
   enough to Claude's db capability that it can be used as a drop-in

--------------------------------------------------------------------- */

function decodeFirebaseConfig(code) {

async function initFirebaseDb(config) {

  return { app, auth, db };
}
// SECURE GATEHOUSE LOGIN HELPERS
// Keeps the visible login as username + password.
// Firebase Authentication uses a private email-format identity internally.

function usernameToAuthEmail(username, authDomain) {
  const normalized = String(username || "").trim().toLowerCase();

  if (!/^[a-z0-9._-]{3,40}$/.test(normalized)) {
    throw new Error("Username must contain 3–40 letters, numbers, dots, underscores or hyphens.");
  }

  const domain = String(authDomain || "").trim().toLowerCase();

  if (!domain) {
    throw new Error("Firebase authentication domain is missing.");
  }

  return `${normalized}@${domain}`;
}

// If the entered value contains "@" it is used exactly as typed (only
// surrounding whitespace is removed) as the Firebase Authentication email.
// Otherwise it is treated as an existing guard username and mapped to its
// private email-format identity, exactly as before.
function resolveLoginEmail(identifier, authDomain) {
  const raw = String(identifier || "").trim();

  if (raw.includes("@")) {
    return raw;
  }

  return usernameToAuthEmail(raw, authDomain);
}

async function signInWithGatehouseUsername(auth, identifier, password, authDomain) {
  if (!auth) {
    throw new Error("Firebase Authentication is not initialized.");
  }

  if (!password) {
    throw new Error("Please enter your password.");
  }

  const email = resolveLoginEmail(identifier, authDomain);

  return await auth.signInWithEmailAndPassword(email, password);
}

// Turns a Firebase Authentication error into a clear, user-facing message.
function describeAuthError(e) {
  const code = e && e.code ? String(e.code) : "";

  switch (code) {
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
      return "Incorrect email/username or password.";
    case "auth/invalid-email":
      return "That email address is not valid.";
    case "auth/user-disabled":
      return "This account has been disabled in Firebase Authentication. Contact the administrator.";
    case "auth/too-many-requests":
      return "Too many failed sign-in attempts. Wait a few minutes and try again.";
    case "auth/network-request-failed":
      return "Network error while signing in. Check your internet connection and try again.";
    case "auth/operation-not-allowed":
      return "Email/Password sign-in is not enabled for this Firebase project. Enable it under Authentication → Sign-in method.";
    default:
      return (e && e.message) || "Login failed. Please try again.";
  }
}

// Shared staff profile loader: the ONLY place the app reads the signed-in
// user's profile. Reads staff/{uid}, validates it and returns the session
// object. Throws an Error with a clear message on any problem.
// "username" is optional (administrators may not have one).
const STAFF_COLLECTION = "staff";

async function loadStaffProfile(db, firebaseUser) {
  if (!db || !firebaseUser || !firebaseUser.uid) {
    throw new Error("Cannot load your staff profile because you are not signed in.");
  }

  const uid = firebaseUser.uid;
  let snap;

  try {
    snap = await db.collection(STAFF_COLLECTION).doc(uid).get();
  } catch (e) {
    console.error("Staff profile read failed:", e);
    const code = e && e.code ? String(e.code) : "";
    const msg = e && e.message ? String(e.message) : "";

    if (code === "permission-denied") {
      throw new Error(
        `Firestore denied access to your staff profile (${STAFF_COLLECTION}/${uid}). ` +
        "The Firestore security rules must allow a signed-in user to read their own staff document. Contact the administrator."
      );
    }

    if (code === "unavailable" || /offline/i.test(msg)) {
      throw new Error(
        "Cannot reach Firestore (the connection appears to be offline). Check your internet connection and try again."
      );
    }

    throw new Error(`Could not load your staff profile: ${msg || code || "unknown error"}`);
  }

  if (!snap.exists) {
    throw new Error(
      `No staff profile was found for this account (${STAFF_COLLECTION}/${uid}). Contact the administrator.`
    );
  }

  const profile = snap.data() || {};

  if (profile.active !== true) {
    throw new Error("This account is disabled. Contact the administrator.");
  }

  if (typeof profile.name !== "string" || !profile.name.trim()) {
    throw new Error("Your staff profile is incomplete: the name is missing. Contact the administrator.");
  }

  if (typeof profile.role !== "string" || !profile.role.trim()) {
    throw new Error("Your staff profile is incomplete: the role is missing. Contact the administrator.");
  }

  const locationIds = Array.isArray(profile.locationIds)
    ? profile.locationIds.filter((id) => typeof id === "string" && id.trim() !== "")
    : [];

  if (locationIds.length === 0) {
    throw new Error("Your staff profile has no assigned locations. Contact the administrator.");
  }

  return {
    id: uid,
    name: profile.name.trim(),
    username: typeof profile.username === "string" ? profile.username : "",
    email: typeof profile.email === "string" && profile.email ? profile.email : (firebaseUser.email || ""),
    role: profile.role.trim(),
    locationIds
  };
}

function defaultChannel() {

// Older saves had one shared `report_delivery` channel — carry it forward as the
// attendance channel the first time it's seen, rather than losing that setup.
function migrateSettings(raw) {
  if (!raw) return defaultSettings();
  let out = raw;
  if (!out.report_channels) {
    if (out.report_delivery) {
      const { report_delivery, ...rest } = out;
      out = { ...rest, report_channels: { attendance: report_delivery, security: defaultChannel(), inventory: defaultChannel(), shipments: defaultChannel() } };
    } else {
      out = { ...defaultSettings(), ...out };
    }
  }
  if (!out.handover_alert) out = { ...out, handover_alert: { recipient_name: "", recipient_email: "" } };
  if (!out.incident_alert) out = { ...out, incident_alert: { recipient_name: "", recipient_email: "" } };
  if (!out.shipment_threshold_days) out = { ...out, shipment_threshold_days: 3 };
  if (!out.origin_custom) out = { ...out, origin_custom: {} };
  if (out.report_channels && !out.report_channels.shipments) out = { ...out, report_channels: { ...out.report_channels, shipments: defaultChannel() } };
  return out;
}

  const [stockItems, setStockItems] = useState([]);
  const [stockMovements, setStockMovements] = useState([]);

  const [handoverRecords, setHandoverRecords] = useState([]);

  const [shipments, setShipments] = useState([]);

  const [view, setView] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const [busy, setBusy] = useState(false);
  const [syncMode, setSyncMode] = useState("checking"); // "checking" | "synced" | "firebase" | "local"
  const [canWriteShared, setCanWriteShared] = useState(null); // null = unknown/not applicable (Claude-sync only)
  const [firebaseError, setFirebaseError] = useState("");
  const dbApiRef = useRef(null);
  const authApiRef = useRef(null);
  const dbModeRef = useRef("local");
  const employeesRef = useRef(employees); employeesRef.current = employees;
  const usersRef = useRef(users); usersRef.current = users;
  const attendanceRef = useRef(attendance); attendanceRef.current = attendance;
  const auditRef = useRef(audit); auditRef.current = audit;
  const leavesRef = useRef(leaves); leavesRef.current = leaves;
  const visitorsRef = useRef(visitors); visitorsRef.current = visitors;
  const stockItemsRef = useRef(stockItems); stockItemsRef.current = stockItems;
  const stockMovementsRef = useRef(stockMovements); stockMovementsRef.current = stockMovements;
  const handoverItemsRef = useRef(handoverItems); handoverItemsRef.current = handoverItems;
  const handoverRecordsRef = useRef(handoverRecords); handoverRecordsRef.current = handoverRecords;
  const incidentsRef = useRef(incidents); incidentsRef.current = incidents;
  const shipmentsRef = useRef(shipments); shipmentsRef.current = shipments;

  const notify = useCallback((msg, type = "ok") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2800);
  }, []);

  // LOCAL (per-device) boot path — used when the shared db capability
  // isn't available: a downloaded standalone file, or an older preview.
  const bootLocal = useCallback(async () => {
    let emp = await loadKey(KEYS.employees, null);
    let usr = await loadKey(KEYS.users, null);
    let att = await loadKey(KEYS.attendance, null);
    let aud = await loadKey(KEYS.audit, null);
    let lv = await loadKey(KEYS.leaves, null);
    let vis = await loadKey(KEYS.visitors, null);
    let si = await loadKey(KEYS.stockItems, null);
    let sm = await loadKey(KEYS.stockMovements, null);
    let hi = await loadKey(KEYS.handoverItems, null);
    let hr = await loadKey(KEYS.handoverRecords, null);
    let inc = await loadKey(KEYS.incidents, null);
    let shp = await loadKey(KEYS.shipments, null);
    let set = await loadKey(KEYS.settings, null);
    if (!usr || !Array.isArray(usr) || usr.length === 0) {
      const fresh = await buildFreshData();
      emp = emp && Array.isArray(emp) && emp.length ? emp : fresh.employees;
      usr = fresh.users;
      att = att && Array.isArray(att) ? att : fresh.attendance;
      aud = aud && Array.isArray(aud) ? aud : fresh.audit;
      lv = lv && Array.isArray(lv) ? lv : fresh.leaves;
      vis = vis && Array.isArray(vis) ? vis : fresh.visitors;
      si = si && Array.isArray(si) ? si : fresh.stockItems;
      sm = sm && Array.isArray(sm) ? sm : fresh.stockMovements;
      hi = hi && Array.isArray(hi) && hi.length ? hi : fresh.handoverItems;
      hr = hr && Array.isArray(hr) ? hr : fresh.handoverRecords;
      inc = inc && Array.isArray(inc) ? inc : fresh.incidents;
      shp = shp && Array.isArray(shp) ? shp : fresh.shipments;
      set = set || fresh.settings;
      await Promise.all([
        saveKey(KEYS.employees, emp), saveKey(KEYS.users, usr), saveKey(KEYS.attendance, att),
        saveKey(KEYS.audit, aud), saveKey(KEYS.leaves, lv), saveKey(KEYS.visitors, vis),
        saveKey(KEYS.stockItems, si), saveKey(KEYS.stockMovements, sm),
        saveKey(KEYS.handoverItems, hi), saveKey(KEYS.handoverRecords, hr),
        saveKey(KEYS.incidents, inc), saveKey(KEYS.shipments, shp), saveKey(KEYS.settings, set),
      ]);
    }
    setEmployees(emp || []); setUsers(usr || []); setAttendance(att || []);
    setAudit(aud || []); setLeaves(lv || []);
    setVisitors(vis || []); setStockItems(si || []); setStockMovements(sm || []);
    setHandoverItems(hi || []); setHandoverRecords(hr || []); setIncidents(inc || []); setShipments(shp || []);
    setSettings(migrateSettings(set));
    setSyncMode("local");
    setBooted(true);
  }, []);

  // SYNCED (shared db) boot path — live subscriptions so every device
  // that opens this page sees the same data in real time.
   
  useEffect(() => {
    let cancelled = false;
    let authUnsubscribe = null;
    let loadSeq = 0;          // ignores results of superseded auth events
    let pendingAuthError = ""; // error to keep visible across the sign-out that follows a failed profile check

    const clearUserData = () => {
      setUsers([]);
      setEmployees([]);
      setAttendance([]);
      setAudit([]);
      setLeaves([]);
      setVisitors([]);
      setStockItems([]);
      setStockMovements([]);
      setHandoverItems([]);
      setHandoverRecords([]);
      setIncidents([]);
      setShipments([]);
      setSettings(defaultSettings());
    };

    const startFirebase = async () => {
      setBooted(false);
      setFirebaseError("");

      const fbConfig = getSavedFirebaseConfig();

      if (!fbConfig) {
        setFirebaseError("Firebase configuration is missing. Contact the administrator.");
        setSession(null);
        setBooted(true);
        return;
      }

      try {
        const services = await initFirebaseDb(fbConfig);

        if (cancelled) return;

        const auth = services.auth;
        const db = services.db;

        authApiRef.current = auth;
        dbApiRef.current = db;
        dbModeRef.current = "firebase";

        setSyncMode("firebase");

        // onAuthStateChanged is the single owner of session initialization:
        // it loads staff/{uid} exactly once per auth event and sets the session.
        authUnsubscribe = auth.onAuthStateChanged(async (firebaseUser) => {
          if (cancelled) return;

          const seq = ++loadSeq;

          if (!firebaseUser) {
            setSession(null);
            clearUserData();

            // Keep a profile/permission error visible; it was set just before
            // the sign-out that produced this signed-out event.
            if (pendingAuthError) {
              pendingAuthError = "";
            } else {
              setFirebaseError("");
            }

            setBooted(true);
            return;
          }

          setFirebaseError("");

          try {
            const profile = await loadStaffProfile(db, firebaseUser);

            if (cancelled || seq !== loadSeq) return;

            setSession(profile);
            setFirebaseError("");
            setBooted(true);

          } catch (error) {
            console.error("Authentication profile check failed:", error);

            if (cancelled || seq !== loadSeq) return;

            const message = error.message || "Unable to verify your account permissions.";

            // Show the reason first, then sign out so a half-authenticated
            // user is not left holding a session without a valid profile.
            pendingAuthError = message;
            setSession(null);
            clearUserData();
            setFirebaseError(message);
            setBooted(true);

            try {
              await auth.signOut();
            } catch (signOutError) {
              console.error("Sign-out after failed profile check failed:", signOutError);
            }
          }
        });

      } catch (error) {
        console.error("Firebase startup failed:", error);

        if (cancelled) return;

        authApiRef.current = null;
        dbApiRef.current = null;
        setSession(null);
        clearUserData();
        setFirebaseError(
          error.message || "Could not connect to Firebase."
        );
        setBooted(true);
      }
    };

    startFirebase();

    return () => {
      cancelled = true;

      if (authUnsubscribe) {
        authUnsubscribe();
      }
    };

      ? window.firebase.auth()
      : null;
  } catch (e) {
    auth = null;
  }
  const config = getSavedFirebaseConfig();

  if (!auth || !config) {
    setError("Firebase Authentication is not connected on this device. Use \"Trouble logging in?\" below to connect it.");
    return;
  }

  setBusy(true);

  try {
    // Only authenticates. The staff profile is loaded once, by
    // onAuthStateChanged, which then sets the session.
    await signInWithGatehouseUsername(auth, u, p, config.authDomain);

    // Safety net so the button can never stay busy forever.
    clearTimeout(busyTimerRef.current);
    busyTimerRef.current = setTimeout(() => {
      setBusy(false);
      setError("Signing in is taking longer than expected. Check your connection and try again.");
    }, 20000);

  } catch (e) {
    console.error("Login failed:", e);
    setError(describeAuthError(e));
    setBusy(false);
  }
};

  return (
    <div style={{ minHeight: "100vh", background: "#F1F5F9", position: "relative", overflow: "hidden", padding: "36px 16px" }}>

              <div style={{ border: `1px solid ${C.line}`, borderRadius: 9, padding: "8px 38px 8px 36px", position: "relative" }}>

/* ---------------------------------------------------------------------
   DASHBOARD
--------------------------------------------------------------------- */
function Dashboard({ session, employees, attendance, settings, empById, today, goto, sendReport, leaves, stockItems, stockMovements, visitors, handoverRecords, incidents, shipments }) {
  const todays = attendance.filter((a) => a.date === today);
  const inside = todays.filter((a) => a.status === "INSIDE");
  const checkedOutToday = todays.filter((a) => a.status === "CHECKED_OUT");
  const staleInside = attendance.filter((a) => a.status === "INSIDE" && a.date < today);
  const activeEmployees = employees.filter((e) => e.active);
  const checkedInIds = new Set(todays.map((a) => a.employee_id));
  const onLeaveToday = activeEmployees.filter((e) => findLeave(leaves, e.id, today));
  const onLeaveIds = new Set(onLeaveToday.map((e) => e.id));
  const notCheckedIn = activeEmployees.filter((e) => !checkedInIds.has(e.id) && !onLeaveIds.has(e.id));
  const shiftHours = settings.shift_hours || 9;
  const overtimeToday = todays.filter((a) => {
    if (a.status === "INSIDE") return elapsedMinutes(a.date, a.time_in) > shiftHours * 60;
    return overtimeMinutes(a.total_minutes, shiftHours) > 0;
  });
  const visitorsInside = (visitors || []).filter((v) => v.status === "INSIDE");
  const lowStockItems = (stockItems || []).filter((i) => i.active).map((i) => ({ ...i, level: stockLevel(i.id, stockMovements || []) })).filter((i) => i.level <= i.min_threshold);
  const openIncidents = (incidents || []).filter((i) => i.status === "Open" || i.status === "Under Investigation");
  const seriousOpenIncidents = openIncidents.filter((i) => i.severity === "High" || i.severity === "Critical");
  const shipThreshold = settings.shipment_threshold_days || 3;
  const shipmentsInWh = (shipments || []).filter((x) => x.status === "IN_WAREHOUSE");
  const overdueShipments = shipmentsInWh.filter((x) => shipmentState(x, shipThreshold) === "OVERDUE");

  const channels = settings.report_channels || { attendance: defaultChannel(), security: defaultChannel(), inventory: defaultChannel(), shipments: defaultChannel() };
  const dueSections = session.role === "admin"
    ? ["attendance", "security", "inventory", "shipments"].filter((s) => isReportDue(channels[s]))
    : [];
  const sectionLabel = { attendance: "Attendance", security: "Security", inventory: "Inventory", shipments: "Shipments" };

  return (
    <div>
      <div style={{
        background: "#fff", borderRadius: 18, marginBottom: 22, border: `1px solid ${C.line}`,
        boxShadow: "0 2px 10px rgba(15,23,42,0.07)", display: "flex", overflow: "hidden", minHeight: 150,
      }}>
        <div style={{ flex: "1 1 58%", padding: "20px 22px", display: "flex", flexDirection: "column", justifyContent: "center", minWidth: 0 }}>
          <div style={{ fontSize: 13.5, color: C.ink50, marginBottom: 2 }}>☀️ {timeGreeting()},</div>
          <div style={{ fontFamily: FONT_SERIF, fontSize: 27, fontWeight: 800, color: C.ink, lineHeight: 1.15, marginBottom: 5 }}>{session.name.split(" ")[0]}</div>
          <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 12 }}>{fmtDate(today)} · Today's Dashboard</div>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: C.aramexRed, color: "#fff", borderRadius: 20, padding: "5px 14px", fontSize: 11, fontWeight: 700, letterSpacing: 0.3, width: "fit-content" }}>
            <ShieldCheck size={13} /> {session.role.toUpperCase()}
          </div>
        </div>
        <div style={{
          flex: "0 0 40%", position: "relative", background: `linear-gradient(135deg, ${C.aramexRed}, #8C001E)`,
          clipPath: "polygon(22% 0, 100% 0, 100% 100%, 0% 100%)", display: "flex", alignItems: "center", justifyContent: "center",
          padding: "20px 14px", textAlign: "center",
        }}>
          <div>
            <div style={{ color: "#fff", fontFamily: FONT_SANS, fontWeight: 800, fontSize: 15, lineHeight: 1.3 }}>Gatehouse<br />Register</div>
            <div style={{ color: "rgba(255,255,255,0.82)", fontSize: 9, marginTop: 7, letterSpacing: 1.2, fontWeight: 600 }}>SECURITY · ACCESS · CONTROL</div>
          </div>
        </div>
      </div>

      {staleInside.length > 0 && (
        <div style={{ background: "#FEF3C7", border: `1px solid #FDE68A`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Clock size={18} color={C.amberDeep} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.ink }}>{staleInside.length} still checked in from earlier days</div>
              <div style={{ fontSize: 12, color: C.ink50 }}>{staleInside.slice(0, 4).map((a) => (empById[a.employee_id] ? empById[a.employee_id].name : "—") + " (" + dayLabelFor(a.date) + ")").join(", ")}{staleInside.length > 4 ? "…" : ""} — check them out with the real date &amp; time</div>
            </div>
          </div>
          <Btn size="sm" tone="amber" onClick={() => goto("checkout")}>Check Them Out</Btn>
        </div>
      )}

      {(handoverRecords || []).some((r) => r.status === "PENDING") && (
        <div style={{ background: "#FEF3C7", border: `1px solid #FDE68A`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <RefreshCw size={18} color={C.amberDeep} />
            <div style={{ fontWeight: 700, fontSize: 13.5, color: C.ink }}>A shift handover is waiting for you to take over</div>
          </div>
          <Btn size="sm" tone="amber" onClick={() => goto("handover")}>Review &amp; Take Over</Btn>
        </div>
      )}

      {dueSections.map((s) => {
        const ch = channels[s];
        return (
          <div key={s} style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <AlertTriangle size={18} color={C.amberDeep} />
              <div>
                <div style={{ fontWeight: 700, fontSize: 13.5, color: C.ink }}>
                  {sectionLabel[s]}: {ch.frequency[0].toUpperCase() + ch.frequency.slice(1)} report due to {ch.recipient_name || ch.recipient_email}
                </div>
                <div style={{ fontSize: 12, color: C.ink50 }}>Opens your email app with the report — you attach and send.</div>
              </div>
            </div>
            <Btn size="sm" tone="amber" onClick={() => sendReport(s, ch.frequency)}>Send Report</Btn>
          </div>
        );
      })}

      {lowStockItems.length > 0 && (
        <div style={{ background: "#F7E7E5", border: `1px solid #E9C3BE`, borderRadius: 10, padding: "12px 14px", marginBottom: 18, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Package size={18} color={C.redDeep} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>{lowStockItems.length} item(s) low on stock — reorder needed</div>
              <div style={{ fontSize: 12, color: C.ink50 }}>{lowStockItems.map((i) => i.name).join(", ")}</div>
            </div>
          </div>
          <Btn size="sm" tone="red" onClick={() => goto("inventory")}>View Inventory</Btn>
        </div>
      )}

      {overdueShipments.length > 0 && (
        <div style={{ background: "#FEE2E2", border: `1px solid #FECACA`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Truck size={18} color={C.redDeep} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>{overdueShipments.length} shipment(s) held longer than {shipThreshold} day(s)</div>
              <div style={{ fontSize: 12, color: C.ink50 }}>{overdueShipments.slice(0, 5).map((x) => shipRef(x)).join(", ")}{overdueShipments.length > 5 ? "…" : ""}</div>
            </div>
          </div>
          <Btn size="sm" tone="red" onClick={() => goto("shipments")}>View Shipments</Btn>
        </div>
      )}

      {seriousOpenIncidents.length > 0 && (
        <div style={{ background: "#FEE2E2", border: `1px solid #FECACA`, borderRadius: 10, padding: "12px 14px", marginBottom: 18, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <AlertTriangle size={18} color={C.redDeep} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>{seriousOpenIncidents.length} high/critical incident(s) open</div>
              <div style={{ fontSize: 12, color: C.ink50 }}>{seriousOpenIncidents.map((i) => i.type).join(", ")}</div>
            </div>
          </div>
          <Btn size="sm" tone="red" onClick={() => goto("incidents")}>View Incidents</Btn>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 22 }}>
        <StatCard label="Total Employees" value={activeEmployees.length} icon={Users} tone="red" onClick={session.role === "admin" ? () => goto("employees") : undefined} />
        <StatCard label="Checked In Today" value={todays.length} icon={CalendarDays} tone="teal" onClick={() => goto("attendance")} />
        <StatCard label="Currently Inside" value={inside.length} icon={Clock} tone="amber" onClick={() => goto("attendance")} />
        <StatCard label="Checked Out Today" value={checkedOutToday.length} icon={DoorClosed} tone="slate" onClick={() => goto("attendance")} />
        <StatCard label="Not Checked In" value={notCheckedIn.length} icon={XCircle} tone="red" onClick={() => goto("attendance")} />
        <StatCard label="On Leave Today" value={onLeaveToday.length} icon={UserX} tone="slate" onClick={() => goto("leave")} />
        <StatCard label="In Overtime" value={overtimeToday.length} icon={AlertTriangle} tone="amber" onClick={() => goto("attendance")} />
        <StatCard label="Visitors/Contractors Inside" value={visitorsInside.length} icon={UserPlus} tone="purple" onClick={() => goto("visitors")} />
        <StatCard label="Low Stock Items" value={lowStockItems.length} icon={Package} tone="slate" onClick={() => goto("inventory")} />
        <StatCard label="Shipments in Warehouse" value={shipmentsInWh.length} icon={Truck} tone="teal" onClick={() => goto("shipments")} />
        <StatCard label="Overdue Shipments" value={overdueShipments.length} icon={Clock} tone={overdueShipments.length ? "red" : "slate"} onClick={() => goto("shipments")} />
        <StatCard label="Open Incidents" value={openIncidents.length} icon={AlertTriangle} tone="red" onClick={() => goto("incidents")} />
      </div>

      <SectionTitle title="Currently Inside" sub={`${inside.length} on site`} />
      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 22 }}>
        {inside.length === 0 ? <EmptyState icon={DoorOpen} title="No one is currently inside" /> : (
          <TableScroll headers={["Employee", "ID", "Company", "Time In", "Duration"]}>
            {inside.map((a) => {
              const e = empById[a.employee_id]; if (!e) return null;
              const mins = Math.round((Date.now() - new Date(`${a.date}T${a.time_in}`)) / 60000);
              return (
                <tr key={a.id}>
                  <Td>{e.name}</Td>
                  <TdMono>{e.employee_number}</TdMono>
                  <Td>{e.company}</Td>
                  <TdMono>{fmtTime(a.time_in)}</TdMono>
                  <Td>{fmtDuration(mins)}</Td>
                </tr>
              );
            })}
          </TableScroll>
        )}
      </div>

      <SectionTitle title="Today's Attendance" sub={`${todays.length} record(s)`} action={{ label: "View all", onClick: () => goto("attendance") }} />
      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        {todays.length === 0 ? <EmptyState icon={ClipboardList} title="No attendance recorded yet today" /> : (
          <TableScroll headers={["Employee", "Time In", "Time Out", "Total Hours", "Status", "Recorded By"]}>
            {todays.slice(0, 8).map((a) => {
              const e = empById[a.employee_id]; if (!e) return null;
              return (
                <tr key={a.id}>
                  <Td>{e.name}</Td>
                  <TdMono>{fmtTime(a.time_in)}</TdMono>
                  <TdMono>{fmtTimeOut(a)}</TdMono>
                  <Td>{a.total_minutes != null ? fmtDuration(a.total_minutes) : "—"}</Td>
                  <Td><StatusBadge a={a} shiftHours={settings.shift_hours} /></Td>
                  <Td>{a.status === "INSIDE" ? a.checked_in_by : a.checked_out_by}</Td>

        )}

      <div style={{ marginTop: 22, background: C.paperDim, border: `1px solid ${C.line}`, borderRadius: 12, padding: "14px 18px", display: "flex", alignItems: "center", gap: 12 }}>
        <div style={{ width: 38, height: 38, borderRadius: 10, background: C.aramexRed, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <ShieldCheck size={19} color="#fff" />
        </div>
        <div style={{ fontFamily: FONT_SERIF, fontSize: 14.5, fontWeight: 700, color: C.ink, lineHeight: 1.3 }}>
          Trusted Guards<br />Secure Gates
        </div>
      </div>
    </div>
  );
}

function StatusBadge({ a, shiftHours }) {
  const sh = shiftHours || 9;
  if (a.status === "INSIDE") {
    const elapsed = elapsedMinutes(a.date, a.time_in);
    return elapsed > sh * 60 ? <Badge tone="overtime">OVERTIME · INSIDE</Badge> : <Badge tone="inside">INSIDE</Badge>;
  }
  const ot = overtimeMinutes(a.total_minutes, sh);
  return ot > 0 ? <Badge tone="overtime">+{fmtDuration(ot)} OT</Badge> : <Badge tone="out">CHECKED OUT</Badge>;
}

function SectionTitle({ title, sub, action }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 10, marginTop: 4 }}>
      <div>
        <h2 style={{ fontFamily: FONT_SERIF, fontSize: 19, color: C.ink, margin: 0 }}>{title}</h2>
        {sub && <div style={{ fontSize: 12.5, color: C.ink50, marginTop: 2 }}>{sub}</div>}
      </div>
      {action && (
        <button onClick={action.onClick} style={{ background: "none", border: "none", color: C.navy, fontFamily: FONT_SANS, fontWeight: 600, fontSize: 12.5, cursor: "pointer", display: "flex", alignItems: "center", gap: 2 }}>
          {action.label} <ChevronRight size={14} />
        </button>
      )}
    </div>
  );
}

function TableScroll({ headers, children }) {
  return (
    <div style={{ overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 560 }}>
        <thead>
          <tr style={{ background: C.paperDim }}>
            {headers.map((h) => (
              <th key={h} style={{ textAlign: "left", padding: "9px 12px", fontSize: 11.5, fontFamily: FONT_SANS, fontWeight: 700, color: C.ink50, borderBottom: `1px solid ${C.line}` }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>{children}</tbody>
      </table>
    </div>
  );
}
function Td({ children }) { return <td style={{ padding: "10px 12px", fontSize: 13.5, color: C.ink, borderBottom: `1px solid ${C.line}` }}>{children}</td>; }
function TdMono({ children }) { return <td style={{ padding: "10px 12px", fontSize: 13, color: C.ink, fontFamily: FONT_MONO, borderBottom: `1px solid ${C.line}` }}>{children}</td>; }

/* ---------------------------------------------------------------------
   EMPLOYEE SEARCH (shared widget)
--------------------------------------------------------------------- */
function EmployeeSearch({ employees, placeholder, onPick, filterFn }) {
  const [q, setQ] = useState("");
  const results = useMemo(() => {
    let pool = employees;
    if (filterFn) pool = pool.filter(filterFn);
    if (!q.trim()) return pool.slice(0, 6);
    const term = q.toLowerCase();
    return pool.filter((e) =>
      e.name.toLowerCase().includes(term) ||
      e.employee_number.toLowerCase().includes(term) ||
      e.company.toLowerCase().includes(term) ||
      e.department.toLowerCase().includes(term)
    ).slice(0, 8);
  }, [q, employees, filterFn]);

  return (
    <div>
      <div style={{ position: "relative", marginBottom: 10 }}>
        <Search size={17} style={{ position: "absolute", left: 12, top: 13, color: C.ink50 }} />
        <input autoFocus style={{ ...inputStyle, paddingLeft: 38, fontSize: 16 }} placeholder={placeholder} value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {results.length === 0 && <EmptyState icon={Search} title="No matching employees" sub="Try a different name, ID, or company" />}
        {results.map((e) => (
          <button key={e.id} onClick={() => onPick(e)} style={{
            textAlign: "left", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 9, padding: "11px 13px",
            cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center",
          }}>
            <div>
              <div style={{ fontSize: 14.5, fontWeight: 600, color: C.ink }}>{e.name}</div>
              <div style={{ fontSize: 12, color: C.ink50, marginTop: 2 }}>{e.company} · {e.department}</div>
            </div>
            <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.navy, background: C.paperDim, padding: "3px 7px", borderRadius: 5 }}>{e.employee_number}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   CHECK-IN
--------------------------------------------------------------------- */
function CheckInScreen({ session, employees, attendance, settings, leaves, persistAttendance, audit, persistAudit, notify, today }) {
  const [selected, setSelected] = useState(null);
  const [remarks, setRemarks] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [success, setSuccess] = useState(null);
  const [backdate, setBackdate] = useState(false);
  const [bdDate, setBdDate] = useState(todayStr());
  const [bdTime, setBdTime] = useState(nowTimeStr().slice(0, 5));
  const [bdError, setBdError] = useState("");
  const [alsoOut, setAlsoOut] = useState(false);
  const [outDate, setOutDate] = useState(todayStr());
  const [outTime, setOutTime] = useState("");

  const insideIds = useMemo(() => new Set(attendance.filter((a) => a.status === "INSIDE").map((a) => a.employee_id)), [attendance]);
  const alreadyInside = selected && insideIds.has(selected.id);
  const onLeave = selected && findLeave(leaves, selected.id, today);

  const pickEmployee = (e) => { setSelected(e); setBackdate(false); setBdDate(todayStr()); setBdTime(nowTimeStr().slice(0, 5)); setBdError(""); setAlsoOut(false); setOutDate(todayStr()); setOutTime(""); };

  const doCheckIn = async () => {
    if (!selected || submitting) return;
    if (!selected.active) { notify("This employee is inactive and cannot be checked in", "error"); return; }
    const now = new Date();
    let date = todayStr(now), time_in = nowTimeStr(now), date_out = null, time_out = null, total_minutes = null, status = "INSIDE";
    if (backdate) {
      if (!bdDate || !bdTime) { setBdError("Pick the check-in date and time"); return; }
      const inMs = new Date(`${bdDate}T${bdTime}:00`).getTime();
      if (inMs > now.getTime() + 60000) { setBdError("Check-in can't be in the future"); return; }
      date = bdDate; time_in = `${bdTime}:00`;
      if (alsoOut) {
        if (!outDate || !outTime) { setBdError("Pick the check-out date and time"); return; }
        const outMs = new Date(`${outDate}T${outTime}:00`).getTime();
        if (outMs > now.getTime() + 60000) { setBdError("Check-out can't be in the future"); return; }
        if (outMs <= inMs) { setBdError("Check-out must be after check-in"); return; }
        if (overlapsExisting(attendance, selected.id, inMs, outMs)) { setBdError("That overlaps another attendance record for this person"); return; }
        date_out = outDate; time_out = `${outTime}:00`; status = "CHECKED_OUT"; total_minutes = Math.round((outMs - inMs) / 60000);
      } else {
        if (insideIds.has(selected.id)) { notify("Already inside — check out first", "error"); return; }
        if (overlapsExisting(attendance, selected.id, inMs, Date.now() + 1)) { setBdError("That time overlaps another record for this person — also record their check-out, or pick a later time"); return; }
      }
    } else if (insideIds.has(selected.id)) { notify("Already inside — check out first", "error"); return; }
    setSubmitting(true);
    const record = {
      id: uid("a_"), employee_id: selected.id, date, time_in, date_out, time_out, total_minutes,
      status, checked_in_by: session.name, checked_out_by: status === "CHECKED_OUT" ? session.name : null,
      remarks_in: remarks || "", remarks_out: "",
      created_at: Date.now(), updated_at: Date.now(),
    };
    await persistAttendance([record, ...attendance]);
    await persistAudit([{ id: uid("log_"), attendance_id: record.id, action: "CHECK_IN", old_value: null, new_value: `IN ${date} ${time_in}${time_out ? ` / OUT ${date_out} ${time_out}` : ""}`, performed_by: session.name, reason: backdate ? "Backdated entry" : "", timestamp: Date.now() }, ...audit]);
    setSubmitting(false);
    setSuccess({ ...record, employee: selected });
    setSelected(null); setRemarks(""); setBackdate(false); setAlsoOut(false);
    notify(`${selected.name} checked in`);
  };

  if (success) {
    return (
      <div>
        <SectionTitle title="Check In" />
        <div style={{ background: "#fff", border: `2px solid ${C.green}`, borderRadius: 12, padding: 24, textAlign: "center" }}>
          <CheckCircle2 size={44} color={C.green} style={{ marginBottom: 10 }} />
          <div style={{ fontFamily: FONT_SERIF, fontSize: 21, color: C.ink, marginBottom: 4 }}>Check-In Successful</div>
          <div style={{ display: "grid", gridTemplateColumns: "auto auto", gap: "6px 18px", justifyContent: "center", marginTop: 14, textAlign: "left" }}>
            <span style={{ color: C.ink50, fontSize: 13 }}>Employee</span><span style={{ fontWeight: 600 }}>{success.employee.name}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Employee No.</span><span style={{ fontFamily: FONT_MONO }}>{success.employee.employee_number}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Date</span><span>{fmtDate(success.date)}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Time</span><span style={{ fontFamily: FONT_MONO }}>{fmtTime(success.time_in)}</span>
          </div>
          <div style={{ marginTop: 20 }}>
            <Btn tone="navy" onClick={() => setSuccess(null)} icon={DoorOpen}>Check In Another Employee</Btn>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Check In" sub="Search, confirm, and record arrival — no manual time entry" />
      {!selected ? (
        <EmployeeSearch employees={employees} placeholder="Search name or employee number…" onPick={pickEmployee} />
      ) : (
        <div>
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 18, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontFamily: FONT_SERIF, fontSize: 20, color: C.ink }}>{selected.name}</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: C.navy, marginTop: 2 }}>{selected.employee_number}</div>
              </div>
              <button onClick={() => setSelected(null)} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer" }}><X size={19} /></button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14, fontSize: 13.5 }}>
              <InfoRow icon={Building2} label="Company" value={selected.company} />
              <InfoRow icon={Briefcase} label="Department" value={selected.department} />
              <InfoRow icon={UserCog} label="Designation" value={selected.designation} />
              <InfoRow icon={Phone} label="Phone" value={selected.phone || "—"} />
            </div>
            {!selected.active && (
              <div style={{ marginTop: 12, background: "#F7E7E5", color: C.redDeep, padding: "8px 10px", borderRadius: 7, fontSize: 13, display: "flex", gap: 6, alignItems: "center" }}>
                <AlertTriangle size={15} /> Employee is inactive — check-in blocked.
              </div>
            )}
            {alreadyInside && (
              <div style={{ marginTop: 12, background: "#FCEFE0", color: C.amberDeep, padding: "8px 10px", borderRadius: 7, fontSize: 13, display: "flex", gap: 6, alignItems: "center" }}>
                <Clock size={15} /> Already Inside — must check out before checking in again.
              </div>
            )}
            {onLeave && (
              <div style={{ marginTop: 12, background: "#F7E7E5", color: C.redDeep, padding: "8px 10px", borderRadius: 7, fontSize: 13, display: "flex", gap: 6, alignItems: "center" }}>
                <UserX size={15} /> Marked on {onLeave.type} today{onLeave.reason ? ` (${onLeave.reason})` : ""} — you can still check them in if they came anyway.
              </div>
            )}
          </div>

          <BackdateDateTime label="Arrived earlier or on a previous date? Set the real check-in date & time" active={backdate} setActive={setBackdate}
            date={bdDate} setDate={setBdDate} time={bdTime} setTime={setBdTime} error={bdError} setError={setBdError} />
          {backdate && (
            <div style={{ marginBottom: 14 }}>
              <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", marginBottom: alsoOut ? 8 : 0 }}>
                <input type="checkbox" checked={alsoOut} onChange={(e) => { setAlsoOut(e.target.checked); setBdError(""); if (e.target.checked) setOutDate(bdDate); }} />
                <span style={{ fontSize: 13 }}>They have already left — also record the check-out</span>
              </label>
              {alsoOut && (
                <div style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 9, padding: "12px 14px" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: C.amberDeep, letterSpacing: 0.3, marginBottom: 8 }}>CHECK-OUT DATE &amp; TIME</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                    <input type="date" style={{ ...inputStyle, background: "#fff" }} value={outDate} max={todayStr()} onChange={(e) => { setOutDate(e.target.value); setBdError(""); }} />
                    <input type="time" style={{ ...inputStyle, background: "#fff" }} value={outTime} onChange={(e) => { setOutTime(e.target.value); setBdError(""); }} />
                  </div>
                </div>
              )}
            </div>
          )}

          <Field label="Remarks (optional)">
            <RemarksPicker value={remarks} onChange={setRemarks} />
          </Field>

          <Btn full tone="green" size="lg" icon={DoorOpen} onClick={doCheckIn} disabled={submitting || (alreadyInside && !(backdate && alsoOut)) || !selected.active}>
            {submitting ? "Recording…" : "CHECK IN"}
          </Btn>
        </div>
      )}
    </div>
  );
}

function InfoRow({ icon: Icon, label, value }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <Icon size={14} color={C.ink50} />
      <div>
        <div style={{ fontSize: 10.5, color: C.ink50 }}>{label}</div>
        <div style={{ fontSize: 13.5, color: C.ink, fontWeight: 500 }}>{value}</div>
      </div>
    </div>
  );
}

const REMARK_OPTIONS = ["Official duty", "Temporary visitor", "Forgot ID", "Late arrival", "Emergency", "Other"];
function RemarksPicker({ value, onChange }) {
  const [custom, setCustom] = useState(!REMARK_OPTIONS.includes(value) && !!value);
  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: custom ? 8 : 0 }}>
        {REMARK_OPTIONS.map((r) => (
          <button key={r} type="button" onClick={() => { onChange(r === value ? "" : r); setCustom(false); }} style={{
            padding: "6px 11px", borderRadius: 20, fontSize: 12.5, cursor: "pointer",
            border: `1px solid ${value === r ? C.navy : C.line}`, background: value === r ? C.navy : "#fff", color: value === r ? "#fff" : C.ink,
          }}>{r}</button>
        ))}
        <button type="button" onClick={() => setCustom((c) => !c)} style={{
          padding: "6px 11px", borderRadius: 20, fontSize: 12.5, cursor: "pointer",
          border: `1px dashed ${C.ink50}`, background: "#fff", color: C.ink50,
        }}>+ Custom</button>
      </div>
      {custom && <input style={inputStyle} placeholder="Type a remark…" value={value} onChange={(e) => onChange(e.target.value)} />}
    </div>
  );
}

function BackdateField({ label, active, onToggle, time, onTimeChange }) {
  if (!active) {
    return (
      <button type="button" onClick={onToggle} style={{
        background: "none", border: "none", color: C.navy, fontSize: 12.5, fontWeight: 600,
        cursor: "pointer", textDecoration: "underline", padding: 0, marginBottom: 14, display: "block",
      }}>
        {label}
      </button>
    );
  }
  return (
    <div style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 9, padding: "12px 14px", marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 9 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: C.amberDeep, letterSpacing: 0.3 }}>SET ACTUAL TIME</span>
        <button type="button" onClick={onToggle} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer", fontSize: 12 }}>Use current time</button>
      </div>
      <div style={{ display: "flex", gap: 7, alignItems: "center", flexWrap: "wrap" }}>
        <input type="time" style={{ ...inputStyle, maxWidth: 130, background: "#fff" }} value={time} onChange={(e) => onTimeChange(e.target.value)} />
        {[5, 15, 30, 60].map((m) => (
          <button key={m} type="button" onClick={() => onTimeChange(shiftTimeStr(time, -m))} style={{
            padding: "6px 10px", borderRadius: 16, fontSize: 12, border: `1px solid ${C.amberDeep}`, background: "#fff", color: C.amberDeep, cursor: "pointer",
          }}>-{m < 60 ? `${m}m` : "1h"}</button>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   CHECK-OUT
--------------------------------------------------------------------- */
function CheckOutScreen({ session, employees, attendance, settings, persistAttendance, audit, persistAudit, notify, today }) {
  const [selected, setSelected] = useState(null); // employee
  const [remarks, setRemarks] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [success, setSuccess] = useState(null);
  const [backdate, setBackdate] = useState(false);
  const [bdDate, setBdDate] = useState(todayStr());
  const [bdTime, setBdTime] = useState(nowTimeStr().slice(0, 5));
  const [bdError, setBdError] = useState("");

  const insideRecords = useMemo(() => attendance.filter((a) => a.status === "INSIDE"), [attendance]);
  const insideIds = useMemo(() => new Set(insideRecords.map((a) => a.employee_id)), [insideRecords]);
  const activeRecord = selected ? insideRecords.find((a) => a.employee_id === selected.id) : null;

  const pickEmployee = (e) => { setSelected(e); setBackdate(false); setBdDate(todayStr()); setBdTime(nowTimeStr().slice(0, 5)); setBdError(""); };

  const doCheckOut = async () => {
    if (!activeRecord || submitting) return;
    const now = new Date();
    let date_out = todayStr(now), time_out = nowTimeStr(now);
    const inMs = attStartMs(activeRecord);
    if (backdate) {
      if (!bdDate || !bdTime) { setBdError("Pick the check-out date and time"); return; }
      const outMs = new Date(`${bdDate}T${bdTime}:00`).getTime();
      if (outMs > now.getTime() + 60000) { setBdError("Check-out can't be in the future"); return; }
      if (outMs <= inMs) { setBdError(`Check-out must be after the check-in (${fmtDate(activeRecord.date)} ${fmtTime(activeRecord.time_in)})`); return; }
      if (overlapsExisting(attendance, activeRecord.employee_id, inMs, outMs, activeRecord.id)) { setBdError("That overlaps a later attendance record for this person"); return; }
      date_out = bdDate; time_out = `${bdTime}:00`;
    }
    setSubmitting(true);
    const total_minutes = Math.max(0, Math.round((new Date(`${date_out}T${time_out}`).getTime() - inMs) / 60000));
    const updated = { ...activeRecord, date_out, time_out, total_minutes, status: "CHECKED_OUT", checked_out_by: session.name, remarks_out: remarks || "", updated_at: Date.now() };
    const next = attendance.map((a) => (a.id === activeRecord.id ? updated : a));
    await persistAttendance(next);
    await persistAudit([{ id: uid("log_"), attendance_id: activeRecord.id, action: "CHECK_OUT", old_value: null, new_value: `OUT ${date_out} ${time_out}`, performed_by: session.name, reason: backdate ? "Backdated check-out" : "", timestamp: Date.now() }, ...audit]);
    setSubmitting(false);
    setSuccess({ ...updated, employee: selected });
    setSelected(null); setRemarks(""); setBackdate(false);
    notify(`${selected.name} checked out`);
  };

  if (success) {
    return (
      <div>
        <SectionTitle title="Check Out" />
        <div style={{ background: "#fff", border: `2px solid ${C.red}`, borderRadius: 12, padding: 24, textAlign: "center" }}>
          <CheckCircle2 size={44} color={C.red} style={{ marginBottom: 10 }} />
          <div style={{ fontFamily: FONT_SERIF, fontSize: 21, color: C.ink, marginBottom: 4 }}>Check-Out Successful</div>
          {overtimeMinutes(success.total_minutes, settings.shift_hours || 9) > 0 && (
            <div style={{ marginBottom: 8 }}><Badge tone="overtime">+{fmtDuration(overtimeMinutes(success.total_minutes, settings.shift_hours || 9))} OVERTIME</Badge></div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "auto auto", gap: "6px 18px", justifyContent: "center", marginTop: 14, textAlign: "left" }}>
            <span style={{ color: C.ink50, fontSize: 13 }}>Employee</span><span style={{ fontWeight: 600 }}>{success.employee.name}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Time In</span><span style={{ fontFamily: FONT_MONO }}>{fmtDate(success.date)} {fmtTime(success.time_in)}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Time Out</span><span style={{ fontFamily: FONT_MONO }}>{fmtDate(success.date_out || success.date)} {fmtTime(success.time_out)}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Total Time Inside</span><span style={{ fontWeight: 600 }}>{fmtDuration(success.total_minutes)}</span>
          </div>
          <div style={{ marginTop: 20 }}>
            <Btn tone="navy" onClick={() => setSuccess(null)} icon={DoorClosed}>Check Out Another Employee</Btn>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Check Out" sub="Only employees currently inside can be checked out" />
      {!selected ? (
        <EmployeeSearch employees={employees} placeholder="Search employee currently inside…" onPick={pickEmployee} filterFn={(e) => insideIds.has(e.id)} />
      ) : !activeRecord ? (
        <div>
          <div style={{ background: "#F7E7E5", color: C.redDeep, padding: "12px 14px", borderRadius: 9, fontSize: 13.5, display: "flex", gap: 8, alignItems: "center", marginBottom: 12 }}>
            <AlertTriangle size={16} /> {selected.name} has no active check-in — cannot check out.
          </div>
          <Btn tone="ghost" onClick={() => setSelected(null)}>Search again</Btn>
        </div>
      ) : (
        <div>
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 18, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontFamily: FONT_SERIF, fontSize: 20, color: C.ink }}>{selected.name}</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: C.navy, marginTop: 2 }}>{selected.employee_number}</div>
              </div>
              <button onClick={() => setSelected(null)} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer" }}><X size={19} /></button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14, fontSize: 13.5 }}>
              <InfoRow icon={CalendarDays} label="Check-in Date" value={fmtDate(activeRecord.date)} />
              <InfoRow icon={Clock} label="Check-in Time" value={fmtTime(activeRecord.time_in)} />
            </div>
          </div>

          {activeRecord.date < todayStr() && !backdate && (
            <div style={{ background: "#FEF3C7", border: `1px solid #FDE68A`, borderRadius: 8, padding: "9px 11px", fontSize: 12.5, color: C.amberDeep, marginBottom: 12, lineHeight: 1.5 }}>
              This check-in is from <b>{fmtDate(activeRecord.date)}</b> — they were probably never checked out. If they actually left earlier, set the real check-out date &amp; time below.
            </div>
          )}
          <BackdateDateTime label="Already left? Set the real check-out date & time (can be a previous date)" active={backdate}
            setActive={(v) => { setBackdate(v); if (v) { setBdDate(activeRecord.date < todayStr() ? activeRecord.date : todayStr()); setBdError(""); } }}
            date={bdDate} setDate={setBdDate} time={bdTime} setTime={setBdTime} error={bdError} setError={setBdError} />

          <Field label="Remarks (optional)">
            <RemarksPicker value={remarks} onChange={setRemarks} />
          </Field>

          <Btn full tone="red" size="lg" icon={DoorClosed} onClick={doCheckOut} disabled={submitting}>
            {submitting ? "Recording…" : "CHECK OUT"}
          </Btn>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   TODAY'S ATTENDANCE (full list)
--------------------------------------------------------------------- */
function AttendanceToday({ employees, attendance, empById, today, settings, leaves }) {
  const [tab, setTab] = useState("inside");
  const todays = attendance.filter((a) => a.date === today);
  const inside = todays.filter((a) => a.status === "INSIDE");
  const notCheckedIn = employees.filter((e) => e.active && !todays.some((a) => a.employee_id === e.id));

  return (
    <div>
      <SectionTitle title="Today's Attendance" sub={fmtDate(today)} />
      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {[["inside", `Inside (${inside.length})`], ["all", `All (${todays.length})`], ["missing", `Not Checked In (${notCheckedIn.length})`]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        {tab === "missing" ? (
          notCheckedIn.length === 0 ? <EmptyState icon={CheckCircle2} title="Everyone active has checked in today" /> : (
            <TableScroll headers={["Employee", "ID", "Company", "Department", "Status"]}>
              {notCheckedIn.map((e) => {
                const lv = findLeave(leaves, e.id, today);
                return (
                  <tr key={e.id}>
                    <Td>{e.name}</Td><TdMono>{e.employee_number}</TdMono><Td>{e.company}</Td><Td>{e.department}</Td>
                    <Td>{lv ? <Badge tone={lv.type === "Sick Leave" || lv.type === "Absent" ? "missing" : "neutral"}>{lv.type.toUpperCase()}</Badge> : <Badge tone="missing">NOT CHECKED IN</Badge>}</Td>
                  </tr>
                );
              })}
            </TableScroll>
          )
        ) : (
          (tab === "inside" ? inside : todays).length === 0 ? <EmptyState icon={ClipboardList} title="No records to show" /> : (
            <TableScroll headers={["Employee", "ID", "Time In", "Time Out", "Total Hours", "Status", "Recorded By"]}>
              {(tab === "inside" ? inside : todays).map((a) => {
                const e = empById[a.employee_id]; if (!e) return null;
                return (
                  <tr key={a.id}>
                    <Td>{e.name}</Td>
                    <TdMono>{e.employee_number}</TdMono>
                    <TdMono>{fmtTime(a.time_in)}</TdMono>
                    <TdMono>{fmtTimeOut(a)}</TdMono>
                    <Td>{a.total_minutes != null ? fmtDuration(a.total_minutes) : "—"}</Td>

                  </tr>
                );
              })}
            </TableScroll>
          )
        )}
      </div>
    </div>
  );
}
