/* ---------------------------------------------------------------------
   INVENTORY — USAGE & LOW-STOCK REPORTS (admin)
   Filters by location, item, in/out, date range and person/company; per-item
   usage totals; CSV export; email drafts; and a low-stock refill report.
   Email: this app has no server, so "email" opens the device's email app with
   the report filled in and downloads the CSV to attach.
--------------------------------------------------------------------- */
function openMailDraft(to, subject, body) {
  const addresses = String(to).split(/[;,]/).map((x) => x.trim()).filter(Boolean).map(encodeURIComponent).join(",");
  const mailto = `mailto:${addresses}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const a = document.createElement("a");
  a.href = mailto; a.target = "_blank";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function inventoryPresetRange(preset) {
  const now = new Date();
  if (preset === "today") return { from: todayStr(now), to: todayStr(now) };
  if (preset === "week") return { from: todayStr(startOfWeek(now)), to: todayStr(now) };
  if (preset === "month") return { from: todayStr(new Date(now.getFullYear(), now.getMonth(), 1)), to: todayStr(now) };
  if (preset === "lastmonth") {
    return { from: todayStr(new Date(now.getFullYear(), now.getMonth() - 1, 1)), to: todayStr(new Date(now.getFullYear(), now.getMonth(), 0)) };
  }
  if (preset === "30days") { const d = new Date(now); d.setDate(d.getDate() - 29); return { from: todayStr(d), to: todayStr(now) }; }
  return null;
}

function InventoryInsights({ settings, stockItems, stockMovements, activeLocationId, locationIds, loadLocationStock, notify }) {
  const canAll = typeof loadLocationStock === "function" && Array.isArray(locationIds) && locationIds.length > 1;
  const initialRange = inventoryPresetRange("month");
  const savedRecipient = (((settings || {}).report_channels || {}).inventory || {}).recipient_email || "";

  const [view, setView] = useState("usage"); // usage | low
  const [scope, setScope] = useState("current"); // current | all
  const [preset, setPreset] = useState("month");
  const [from, setFrom] = useState(initialRange.from);
  const [to, setTo] = useState(initialRange.to);
  const [itemName, setItemName] = useState("");
  const [typeFilter, setTypeFilter] = useState("ALL");
  const [search, setSearch] = useState("");
  const [remote, setRemote] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState("");
  const [refreshKey, setRefreshKey] = useState(0);
  const [sendTo, setSendTo] = useState(savedRecipient);

  // "All my locations": one-time read of every location this user may access.
  useEffect(() => {
    if (scope !== "all" || !canAll) return undefined;
    let cancelled = false;
    setLoading(true); setLoadError("");
    loadLocationStock(locationIds)
      .then((res) => { if (!cancelled) { setRemote(res); setLoading(false); } })
      .catch((e) => { if (!cancelled) { setLoadError((e && e.message) || "Could not load stock."); setLoading(false); } });
    return () => { cancelled = true; };
  }, [scope, refreshKey]);

  const failedLocations = scope === "all" && remote ? remote.filter((r) => r.error) : [];
  const dataSets = useMemo(() => {
    if (scope === "all") return remote ? remote.filter((r) => !r.error) : [];
    return [{ locationId: activeLocationId || "This location", items: stockItems, movements: stockMovements }];
  }, [scope, remote, activeLocationId, stockItems, stockMovements]);

  const itemNames = useMemo(
    () => Array.from(new Set(dataSets.flatMap((d) => d.items.map((i) => i.name)))).sort((a, b) => a.localeCompare(b)),
    [dataSets]
  );

  const { summary, detail, low } = useMemo(() => {
    const q = search.trim().toLowerCase();
    const summaryRows = [], detailRows = [], lowRows = [];

    dataSets.forEach(({ locationId, items, movements }) => {
      const itemById = Object.fromEntries(items.map((i) => [i.id, i]));

      items.forEach((i) => {
        const level = stockLevel(i.id, movements);
        if (i.active && level <= i.min_threshold) {
          lowRows.push({ locationId, name: i.name, unit: i.unit, level, min: i.min_threshold, shortfall: Math.max(0, i.min_threshold - level) });
        }
      });

      const byItem = {};
      movements.forEach((m) => {
        const item = itemById[m.item_id];
        if (!item) return;
        if (m.date < from || m.date > to) return;
        if (itemName && item.name !== itemName) return;
        if (typeFilter !== "ALL" && m.type !== typeFilter) return;
        if (q && ![m.person_name, m.company, m.remarks, m.recorded_by, m.id_card_number].some((v) => String(v || "").toLowerCase().includes(q))) return;

        detailRows.push({ ...m, locationId, item });
        const b = byItem[item.id] || (byItem[item.id] = { locationId, item, inQty: 0, outQty: 0, count: 0 });
        if (m.type === "IN") b.inQty += Number(m.quantity) || 0; else b.outQty += Number(m.quantity) || 0;
        b.count += 1;
      });

      Object.values(byItem).forEach((b) => {
        const level = stockLevel(b.item.id, movements);
        summaryRows.push({ ...b, level, isLow: !!b.item.active && level <= b.item.min_threshold });
      });
    });

    detailRows.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
    summaryRows.sort((a, b) => a.locationId.localeCompare(b.locationId) || a.item.name.localeCompare(b.item.name));
    lowRows.sort((a, b) => a.locationId.localeCompare(b.locationId) || b.shortfall - a.shortfall);
    return { summary: summaryRows, detail: detailRows, low: lowRows };
  }, [dataSets, from, to, itemName, typeFilter, search]);

  const multi = scope === "all";
  const scopeLabel = multi ? `All my locations (${dataSets.length})` : (activeLocationId || "This location");
  const periodText = `${fmtDate(from)} – ${fmtDate(to)}`;
  const today = todayStr();

  const summaryHeaders = [
    { label: "Location", get: (r) => r.locationId }, { label: "Item", get: (r) => r.item.name }, { label: "Unit", get: (r) => r.item.unit },
    { label: "Total In", get: (r) => r.inQty }, { label: "Total Out (used)", get: (r) => r.outQty }, { label: "Net Change", get: (r) => r.inQty - r.outQty },
    { label: "Movements", get: (r) => r.count }, { label: "On Hand Now", get: (r) => r.level }, { label: "Minimum", get: (r) => r.item.min_threshold },
    { label: "Status", get: (r) => (r.isLow ? "LOW STOCK" : "OK") },
  ];
  const detailHeaders = [
    { label: "Location", get: (r) => r.locationId }, { label: "Date", get: (r) => r.date }, { label: "Time", get: (r) => r.time },
    { label: "Item", get: (r) => r.item.name }, { label: "Type", get: (r) => r.type }, { label: "Quantity", get: (r) => r.quantity },
    { label: "Unit", get: (r) => r.item.unit }, { label: "Person", get: (r) => r.person_name || "" }, { label: "Phone", get: (r) => r.phone || "" },
    { label: "Company/Dept", get: (r) => r.company || "" }, { label: "ID/Card Number", get: (r) => r.id_card_number || "" },
    { label: "Remarks", get: (r) => r.remarks || "" }, { label: "Recorded By", get: (r) => r.recorded_by || "" },
  ];
  const lowHeaders = [
    { label: "Location", get: (r) => r.locationId }, { label: "Item", get: (r) => r.name }, { label: "Unit", get: (r) => r.unit },
    { label: "On Hand", get: (r) => r.level }, { label: "Minimum", get: (r) => r.min }, { label: "Short By", get: (r) => r.shortfall },
  ];

  const setPresetAndRange = (p) => {
    setPreset(p);
    const r = inventoryPresetRange(p);
    if (r) { setFrom(r.from); setTo(r.to); }
  };

  const exportSummary = () => {
    if (!summary.length) { notify("Nothing to export for these filters", "error"); return; }
    downloadFile(`inventory-usage-summary-${from}_${to}.csv`, toCSV(summary, summaryHeaders), "text/csv");
  };
  const exportDetail = () => {
    if (!detail.length) { notify("Nothing to export for these filters", "error"); return; }
    downloadFile(`inventory-usage-detail-${from}_${to}.csv`, toCSV(detail, detailHeaders), "text/csv");
  };
  const exportLow = () => {
    if (!low.length) { notify("No low-stock items to export", "error"); return; }
    downloadFile(`inventory-low-stock-${today}.csv`, toCSV(low, lowHeaders), "text/csv");
  };

  const lowLines = () => low.map((r) => `- ${multi ? r.locationId + " · " : ""}${r.name}: ${r.level} ${r.unit} on hand, minimum ${r.min} — short by ${r.shortfall} ${r.unit}`);

  const emailUsage = () => {
    if (!sendTo.trim()) { notify("Enter the email address to send to", "error"); return; }
    if (!detail.length) { notify("Nothing to send for these filters", "error"); return; }
    const filters = [itemName && `Item: ${itemName}`, typeFilter !== "ALL" && `Type: ${typeFilter === "IN" ? "Stock In" : "Stock Out"}`, search.trim() && `Search: ${search.trim()}`].filter(Boolean);
    const lines = [
      "Inventory Usage Report", `Location: ${scopeLabel}`, `Period: ${periodText}`,
      ...(filters.length ? [`Filters: ${filters.join(" · ")}`] : []),
      `Movements: ${detail.length}`, "", "Usage by item:",
      ...summary.slice(0, 30).map((r) => `- ${multi ? r.locationId + " · " : ""}${r.item.name}: in ${r.inQty}, out ${r.outQty} ${r.item.unit} (net ${r.inQty - r.outQty >= 0 ? "+" : ""}${r.inQty - r.outQty}), on hand ${r.level}${r.isLow ? " — LOW STOCK" : ""}`),
      summary.length > 30 ? `…and ${summary.length - 30} more item(s) — see the attached CSV.` : "",
      "", low.length ? "LOW STOCK — refill needed:" : "No items are currently below their minimum.", ...lowLines(),
      "", "(A CSV with every movement was just downloaded to your device — attach it before sending.)", "", "Sent from the Aramex Gatehouse Register app.",
    ].filter((l) => l !== null && l !== undefined && l !== false);
    downloadFile(`inventory-usage-detail-${from}_${to}.csv`, toCSV(detail, detailHeaders), "text/csv");
    openMailDraft(sendTo.trim(), `Inventory Usage Report — ${periodText}${low.length ? ` (${low.length} LOW STOCK)` : ""}`, lines.join("\n"));
    notify("Report ready — check your email app");
  };

  const emailLow = () => {
    if (!sendTo.trim()) { notify("Enter the email address to send to", "error"); return; }
    if (!low.length) { notify("No low-stock items to report", "error"); return; }
    const lines = [
      "LOW STOCK — REFILL NEEDED", `Location: ${scopeLabel}`, `Date: ${fmtDate(today)}`, "",
      `${low.length} item(s) are at or below their minimum quantity and need to be refilled:`, "", ...lowLines(),
      "", "Please arrange a refill as soon as possible.", "", "(A CSV of this list was just downloaded to your device — attach it before sending.)", "", "Sent from the Aramex Gatehouse Register app.",
    ];
    downloadFile(`inventory-low-stock-${today}.csv`, toCSV(low, lowHeaders), "text/csv");
    openMailDraft(sendTo.trim(), `LOW STOCK — ${low.length} item(s) need refilling (${fmtDate(today)})`, lines.join("\n"));
    notify("Low-stock report ready — check your email app");
  };

  const pill = (k, label) => (
    <button key={k} onClick={() => setView(k)} style={{
      padding: "6px 11px", borderRadius: 16, fontSize: 12, fontWeight: 600, cursor: "pointer",
      border: `1px solid ${view === k ? C.navy : C.line}`, background: view === k ? C.navy : "#fff", color: view === k ? "#fff" : C.ink,
    }}>{label}</button>
  );

  return (
    <div>
      <div style={{ display: "flex", gap: 6, marginBottom: 12, alignItems: "center", flexWrap: "wrap" }}>
        {pill("usage", "Usage report")}
        {pill("low", `Low-stock report${low.length ? ` (${low.length})` : ""}`)}
        {multi && <Btn size="sm" tone="paper" onClick={() => setRefreshKey((k) => k + 1)} disabled={loading}>{loading ? "Loading…" : "Refresh"}</Btn>}
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, marginBottom: 12 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="Location">
            <select style={inputStyle} value={scope} onChange={(e) => { setScope(e.target.value); setItemName(""); }}>
              <option value="current">{activeLocationId || "This location"} (current)</option>
              {canAll && <option value="all">All my locations</option>}
            </select>
          </Field>
          {view === "usage" && (
            <Field label="Period">
              <select style={inputStyle} value={preset} onChange={(e) => setPresetAndRange(e.target.value)}>
                <option value="today">Today</option><option value="week">This week</option><option value="month">This month</option>
                <option value="lastmonth">Last month</option><option value="30days">Last 30 days</option><option value="custom">Custom dates</option>
              </select>
            </Field>
          )}
          {view === "usage" && (
            <Field label="From"><input type="date" style={inputStyle} value={from} onChange={(e) => { setFrom(e.target.value); setPreset("custom"); }} /></Field>
          )}
          {view === "usage" && (
            <Field label="To"><input type="date" style={inputStyle} value={to} onChange={(e) => { setTo(e.target.value); setPreset("custom"); }} /></Field>
          )}
          {view === "usage" && (
            <Field label="Item">
              <select style={inputStyle} value={itemName} onChange={(e) => setItemName(e.target.value)}>
                <option value="">All items</option>
                {itemNames.map((n) => <option key={n} value={n}>{n}</option>)}
              </select>
            </Field>
          )}
          {view === "usage" && (
            <Field label="Type">
              <select style={inputStyle} value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)}>
                <option value="ALL">Stock In and Out</option><option value="OUT">Stock Out (used)</option><option value="IN">Stock In (received)</option>
              </select>
            </Field>
          )}
        </div>
        {view === "usage" && (
          <div style={{ marginTop: 10 }}>
            <Field label="Person, company or remarks contains">
              <input style={inputStyle} value={search} onChange={(e) => setSearch(e.target.value)} placeholder="e.g. a name, company or note" />
            </Field>
          </div>
        )}
      </div>

      {loadError && <div style={{ background: "#FDE8E8", border: "1px solid #F5B5B5", borderRadius: 8, padding: "9px 12px", fontSize: 12.5, color: C.redDeep, marginBottom: 12 }}>{loadError}</div>}
      {failedLocations.length > 0 && (
        <div style={{ background: "#FFF6E0", border: "1px solid #EBD28A", borderRadius: 8, padding: "9px 12px", fontSize: 12.5, color: C.ink, marginBottom: 12 }}>
          Could not load: {failedLocations.map((f) => `${f.locationId} (${f.error})`).join("; ")}
        </div>
      )}
      {scope === "all" && loading && !remote && <div style={{ fontSize: 13, color: C.ink50, padding: "8px 2px" }}>Loading stock from all your locations…</div>}

      {view === "usage" ? (
        <div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10, fontSize: 12.5, color: C.ink50 }}>
            <span><b style={{ color: C.ink }}>{detail.length}</b> movement(s)</span>·
            <span><b style={{ color: C.ink }}>{summary.length}</b> item row(s)</span>·
            <span>{scopeLabel}</span>·<span>{periodText}</span>
          </div>

          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 12 }}>
            <div style={{ padding: "10px 12px", fontWeight: 700, fontSize: 13.5, color: C.ink }}>Usage by item</div>
            {summary.length === 0 ? <EmptyState icon={ClipboardList} title="No stock movements match these filters" /> : (
              <TableScroll headers={[...(multi ? ["Location"] : []), "Item", "In", "Out (used)", "Net", "On hand", "Status"]}>
                {summary.map((r) => (
                  <tr key={r.locationId + r.item.id}>
                    {multi && <Td>{r.locationId}</Td>}
                    <Td>{r.item.name}</Td>
                    <Td>{r.inQty} {r.item.unit}</Td>
                    <Td>{r.outQty} {r.item.unit}</Td>
                    <Td>{r.inQty - r.outQty >= 0 ? "+" : ""}{r.inQty - r.outQty}</Td>
                    <Td>{r.level} {r.item.unit}</Td>
                    <Td>{r.isLow ? <Badge tone="missing">LOW STOCK</Badge> : <Badge tone="inside">OK</Badge>}</Td>
                  </tr>
                ))}
              </TableScroll>
            )}
          </div>

          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 12 }}>
            <div style={{ padding: "10px 12px", fontWeight: 700, fontSize: 13.5, color: C.ink }}>Movements{detail.length > 150 ? " (latest 150 shown — the CSV has all)" : ""}</div>
            {detail.length === 0 ? <EmptyState icon={ClipboardList} title="No movements" /> : (
              <TableScroll headers={[...(multi ? ["Location"] : []), "Date", "Item", "Type", "Qty", "Person", "Company", "Recorded by"]}>
                {detail.slice(0, 150).map((m) => (
                  <tr key={m.locationId + m.id}>
                    {multi && <Td>{m.locationId}</Td>}
                    <Td>{m.date} {fmtTime(m.time)}</Td>
                    <Td>{m.item.name}</Td>
                    <Td><Badge tone={m.type === "IN" ? "inside" : "out"}>{m.type}</Badge></Td>
                    <Td>{m.quantity} {m.item.unit}</Td>
                    <Td>{m.person_name || "—"}</Td>
                    <Td>{m.company || "—"}</Td>
                    <Td>{m.recorded_by || "—"}</Td>
                  </tr>
                ))}
              </TableScroll>
            )}
          </div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
            <Btn size="sm" tone="paper" icon={FileDown} onClick={exportSummary}>Summary CSV</Btn>
            <Btn size="sm" tone="paper" icon={FileDown} onClick={exportDetail}>Detail CSV</Btn>
          </div>
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12 }}>
            <Field label="Send this report to (email)">
              <input type="email" style={inputStyle} value={sendTo} onChange={(e) => setSendTo(e.target.value)} placeholder="name@company.com" />
            </Field>
            <div style={{ marginTop: 10 }}><Btn size="sm" tone="navy" icon={Download} onClick={emailUsage}>Email this report</Btn></div>
            <div style={{ fontSize: 11.5, color: C.ink50, marginTop: 8, lineHeight: 1.5 }}>Opens your email app with the report filled in and downloads the CSV — attach it, then send.</div>
          </div>
        </div>
      ) : (
        <div>
          <div style={{ background: low.length ? "#F7E7E5" : "#EAF5EE", border: `1px solid ${low.length ? "#E9C3BE" : "#BFE0CB"}`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, fontSize: 13.5, fontWeight: 700, color: low.length ? C.redDeep : C.ink }}>
            {low.length ? `${low.length} item(s) need refilling — ${scopeLabel}` : `All items are above their minimum — ${scopeLabel}`}
          </div>
          {low.length > 0 && (
            <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 12 }}>
              <TableScroll headers={[...(multi ? ["Location"] : []), "Item", "On hand", "Minimum", "Short by"]}>
                {low.map((r) => (
                  <tr key={r.locationId + r.name}>
                    {multi && <Td>{r.locationId}</Td>}
                    <Td>{r.name}</Td>
                    <Td>{r.level} {r.unit}</Td>
                    <Td>{r.min} {r.unit}</Td>
                    <Td><b style={{ color: C.redDeep }}>{r.shortfall} {r.unit}</b></Td>
                  </tr>
                ))}
              </TableScroll>
            </div>
          )}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
            <Btn size="sm" tone="paper" icon={FileDown} onClick={exportLow}>Low-stock CSV</Btn>
          </div>
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12 }}>
            <Field label="Send the low-stock report to (email)">
              <input type="email" style={inputStyle} value={sendTo} onChange={(e) => setSendTo(e.target.value)} placeholder="name@company.com" />
            </Field>
            <div style={{ marginTop: 10 }}><Btn size="sm" tone="red" icon={AlertTriangle} onClick={emailLow} disabled={low.length === 0}>Email low-stock report</Btn></div>
            <div style={{ fontSize: 11.5, color: C.ink50, marginTop: 8, lineHeight: 1.5 }}>Opens your email app with the refill list filled in and downloads the CSV — attach it, then send.</div>
          </div>
        </div>
      )}
    </div>
  );
}

function StockItemForm({ item, onClose, onSave, onToggleActive }) {
  const isNew = !item;
  const [name, setName] = useState(item?.name || "");
  const [unit, setUnit] = useState(item?.unit || "pcs");
  const [minThreshold, setMinThreshold] = useState(item?.min_threshold ?? 5);
  const [startingQuantity, setStartingQuantity] = useState(0);

  const save = () => {
    if (!name.trim()) return;
    onSave({ name: name.trim(), unit: unit.trim() || "pcs", min_threshold: Number(minThreshold) || 0, starting_quantity: Number(startingQuantity) || 0 });
  };

  return (
    <Modal title={isNew ? "Add Inventory Item" : "Edit Inventory Item"} onClose={onClose}>
      <Field label="Item Name"><input autoFocus style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Tea, Shipping Tags" /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Unit"><input style={inputStyle} value={unit} onChange={(e) => setUnit(e.target.value)} placeholder="boxes, kg, rolls…" /></Field>
        <Field label="Reorder Threshold"><input type="number" min="0" style={inputStyle} value={minThreshold} onChange={(e) => setMinThreshold(e.target.value)} /></Field>
      </div>
      {isNew && (
        <Field label={`Starting Quantity (how much is on hand right now, in ${unit || "units"})`}>
          <input type="number" min="0" style={inputStyle} value={startingQuantity} onChange={(e) => setStartingQuantity(e.target.value)} />
        </Field>
      )}
      <p style={{ fontSize: 12, color: C.ink50, marginTop: -4, marginBottom: 14 }}>
        {isNew ? "This records an initial \"Stock In\" so the item shows the right quantity immediately. You'll get a low-stock warning once it falls to or below the reorder threshold." : "You'll get a low-stock warning once the item's quantity on hand falls to or below this number."}
      </p>
      <Btn full tone="navy" onClick={save} disabled={!name.trim()}>{isNew ? "Add Item" : "Save Changes"}</Btn>
      {!isNew && (
        <div style={{ marginTop: 10 }}>
          <Btn full tone={item.active ? "red" : "green"} onClick={onToggleActive}>{item.active ? "Deactivate Item" : "Reactivate Item"}</Btn>
        </div>
      )}
    </Modal>
  );
}

function StockMovementForm({ item, type, onClose, onSave, canBackdate }) {
  const [quantity, setQuantity] = useState("");
  const [personName, setPersonName] = useState("");
  const [phone, setPhone] = useState("");
  const [company, setCompany] = useState("");
  const [idCard, setIdCard] = useState("");
  const [remarks, setRemarks] = useState("");
  // Only admins may record a past date/time; everyone else is stamped with the current time.
  const [backdate, setBackdateRaw] = useState(false);
  const setBackdate = (v) => setBackdateRaw(canBackdate ? v : false);
  const [bdDate, setBdDate] = useState(todayStr());
  const [bdTime, setBdTime] = useState(nowTimeStr().slice(0, 5));
  const [bdError, setBdError] = useState("");

  const save = () => {
    const q = Number(quantity);
    if (!q || q <= 0) return;
    if (backdate) {
      const now = new Date();
      const chosen = new Date(`${bdDate}T${bdTime}:00`);
      if (chosen.getTime() > now.getTime() + 60000) { setBdError("That date/time is in the future"); return; }
    }
    onSave({
      item_id: item.id, type, quantity: q, person_name: personName.trim(), phone: phone.trim(), company: company.trim(),
      id_card_number: idCard.trim(), remarks: remarks.trim(),
      backdateDate: backdate ? bdDate : null, backdateTime: backdate ? bdTime : null,
    });
  };

  return (
    <Modal title={`${type === "IN" ? "Stock In" : "Stock Out"} — ${item.name}`} onClose={onClose}>
      <Field label={`Quantity (${item.unit})`}>
        <input autoFocus type="number" min="1" style={inputStyle} value={quantity} onChange={(e) => setQuantity(e.target.value)} />
      </Field>
      <Field label={type === "IN" ? "Delivered By (person's name)" : "Collected By (person's name)"}>
        <input style={inputStyle} value={personName} onChange={(e) => setPersonName(e.target.value)} />
      </Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Phone (optional)"><input style={inputStyle} value={phone} onChange={(e) => setPhone(e.target.value)} /></Field>
        <Field label={type === "IN" ? "Company / Supplier" : "Department"}><input style={inputStyle} value={company} onChange={(e) => setCompany(e.target.value)} /></Field>
      </div>
      <Field label="ID / Card Number (optional)"><input style={inputStyle} value={idCard} onChange={(e) => setIdCard(e.target.value)} placeholder="whatever ID the gate records, if any" /></Field>

      {!canBackdate ? (
        <div style={{ fontSize: 12, color: C.ink50, marginBottom: 14 }}>Recorded at the current time automatically.</div>
      ) : !backdate ? (
        <button type="button" onClick={() => { setBackdate(true); setBdError(""); }} style={{
          background: "none", border: "none", color: C.navy, fontSize: 12.5, fontWeight: 600,
          cursor: "pointer", textDecoration: "underline", padding: 0, marginBottom: 14, display: "block",
        }}>
          This actually happened earlier? Set the real date &amp; time
        </button>
      ) : (
        <div style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 9, padding: "12px 14px", marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 9 }}>
            <span style={{ fontSize: 12, fontWeight: 700, color: C.amberDeep, letterSpacing: 0.3 }}>ACTUAL DATE &amp; TIME</span>
            <button type="button" onClick={() => { setBackdate(false); setBdError(""); }} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer", fontSize: 12 }}>Use now instead</button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <input type="date" style={{ ...inputStyle, background: "#fff" }} value={bdDate} max={todayStr()} onChange={(e) => { setBdDate(e.target.value); setBdError(""); }} />
            <input type="time" style={{ ...inputStyle, background: "#fff" }} value={bdTime} onChange={(e) => { setBdTime(e.target.value); setBdError(""); }} />
          </div>
          {bdError && <div style={{ fontSize: 12, color: C.redDeep, marginTop: 6 }}>{bdError}</div>}
        </div>
      )}
      <Field label="Remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      <Btn full tone={type === "IN" ? "green" : "red"} onClick={save} disabled={!Number(quantity)}>Record {type === "IN" ? "Stock In" : "Stock Out"}</Btn>
    </Modal>
  );
}

/* ---------------------------------------------------------------------
   SHIFT HANDOVER / TAKEOVER
   The outgoing guard checks off every piece of equipment and pass count
   on the post, then the incoming guard reviews and formally takes over.
   Anything missing is flagged immediately and can be emailed straight to
   a manager rather than waiting for a scheduled report.
--------------------------------------------------------------------- */
function HandoverScreen({ session, users, roster, handoverItems, handoverRecords, persistHandoverItems, persistHandoverRecords, settings, persistSettings, notify }) {
  const [tab, setTab] = useState("current");
  const [showStart, setShowStart] = useState(false);
  const [takingOver, setTakingOver] = useState(null);
  const [managingItems, setManagingItems] = useState(false);
  useEffect(() => { if (window.__startHandover) { window.__startHandover = false; setShowStart(true); } }, []);

  const pending = handoverRecords.find((r) => r.status === "PENDING");
  const activeItems = handoverItems.filter((i) => i.active);
  const history = useMemo(() => [...handoverRecords].filter((r) => r.status === "COMPLETED").sort((a, b) => (b.date + b.time_out).localeCompare(a.date + a.time_out)), [handoverRecords]);

  const startHandover = async (data) => {
    const now = new Date();
    const missing = data.items.filter((it) => !handoverItemOk(it));
    const rec = {
      id: uid("ho_"), date: todayStr(now), time_out: nowTimeStr(now), time_in: null,
      outgoing_guard: session.name, outgoing_uid: session.id, incoming_uid: data.incoming_uid, incoming_guard_expected: data.incoming_guard_expected, incoming_guard_confirmed: null,
      status: "PENDING", items: data.items, remarks_out: data.remarks, remarks_in: "",
      created_at: Date.now(), updated_at: Date.now(),
    };
    await persistHandoverRecords([rec, ...handoverRecords]);
    setShowStart(false);
    notify("Handover submitted — waiting for the next guard to take over");
    if (missing.length > 0) notify(`${missing.length} item(s) flagged as missing or short`, "error");
  };

  const completeTakeover = async (remarksIn, updatedItems) => {
    const now = new Date();
    const updated = { ...pending, status: "COMPLETED", time_in: nowTimeStr(now), incoming_guard_confirmed: session.name, incoming_confirmed_uid: session.id, remarks_in: remarksIn, items: updatedItems, updated_at: Date.now() };
    await persistHandoverRecords(handoverRecords.map((r) => (r.id === pending.id ? updated : r)));
    setTakingOver(null);
    notify("Shift taken over");
  };

  const sendMissingAlert = async (record) => {
    const alert = settings.handover_alert || { recipient_name: "", recipient_email: "" };
    if (!alert.recipient_email) { notify("Add a manager's email in Settings → Handover Alerts first", "error"); return; }
    const missing = record.items.filter((it) => !handoverItemOk(it));
    const subject = `Gate Handover — ${missing.length} item(s) missing or short (${record.date})`;
    const lines = [
      `Shift handover reported missing/short items.`, `Date: ${fmtDate(record.date)}`, `Outgoing guard: ${record.outgoing_guard}`,
      `Incoming guard: ${record.incoming_guard_confirmed || record.incoming_guard_expected}`, "", "Missing / short:",
      ...missing.map((it) => it.type === "quantity" ? `- ${it.name}: ${it.actual_quantity ?? 0} / ${it.expected_quantity} expected` : `- ${it.name}: missing`),
      "", record.remarks_out ? `Outgoing notes: ${record.remarks_out}` : "", record.remarks_in ? `Incoming notes: ${record.remarks_in}` : "",
      "", "Sent from the Aramex Gatehouse Register app.",
    ].filter(Boolean);
    const mailto = `mailto:${encodeURIComponent(alert.recipient_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;
    const a = document.createElement("a"); a.href = mailto; a.target = "_blank";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    notify("Alert ready — check your email app");
  };

  return (
    <div>
      <SectionTitle title="Shift Handover" sub={pending ? "A handover is waiting to be taken over" : "No handover currently pending"}
        action={isMgmt(session) ? { label: "Manage Checklist", onClick: () => setManagingItems(true) } : undefined} />

      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {[["current", "Current"], ["history", "History"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      {tab === "current" ? (
        <div>
          {pending ? (
            <div style={{ background: "#fff", border: `2px solid ${C.amber}`, borderRadius: 12, padding: 18, marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                <RefreshCw size={17} color={C.amberDeep} />
                <span style={{ fontWeight: 700, fontSize: 14.5, color: C.amberDeep }}>Pending Takeover</span>
              </div>
              <div style={{ fontSize: 13, color: C.ink, marginBottom: 4 }}>Handed over by <b>{pending.outgoing_guard}</b> at {fmtTime(pending.time_out)}</div>
              <div style={{ fontSize: 13, color: C.ink50, marginBottom: 12 }}>Expected incoming guard: {pending.incoming_guard_expected}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 12 }}>
                {pending.items.map((it) => (
                  <div key={it.item_id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "3px 0", borderBottom: `1px dashed ${C.line}` }}>
                    <span>{it.name}</span>
                    {it.type === "quantity" ? (
                      <span style={{ fontFamily: FONT_MONO, color: handoverItemOk(it) ? C.greenDeep : C.redDeep, fontWeight: 600 }}>{it.actual_quantity ?? 0} / {it.expected_quantity}</span>
                    ) : (
                      <Badge tone={it.present ? "inside" : "missing"}>{it.present ? "OK" : "MISSING"}</Badge>
                    )}
                  </div>
                ))}
              </div>
              {pending.remarks_out && <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 12 }}>Notes from outgoing guard: {pending.remarks_out}</div>}
              {pending.items.some((it) => !handoverItemOk(it)) && (
                <div style={{ background: "#FEE2E2", color: C.redDeep, borderRadius: 8, padding: "9px 11px", fontSize: 12.5, marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <span>Some items are missing or short.</span>
                  <Btn size="sm" tone="red" onClick={() => sendMissingAlert(pending)}>Alert Manager</Btn>
                </div>
              )}
              {pending.incoming_uid === session.id ? <Btn full tone="amber" icon={RefreshCw} onClick={() => setTakingOver(pending)}>Take Over Shift</Btn> : <div style={{ fontSize: 12.5, color: C.ink50 }}>Waiting for {pending.incoming_guard_expected || "the assigned guard"} to take over.</div>}
            </div>
          ) : (
            <div style={{ marginBottom: 16 }}>
              <EmptyState icon={RefreshCw} title="No handover pending" sub="Starting a new handover below will post it for the next guard" />
            </div>
          )}

          <Btn full tone="navy" icon={DoorOpen} onClick={() => setShowStart(true)} disabled={!!pending || session.role === "manager"}>
            {pending ? "Complete the pending takeover first" : "+ Start Handover (End of My Shift)"}
          </Btn>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {history.length === 0 ? <EmptyState icon={ClipboardList} title="No completed handovers yet" /> : (
            history.map((r) => {
              const missing = r.items.filter((it) => !handoverItemOk(it));
              return (
                <div key={r.id} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                    <span style={{ fontWeight: 600, fontSize: 13.5 }}>{fmtDate(r.date)}</span>
                    {missing.length > 0 ? <Badge tone="missing">{missing.length} ISSUE(S)</Badge> : <Badge tone="inside">ALL CLEAR</Badge>}
                  </div>
                  <div style={{ fontSize: 12.5, color: C.ink50 }}>{r.outgoing_guard} → {r.incoming_guard_confirmed} · {fmtTime(r.time_out)} to {fmtTime(r.time_in)}</div>
                  {missing.length > 0 && <div style={{ fontSize: 12, color: C.redDeep, marginTop: 4 }}>{missing.map((m) => m.name).join(", ")}</div>}
                </div>
              );
            })
          )}
        </div>
      )}

      {showStart && <HandoverForm items={activeItems} users={users} roster={roster} session={session} onClose={() => setShowStart(false)} onSave={startHandover} />}
      {takingOver && <TakeoverForm record={takingOver} onClose={() => setTakingOver(null)} onConfirm={completeTakeover} />}
      {managingItems && (
        <HandoverItemsManager items={handoverItems} persistItems={persistHandoverItems}
          settings={settings} persistSettings={persistSettings} notify={notify} onClose={() => setManagingItems(false)} />
      )}
    </div>
  );
}

function HandoverForm({ items, users, roster, session, onClose, onSave }) {
  const [state, setState] = useState(() => Object.fromEntries(items.map((i) => [i.id, i.type === "check" ? true : i.expected_quantity])));
  const [incomingGuard, setIncomingGuard] = useState("");
  const [otherName, setOtherName] = useState("");
  const [remarks, setRemarks] = useState("");
  const OTHER = "__other__";

  // Guards from the old accounts list plus the location roster (Firebase mode), without duplicates or yourself.
  const guardOptions = (roster || []).filter((r) => r.active !== false && r.name && r.id !== session.id).sort((a, b) => a.name.localeCompare(b.name));
  const guardNames = guardOptions.map((g) => g.name);

  const chosenGuard = (guardOptions.find((g) => g.id === incomingGuard) || {}).name || "";

  const save = () => {
    if (!chosenGuard) return;
    const builtItems = items.map((i) => ({
      item_id: i.id, name: i.name, type: i.type,
      present: i.type === "check" ? !!state[i.id] : null,
      expected_quantity: i.expected_quantity,
      actual_quantity: i.type === "quantity" ? Number(state[i.id]) : null,
    }));
    onSave({ incoming_guard_expected: chosenGuard, incoming_uid: incomingGuard, remarks: remarks.trim(), items: builtItems });
  };

  return (
    <Modal title="Start Shift Handover" onClose={onClose} wide>
      <Field label="Incoming guard">
        <select style={inputStyle} value={incomingGuard} onChange={(e) => setIncomingGuard(e.target.value)}>
          <option value="">Select…</option>
          {guardOptions.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
          
        </select>
      </Field>
      {incomingGuard === OTHER && (
        <Field label="Incoming guard's name"><input style={inputStyle} value={otherName} onChange={(e) => setOtherName(e.target.value)} placeholder="Full name" autoFocus /></Field>
      )}
      {guardNames.length === 0 && (
        <div style={{ fontSize: 12, color: C.ink50, marginBottom: 10, lineHeight: 1.5 }}>No other guards are listed yet — a guard appears here after their first login. Choose “Someone else” and type the name.</div>
      )}
      <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink50, margin: "6px 0" }}>CHECKLIST</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
        {items.map((i) => (
          <div key={i.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.paperDim, borderRadius: 8, padding: "9px 12px" }}>
            <span style={{ fontSize: 13.5 }}>{i.name}</span>
            {i.type === "check" ? (
              <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer" }}>
                <input type="checkbox" checked={!!state[i.id]} onChange={(e) => setState((s) => ({ ...s, [i.id]: e.target.checked }))} />
                <span style={{ fontSize: 12.5, color: state[i.id] ? C.greenDeep : C.redDeep, fontWeight: 600 }}>{state[i.id] ? "Present" : "Missing"}</span>
              </label>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <input type="number" min="0" style={{ ...inputStyle, width: 72, padding: "6px 8px" }} value={state[i.id]} onChange={(e) => setState((s) => ({ ...s, [i.id]: e.target.value }))} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink50 }}>/ {i.expected_quantity}</span>
              </div>
            )}
          </div>
        ))}
      </div>
      <Field label="Remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      <Btn full tone="navy" onClick={save} disabled={!chosenGuard}>Submit Handover</Btn>
    </Modal>
  );
}

function TakeoverForm({ record, onClose, onConfirm }) {
  const [items, setItems] = useState(record.items);
  const [remarks, setRemarks] = useState("");

  const toggleCheck = (itemId) => setItems((list) => list.map((i) => (i.item_id === itemId ? { ...i, present: !i.present } : i)));
  const setQty = (itemId, val) => setItems((list) => list.map((i) => (i.item_id === itemId ? { ...i, actual_quantity: Number(val) } : i)));

  return (
    <Modal title="Take Over Shift" onClose={onClose} wide>
      <p style={{ fontSize: 12.5, color: C.ink50, marginTop: 0 }}>Review what the outgoing guard reported. Adjust anything that doesn't match what you actually find.</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
        {items.map((i) => (
          <div key={i.item_id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.paperDim, borderRadius: 8, padding: "9px 12px" }}>
            <span style={{ fontSize: 13.5 }}>{i.name}</span>
            {i.type === "check" ? (
              <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer" }}>
                <input type="checkbox" checked={!!i.present} onChange={() => toggleCheck(i.item_id)} />
                <span style={{ fontSize: 12.5, color: i.present ? C.greenDeep : C.redDeep, fontWeight: 600 }}>{i.present ? "Present" : "Missing"}</span>
              </label>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <input type="number" min="0" style={{ ...inputStyle, width: 72, padding: "6px 8px" }} value={i.actual_quantity ?? 0} onChange={(e) => setQty(i.item_id, e.target.value)} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink50 }}>/ {i.expected_quantity}</span>
              </div>
            )}
          </div>
        ))}
      </div>
      <Field label="Your remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      <Btn full tone="amber" onClick={() => onConfirm(remarks.trim(), items)}>Confirm Takeover</Btn>
    </Modal>
  );
}

function HandoverItemsManager({ items, persistItems, settings, persistSettings, notify, onClose }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [newType, setNewType] = useState("check");
  const [newQty, setNewQty] = useState(10);
  const alert0 = settings.handover_alert || { recipient_name: "", recipient_email: "" };
  const [alertForm, setAlertForm] = useState(alert0);

  const addItem = async () => {
    if (!newName.trim()) return;
    await persistItems([{ id: uid("hi_"), name: newName.trim(), type: newType, expected_quantity: newType === "quantity" ? Number(newQty) || 0 : null, active: true, created_at: Date.now() }, ...items]);
    setNewName(""); setNewQty(10); setAdding(false);
    notify("Checklist item added");
  };
  const toggleActive = async (item) => {
    await persistItems(items.map((i) => (i.id === item.id ? { ...i, active: !i.active } : i)));
  };
  const saveAlert = async () => {
    if (alertForm.recipient_email && !alertForm.recipient_name) { notify("Add a name for the recipient too", "error"); return; }
    await persistSettings({ ...settings, handover_alert: alertForm });
    notify("Handover alert settings saved");
  };

  return (
    <Modal title="Manage Handover Checklist" onClose={onClose} wide>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>Checklist Items</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {items.map((i) => (
            <div key={i.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.paperDim, borderRadius: 7, padding: "7px 10px" }}>
              <span style={{ fontSize: 13, opacity: i.active ? 1 : 0.5 }}>{i.name} {i.type === "quantity" ? `(expect ${i.expected_quantity})` : ""}{!i.active ? " — inactive" : ""}</span>
              <button onClick={() => toggleActive(i)} style={{ background: "none", border: `1px solid ${C.line}`, borderRadius: 6, padding: "3px 8px", fontSize: 11, cursor: "pointer" }}>{i.active ? "Remove" : "Restore"}</button>
            </div>
          ))}
        </div>
        {!adding ? (
          <Btn size="sm" tone="paper" icon={UserPlus} onClick={() => setAdding(true)}>Add Item</Btn>
        ) : (
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 8, padding: 10 }}>
            <Field label="Item name"><input style={inputStyle} value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="e.g. Torch, Radio" /></Field>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              <Field label="Type">
                <select style={inputStyle} value={newType} onChange={(e) => setNewType(e.target.value)}>
                  <option value="check">Checkbox (present/missing)</option>
                  <option value="quantity">Quantity (count)</option>
                </select>
              </Field>
              {newType === "quantity" && <Field label="Expected quantity"><input type="number" min="0" style={inputStyle} value={newQty} onChange={(e) => setNewQty(e.target.value)} /></Field>}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn size="sm" tone="ghost" onClick={() => setAdding(false)}>Cancel</Btn>
              <Btn size="sm" tone="navy" onClick={addItem} disabled={!newName.trim()}>Add</Btn>
            </div>
          </div>
        )}
      </div>

      <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 14 }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>Handover Alert Email</div>
        <p style={{ fontSize: 12, color: C.ink50, margin: "0 0 10px" }}>Who gets notified immediately when a handover has missing or short items.</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <Field label="Manager's name"><input style={inputStyle} value={alertForm.recipient_name} onChange={(e) => setAlertForm((f) => ({ ...f, recipient_name: e.target.value }))} /></Field>
          <Field label="Manager's email"><input type="email" style={inputStyle} value={alertForm.recipient_email} onChange={(e) => setAlertForm((f) => ({ ...f, recipient_email: e.target.value }))} /></Field>
        </div>
        <Btn size="sm" tone="navy" onClick={saveAlert}>Save</Btn>
      </div>
    </Modal>
  );
}

/* ---------------------------------------------------------------------
   INCIDENT REPORTS
   Anything out of the ordinary at the gate — theft, fire, altercation,
   safety hazard, trespassing, and so on — with severity levels and an
   immediate manager alert for anything serious, separate from the
   scheduled reports.
--------------------------------------------------------------------- */
const INCIDENT_TYPES = ["Theft", "Fire", "Altercation / Dispute", "Safety Hazard", "Trespassing", "Medical Emergency", "Property Damage", "Suspicious Activity", "Other"];
const INCIDENT_SEVERITIES = ["Low", "Medium", "High", "Critical"];
const INCIDENT_STATUSES = ["Open", "Under Investigation", "Resolved", "Closed"];

function severityTone(sev) {
  if (sev === "Critical" || sev === "High") return "missing";
  if (sev === "Medium") return "overtime";
  return "neutral";
}

function IncidentsScreen({ session, incidents, persistIncidents, settings, persistSettings, notify }) {
  const [tab, setTab] = useState("open");
  const [showForm, setShowForm] = useState(false);
  const [viewing, setViewing] = useState(null);
  const [alertSettings, setAlertSettings] = useState(false);

  const sorted = useMemo(() => [...incidents].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)), [incidents]);
  const open = sorted.filter((i) => i.status === "Open" || i.status === "Under Investigation");
  const list = tab === "open" ? open : sorted;

  const report = async (data) => {
    const now = new Date();
    const rec = {
      id: uid("inc_"), date: todayStr(now), time: nowTimeStr(now), ...data,
      status: "Open", reported_by: session.name, resolved_by: null, resolution_notes: "",
      created_at: Date.now(), updated_at: Date.now(),
    };
    await persistIncidents([rec, ...incidents]);
    setShowForm(false);
    notify("Incident reported");
  };

  const updateStatus = async (incident, status, resolutionNotes) => {
    const updated = {
      ...incident, status, updated_at: Date.now(),
      resolution_notes: resolutionNotes != null ? resolutionNotes : incident.resolution_notes,
      resolved_by: (status === "Resolved" || status === "Closed") ? session.name : incident.resolved_by,
    };
    await persistIncidents(incidents.map((i) => (i.id === incident.id ? updated : i)));
    setViewing(updated);
    notify("Incident updated");
  };

  const sendAlert = async (incident) => {
    const alert = settings.incident_alert || { recipient_name: "", recipient_email: "" };
    if (!alert.recipient_email) { notify("Add a manager's email in Alert Settings first", "error"); return; }
    const subject = `[${incident.severity.toUpperCase()}] Incident: ${incident.type} — ${fmtDate(incident.date)}`;
    const lines = [
      `Incident Report`, `Type: ${incident.type}`, `Severity: ${incident.severity}`, `Date/Time: ${fmtDate(incident.date)} ${fmtTime(incident.time)}`,
      `Location: ${incident.location || "—"}`, `Reported by: ${incident.reported_by}`, "",
      `Description:`, incident.description || "—", "",
      incident.people_involved ? `People involved: ${incident.people_involved}` : "",
      incident.action_taken ? `Action taken: ${incident.action_taken}` : "",
      "", "Sent from the Aramex Gatehouse Register app.",
    ].filter(Boolean);
    const mailto = `mailto:${encodeURIComponent(alert.recipient_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;
    const a = document.createElement("a"); a.href = mailto; a.target = "_blank";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    notify("Alert ready — check your email app");
  };

  return (
    <div>
      <SectionTitle title="Incident Reports" sub={`${open.length} open`} action={{ label: "+ Report Incident", onClick: () => setShowForm(true) }} />
      {isMgmt(session) && (
        <button onClick={() => setAlertSettings(true)} style={{ background: "none", border: "none", color: C.navy, fontSize: 12, fontWeight: 600, cursor: "pointer", textDecoration: "underline", marginBottom: 12, display: "block" }}>
          Alert Settings
        </button>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {[["open", `Open (${open.length})`], ["all", "All"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {list.length === 0 ? <EmptyState icon={AlertTriangle} title={tab === "open" ? "No open incidents" : "No incidents reported yet"} /> : (
          list.map((i) => (
            <button key={i.id} onClick={() => setViewing(i)} style={{ textAlign: "left", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px", cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 600, fontSize: 14, color: C.ink }}>{i.type}</span>
                    <Badge tone={severityTone(i.severity)}>{i.severity.toUpperCase()}</Badge>
                    <Badge tone="neutral">{i.status.toUpperCase()}</Badge>
                  </div>
                  <div style={{ fontSize: 12.5, color: C.ink50, marginTop: 3 }}>{i.location || "—"} · {fmtDate(i.date)} {fmtTime(i.time)}</div>
                  <div style={{ fontSize: 12.5, color: C.ink, marginTop: 4 }}>{i.description}</div>
                  <div style={{ fontSize: 11.5, color: C.ink50, marginTop: 4 }}>Reported by {i.reported_by}</div>
                </div>
                <ChevronRight size={16} color={C.ink50} style={{ flexShrink: 0 }} />
              </div>
            </button>
          ))
        )}
      </div>

      {showForm && <IncidentForm onClose={() => setShowForm(false)} onSave={report} />}
      {viewing && (
        <IncidentDetailModal incident={viewing} onClose={() => setViewing(null)} onUpdateStatus={updateStatus} onAlert={sendAlert} />
      )}
      {alertSettings && (
        <IncidentAlertSettings settings={settings} persistSettings={persistSettings} notify={notify} onClose={() => setAlertSettings(false)} />
      )}
    </div>
  );
}

function IncidentForm({ onClose, onSave }) {
  const [type, setType] = useState(INCIDENT_TYPES[0]);
  const [severity, setSeverity] = useState("Low");
  const [location, setLocation] = useState("");
  const [description, setDescription] = useState("");
  const [peopleInvolved, setPeopleInvolved] = useState("");
  const [actionTaken, setActionTaken] = useState("");

  const save = () => {
    if (!description.trim()) return;
    onSave({ type, severity, location: location.trim(), description: description.trim(), people_involved: peopleInvolved.trim(), action_taken: actionTaken.trim() });
  };

  return (
    <Modal title="Report Incident" onClose={onClose} wide>
      <Field label="Type">
        <select style={inputStyle} value={type} onChange={(e) => setType(e.target.value)}>
          {INCIDENT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
      </Field>
      <Field label="Severity">
        <div style={{ display: "flex", gap: 6 }}>
          {INCIDENT_SEVERITIES.map((s) => (
            <button key={s} type="button" onClick={() => setSeverity(s)} style={{
              flex: 1, padding: "8px 6px", borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${severity === s ? C.navy : C.line}`, background: severity === s ? C.navy : "#fff", color: severity === s ? "#fff" : C.ink,
            }}>{s}</button>
          ))}
        </div>
      </Field>
      <Field label="Location"><input style={inputStyle} value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Main Gate, Loading Bay 2" /></Field>
      <Field label="Description"><textarea style={{ ...inputStyle, minHeight: 80 }} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What happened?" /></Field>
      <Field label="People Involved (optional)"><input style={inputStyle} value={peopleInvolved} onChange={(e) => setPeopleInvolved(e.target.value)} /></Field>
      <Field label="Immediate Action Taken (optional)"><input style={inputStyle} value={actionTaken} onChange={(e) => setActionTaken(e.target.value)} /></Field>
      <Btn full tone="red" icon={AlertTriangle} onClick={save} disabled={!description.trim()}>Submit Report</Btn>
    </Modal>
  );
}

function IncidentDetailModal({ incident, onClose, onUpdateStatus, onAlert }) {
  const [notes, setNotes] = useState(incident.resolution_notes || "");

  return (
    <Modal title={incident.type} onClose={onClose} wide>
      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        <Badge tone={severityTone(incident.severity)}>{incident.severity.toUpperCase()}</Badge>
        <Badge tone="neutral">{incident.status.toUpperCase()}</Badge>
      </div>
      <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 10 }}>
        {incident.location || "—"} · {fmtDate(incident.date)} {fmtTime(incident.time)} · Reported by {incident.reported_by}
      </div>
      <div style={{ fontSize: 13.5, color: C.ink, marginBottom: 10, lineHeight: 1.5 }}>{incident.description}</div>
      {incident.people_involved && <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 6 }}>People involved: {incident.people_involved}</div>}
      {incident.action_taken && <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 6 }}>Action taken: {incident.action_taken}</div>}

      {(incident.severity === "High" || incident.severity === "Critical") && incident.status !== "Closed" && (
        <div style={{ background: "#FEE2E2", borderRadius: 8, padding: "9px 11px", marginBottom: 14, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <span style={{ fontSize: 12.5, color: C.redDeep, fontWeight: 600 }}>{incident.severity} severity — consider alerting a manager</span>
          <Btn size="sm" tone="red" onClick={() => onAlert(incident)}>Alert Manager</Btn>
        </div>
      )}

      <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 14 }}>
        <Field label="Resolution notes"><textarea style={{ ...inputStyle, minHeight: 60 }} value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink50, marginBottom: 8 }}>Update status</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {INCIDENT_STATUSES.map((s) => (
            <button key={s} type="button" onClick={() => onUpdateStatus(incident, s, notes)} style={{
              padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${incident.status === s ? C.navy : C.line}`, background: incident.status === s ? C.navy : "#fff", color: incident.status === s ? "#fff" : C.ink,
            }}>{s}</button>
          ))}
        </div>
      </div>
    </Modal>
  );
}

const ORIGIN_NAMES = Object.fromEntries(ORIGIN_TABLE.split("|").map((x) => { const i = x.indexOf(":"); return [x.slice(0, i), x.slice(i + 1)]; }));
function originName(code, custom) {
  const c = String(code || "").trim().toUpperCase();
  if (!c) return "";
  return (custom && custom[c]) || ORIGIN_NAMES[c] || "";
}
function originLabel(code, custom) {
  const c = String(code || "").trim().toUpperCase();
  if (!c) return "";
  const n = originName(c, custom);
  return n ? `${c} — ${n}` : c;
}
// Two kinds of shipment record: individual ones (one arrival number each) and
// "count only" ones (COUNT_IN / COUNT_OUT) that record how many, and who brought/took them.
function isCountRecord(s) { return s.status === "COUNT_IN" || s.status === "COUNT_OUT"; }
function shipQty(s) { return isCountRecord(s) ? (Number(s.quantity) || 0) : 1; }
function sumQty(list) { return list.reduce((n, s) => n + shipQty(s), 0); }
function isArrival(s) { return s.status !== "COUNT_OUT"; }
function isRelease(s) { return s.status === "DISPATCHED" || s.status === "COUNT_OUT"; }
function shipRef(s) { return isCountRecord(s) ? `${shipQty(s)} (count only)` : (s.arrival_no || s.awb || "—"); }
function shipKey(s) { return String(s.arrival_no || s.awb || "").trim().toUpperCase(); }

function shipmentAgeMs(s) {
  return Date.now() - new Date(`${s.date_in}T${s.time_in}`).getTime();
}
function shipmentState(s, thresholdDays) {
  if (s.status !== "IN_WAREHOUSE") return "DISPATCHED";
  const limit = (thresholdDays || 3) * 86400000;
  const age = shipmentAgeMs(s);
  if (age >= limit) return "OVERDUE";
  if (age >= limit * 0.75) return "DUE_SOON";
  return "OK";
}
function fmtAgeMs(ms) {
  const mins = Math.max(0, Math.floor(ms / 60000));
  const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}
function dayKeys() {
  return {
    today: todayStr(),
    yesterday: todayStr(new Date(Date.now() - 86400000)),
    d2: todayStr(new Date(Date.now() - 2 * 86400000)),
  };
}
function dayLabelFor(dateStr, keys) {
  const k = keys || dayKeys();
  if (!dateStr) return "";
  if (dateStr === k.today) return "Today";
  if (dateStr === k.yesterday) return "Yesterday";
  if (dateStr === k.d2) return "2 days ago";
  return new Date(dateStr + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function inDayBucket(dateStr, bucket, keys) {
  if (!dateStr) return false;
  if (bucket === "all") return true;
  if (bucket === "today") return dateStr === keys.today;
  if (bucket === "yesterday") return dateStr === keys.yesterday;
  if (bucket === "d2") return dateStr === keys.d2;
  if (bucket === "older") return dateStr < keys.d2;
  return false;
}
const SHIPMENT_DAY_CHIPS = [["today", "Today"], ["yesterday", "Yesterday"], ["d2", "2 Days Ago"], ["older", "Older"], ["all", "All"]];

function ShipmentsScreen({ session, shipments, persistShipments, settings, persistSettings, notify, sendReport, getDb, firebaseMode, activeLocationId }) {
  const threshold = settings.shipment_threshold_days || 3;
  const custom = settings.origin_custom || {};
  const keys = dayKeys();
  const [day, setDay] = useState("today");
  const [mode, setMode] = useState("arrived");
  const [q, setQ] = useState("");
  const [showReceive, setShowReceive] = useState(false);
  const [showScan, setShowScan] = useState(false);
  const [releasing, setReleasing] = useState(null);
  const [noting, setNoting] = useState(null);
  const [showThreshold, setShowThreshold] = useState(false);
  const [showCodes, setShowCodes] = useState(false);
  const [showCount, setShowCount] = useState(null); // "IN" | "OUT" | null
  const [damageFor, setDamageFor] = useState(null);
  const [photosOf, setPhotosOf] = useState(null);
  const [onlyDamaged, setOnlyDamaged] = useState(false);

  const inWh = useMemo(() => shipments.filter((s) => s.status === "IN_WAREHOUSE").sort((a, b) => (a.date_in + a.time_in).localeCompare(b.date_in + b.time_in)), [shipments]);
  const overdue = inWh.filter((s) => shipmentState(s, threshold) === "OVERDUE");
  const carry = inWh.filter((s) => s.date_in < keys.today);
  const carryBy = [
    ["yesterday", "Yesterday", carry.filter((s) => s.date_in === keys.yesterday).length],
    ["d2", "2 days ago", carry.filter((s) => s.date_in === keys.d2).length],
    ["older", "Older", carry.filter((s) => s.date_in < keys.d2).length],
  ].filter((x) => x[2] > 0);

  const inMode = (s, bucket, m) => {
    if (m === "arrived") return isArrival(s) && inDayBucket(s.date_in, bucket, keys);
    if (m === "released") return isRelease(s) && inDayBucket(s.date_out, bucket, keys);
    return s.status === "IN_WAREHOUSE" && inDayBucket(s.date_in, bucket, keys);
  };
  const countFor = (bucket, m) => sumQty(shipments.filter((s) => inMode(s, bucket, m)));

  const matches = (s) => {
    if (!q.trim()) return true;
    const t = q.toLowerCase();
    return [s.arrival_no, s.awb, s.origin, originName(s.origin, custom), s.brought_by_name, s.brought_by_id, s.taken_by_name, s.taken_by_id, s.destination, s.damage_notes].some((v) => (v || "").toLowerCase().includes(t));
  };
  const list = shipments.filter((s) => inMode(s, day, mode)).filter(matches).filter((s) => !onlyDamaged || s.damaged).sort((a, b) => {
    if (mode === "remaining") return (a.date_in + a.time_in).localeCompare(b.date_in + b.time_in);
    if (mode === "released") return ((b.date_out || "") + (b.time_out || "")).localeCompare((a.date_out || "") + (a.time_out || ""));
    return (b.date_in + b.time_in).localeCompare(a.date_in + a.time_in);
  }).slice(0, 300);

  const baseRecord = (now, fields, backdateDate, backdateTime) => ({
    ...fields, status: "IN_WAREHOUSE",
    date_in: backdateDate || todayStr(now), time_in: backdateTime ? `${backdateTime}:00` : nowTimeStr(now),
    received_by: session.name, date_out: null, time_out: null,
    taken_by_name: "", taken_by_company: "", taken_by_phone: "", taken_by_id: "", destination: "", released_by: null, remarks_out: "",
    hold_notes: [], created_at: Date.now(), updated_at: Date.now(),
  });

  // Damage photos live in their own collection (read only when someone opens them),
  // so the shipment list stays light. Photos need Firebase mode.
  const photoBase = () => (activeLocationId ? `locations/${activeLocationId}/shipmentPhotos` : null);
  const uploadPhotos = async (shipmentId, photos) => {
    if (!photos || photos.length === 0) return [];
    const db = getDb && getDb();
    const base = photoBase();
    if (!firebaseMode || !db || !base) {
      const msg = "Damage photos can only be saved when connected to Firebase.";
      notify(msg, "error");
      throw new Error(msg);
    }
    const ids = [];
    try {
      for (const image of photos) {
        const pid = uid("sp_");
        await db.doc(`${base}/${pid}`).set({ id: pid, shipment_id: shipmentId, image, created_at: Date.now() });
        ids.push(pid);
      }
    } catch (e) {
      console.error("Damage photo upload failed:", e);
      notify(describeFirestoreError(e, "save the damage photos"), "error");
      throw e;
    }
    return ids;
  };

  const receive = async (data) => {
    const now = new Date();
    const { backdateDate, backdateTime, photos, ...fields } = data;
    const id = uid("sh_");
    const photo_ids = fields.damaged ? await uploadPhotos(id, photos) : [];
    const rec = {
      id, ...baseRecord(now, fields, backdateDate, backdateTime),
      damaged: !!fields.damaged, damage_notes: fields.damaged ? (fields.damage_notes || "") : "", photo_ids,
      damage_reported_by: fields.damaged ? session.name : "",
    };
    await persistShipments([rec, ...shipments]);
    setShowReceive(false);
    setDay("today"); setMode("arrived"); // so the new shipment is visible right away
    notify(`Shipment ${shipRef(rec)} received${rec.damaged ? " — damage recorded" : ""}`);
  };

  // "Count only": how many came in / went out, with the person and their ID — no arrival numbers.
  const addCount = async (data) => {
    const now = new Date();
    const { direction, backdateDate, backdateTime, ...f } = data;
    const date = backdateDate || todayStr(now);
    const time = backdateTime ? `${backdateTime}:00` : nowTimeStr(now);
    const common = {
      id: uid("sh_"), quantity: f.quantity, arrival_no: "", awb: "", damaged: false, damage_notes: "", photo_ids: [],
      date_in: date, time_in: time, hold_notes: [], created_at: Date.now(), updated_at: Date.now(),
      taken_by_company: "", taken_by_phone: "",

    const rec = direction === "IN"
      ? { ...common, status: "COUNT_IN", origin: (f.origin || "").toUpperCase(), brought_by_name: f.brought_by_name, brought_by_id: f.brought_by_id, remarks_in: f.remarks_in || "",
          received_by: session.name, date_out: null, time_out: null, taken_by_name: "", taken_by_id: "", destination: "", released_by: null, remarks_out: "" }
      : { ...common, status: "COUNT_OUT", origin: "", brought_by_name: "", brought_by_id: "", remarks_in: "",
          received_by: "", date_out: date, time_out: time, taken_by_name: f.taken_by_name, taken_by_id: f.taken_by_id, destination: f.destination, released_by: session.name, remarks_out: f.remarks_out || "" };
    await persistShipments([rec, ...shipments]);
    setShowCount(null);
    setDay("today"); setMode(direction === "IN" ? "arrived" : "released");
    notify(`${rec.quantity} shipment${rec.quantity === 1 ? "" : "s"} ${direction === "IN" ? "received" : "released"} (count only)`);
  };

  // Damage found after arrival: needs the arrival number, a description and photos.
  const reportDamage = async (shipment, { arrival_no, damage_notes, photos }) => {
    const ids = await uploadPhotos(shipment.id, photos);
    const updated = {
      ...shipment, arrival_no: arrival_no || shipment.arrival_no, damaged: true, damage_notes,
      photo_ids: [...(shipment.photo_ids || []), ...ids], damage_reported_by: session.name, updated_at: Date.now(),

    await persistShipments([...recs, ...shipments]);
    setShowScan(false);

    notify(`${recs.length} shipment${recs.length === 1 ? "" : "s"} received`);
  };

  const release = async (shipment, data) => {
    const now = new Date();
    const { backdateDate, backdateTime, ...fields } = data;
    const updated = {
      ...shipment, ...fields, status: "DISPATCHED",
      date_out: backdateDate || todayStr(now), time_out: backdateTime ? `${backdateTime}:00` : nowTimeStr(now),

  const addNote = async (shipment, text) => {
    const now = new Date();
    const note = { date: todayStr(now), time: nowTimeStr(now), by: session.name, text };
    const updated = { ...shipment, hold_notes: [...(shipment.hold_notes || []), note], updated_at: Date.now() };
    await persistShipments(shipments.map((s) => (s.id === shipment.id ? updated : s)));

  const exportCSV = () => {
