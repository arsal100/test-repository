/* ---------------------------------------------------------------------
   MANIFEST SCAN — photo(s) of the manifest → every arrival number (and
   origin) in one go. On the hosted Claude link Claude reads each photo
   (accurate, but needs a signed-in Claude viewer); elsewhere a basic
   in-browser scanner is used. Pasting a list always works. Nothing is
   saved until the guard reviews and confirms.
--------------------------------------------------------------------- */
const MANIFEST_PROMPT = `This is a photo of a cargo import manifest listing shipments that arrived. Read the WHOLE sheet, top to bottom, every single row — do not stop early, do not skip rows, even if the print is small, faint or the photo is slightly tilted.
For each shipment row extract:
- "arrival": the ARRIVAL number (use the column headed Arrival / Arrival No. / ARR if there is one).
- "awb": the AWB / airway bill number if the row has one, otherwise "".
- "origin": the ORIGIN as the short 3-letter code (for example AUH, LON, DXB, BOM). Copy exactly as printed.
Ignore every other column (company, consignee, shipper, pieces, weight, description, dates, totals, page numbers).
Copy digits and letters exactly. If a field on a row is unreadable use "" for that field but still include the row. Never invent numbers.
Reply with ONLY a JSON array in the order the rows appear, for example:
[{"arrival":"1042215","awb":"176-48201935","origin":"AUH"},{"arrival":"1042216","awb":"","origin":"LON"}]
If you cannot find any shipment rows, reply [].`;

function parseManifestText(text) {
  const out = [];
  String(text || "").split(/[\n\r;]+/).forEach((line) => {
    const t = line.trim();
    if (!t) return;
    const parts = t.split(/[,\t]+/).map((x) => x.trim()).filter(Boolean);
    if (parts.length >= 2 && /^[A-Za-z]{3,4}$/.test(parts[parts.length - 1])) {
      out.push({ arrival: parts[0], awb: parts.length > 2 ? parts[1] : "", origin: parts[parts.length - 1].toUpperCase() });
    } else if (parts.length === 1) {
      const sp = t.split(/\s+/);
      if (sp.length > 1 && sp.every((p) => p.length >= 5)) sp.forEach((p) => out.push({ arrival: p, awb: "", origin: "" }));
      else out.push({ arrival: t, awb: "", origin: "" });
    } else {
      parts.forEach((p) => out.push({ arrival: p, awb: "", origin: "" }));
    }
  });
  return out;
}
function extractRowsFromOcr(text, custom) {
  const rows = []; const seen = new Set();
  String(text || "").split(/\r?\n/).forEach((line) => {
    const awbM = /\b\d{3}[-\s]\d{8}\b/.exec(line);
    const awb = awbM ? awbM[0].replace(/\s+/, "-") : "";
    const rest = awbM ? line.replace(awbM[0], " ") : line;
    const nums = rest.match(/\b[A-Z]{0,3}\d{5,12}\b/g) || [];
    const arrival = nums[0] || "";
    let origin = "";
    (rest.match(/\b[A-Z]{3}\b/g) || []).forEach((c) => { if (!origin && (ORIGIN_NAMES[c] || (custom && custom[c]))) origin = c; });
    const key = (arrival || awb).toUpperCase();
    if (!key || seen.has(key)) return;
    seen.add(key);
    rows.push({ arrival, awb, origin });
  });
  return rows;
}
async function getSampleImageCap() {
  try {
    if (!(typeof window !== "undefined" && window.claude && typeof window.claude.use === "function")) return null;
    const s = await window.claude.use("sample");
    if (!s) return null;
    const lim = await s.limits().catch(() => null);
    return lim && lim.images ? { sample: s, limits: lim } : null;
  } catch { return null; }
}
function loadImageEl(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image decode failed")); };
    img.src = url;
  });
}
// Keeps photos sharp but small enough to upload: re-encode large / unusual files as JPEG.
async function prepareImageForClaude(file, mediaTypes) {
  const okType = !mediaTypes || mediaTypes.length === 0 || mediaTypes.includes(file.type);
  if (okType && file.size <= 4000000) return file;
  try {
    const { img, url } = await loadImageEl(file);
    let dim = 3000, q = 0.92, blob = file;
    for (let i = 0; i < 4; i++) {
      const scale = Math.min(1, dim / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      blob = await new Promise((res) => c.toBlob((b) => res(b), "image/jpeg", q));
      if (blob && blob.size <= 4000000) break;
      dim = Math.round(dim * 0.8); q = Math.max(0.7, q - 0.07);
    }
    URL.revokeObjectURL(url);
    return blob || file;
  } catch { return file; }
}
// For the basic scanner: upscale, grayscale and stretch contrast so small print reads better.
async function prepareImageForOcr(file) {
  try {
    const { img, url } = await loadImageEl(file);
    const target = 2800;
    const scale = Math.min(2.5, target / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const data = ctx.getImageData(0, 0, c.width, c.height);
    const px = data.data; const hist = new Array(256).fill(0);
    for (let i = 0; i < px.length; i += 4) { const g = Math.round(0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]); px[i] = px[i + 1] = px[i + 2] = g; hist[g]++; }
    const total = px.length / 4; let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > total * 0.02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > total * 0.02) { hi = v; break; } }
    const span = Math.max(1, hi - lo);
    for (let i = 0; i < px.length; i += 4) { const g = Math.max(0, Math.min(255, Math.round(((px[i] - lo) / span) * 255))); px[i] = px[i + 1] = px[i + 2] = g; }
    ctx.putImageData(data, 0, 0);
    return await new Promise((res) => c.toBlob((b) => res(b || file), "image/png"));
  } catch { return file; }
}
function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("script load failed"));
    document.head.appendChild(s);
  });
}
function friendlyScanError(e) {
  const code = e && e.code;
  if (code === "not_granted") return "Claude access was declined for this page. You can still paste the list.";
  if (code === "rate_limited") return "Too many scans just now — wait a minute and try again, or paste the list.";
  if (code === "image_rejected") return "That photo couldn't be used (wrong type or too large). Try retaking it.";
  if (code === "invalid_json" || code === "empty_completion") return "Couldn't read that clearly. Try a closer, brighter, flatter photo — or paste the list.";
  if (code === "sampling_disabled" || code === "session_expired") return "Claude isn't available for this account right now. You can still paste the list.";
  if (code === "cancelled") return "";
  return "Scanning didn't work this time. Check your connection and try again, or paste the list.";
}

function ManifestScanModal({ existing, custom, onClose, onSave }) {
  const [step, setStep] = useState("get");
  const [files, setFiles] = useState([]);
  const [previews, setPreviews] = useState([]);
  const [pasteText, setPasteText] = useState("");
  const [expectedTotal, setExpectedTotal] = useState("");
  const [rows, setRows] = useState([]);
  const [scanCap, setScanCap] = useState("checking");
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState("");
  const [err, setErr] = useState("");
  const [name, setName] = useState("");
  const [idCard, setIdCard] = useState("");
  const [remarks, setRemarks] = useState("");
  const [backdate, setBackdate] = useState(false);
  const [bdDate, setBdDate] = useState(todayStr());
  const [bdTime, setBdTime] = useState(nowTimeStr().slice(0, 5));
  const [bdError, setBdError] = useState("");

  useEffect(() => {
    let off = false;
    getSampleImageCap().then((c) => { if (!off) setScanCap(c); });
    return () => { off = true; };
  }, []);
  useEffect(() => {
    const urls = files.map((f) => URL.createObjectURL(f));
    setPreviews(urls);
    return () => urls.forEach((u) => URL.revokeObjectURL(u));
  }, [files]);

  const addFiles = (e) => {
    const picked = Array.from(e.target.files || []);
    if (picked.length) setFiles((f) => [...f, ...picked]);
    e.target.value = "";
    setErr("");
  };

  const goReview = (found) => {
    const fresh = found.map((r) => ({ rid: uid("r_"), arrival: String(r.arrival || "").trim(), awb: String(r.awb || "").trim(), origin: String(r.origin || "").trim().toUpperCase(), include: true }));
    setRows((prev) => [...prev, ...fresh]);
    setFiles([]); setPasteText("");
    setStep("review");
  };

  const askClaude = async (cap, file) => {
    const img = await prepareImageForClaude(file, cap.limits.images && cap.limits.images.mediaTypes);
    try {
      return await cap.sample.json(MANIFEST_PROMPT, { images: [img], cache: false, modelTier: "complex" });
    } catch (e) {
      const c = e && e.code;
      if (c === "not_granted" || c === "rate_limited" || c === "image_rejected" || c === "cancelled") throw e;
      return await cap.sample.json(MANIFEST_PROMPT, { images: [img], cache: false });
    }
  };

  const runScan = async () => {
    if (!files.length) return;
    setBusy(true); setErr("");
    try {
      let found = [];
      if (scanCap && scanCap !== "checking") {
        for (let i = 0; i < files.length; i++) {
          setProgress(`Claude is reading photo ${i + 1} of ${files.length} — this can take a little while for a long list…`);
          const result = await askClaude(scanCap, files[i]);
          (Array.isArray(result) ? result : []).forEach((it) => {
            if (typeof it === "string") found.push({ arrival: it, awb: "", origin: "" });
            else if (it && (it.arrival || it.awb)) found.push({ arrival: it.arrival ? String(it.arrival) : "", awb: it.awb ? String(it.awb) : "", origin: it.origin ? String(it.origin) : "" });
          });
        }
      } else {
        setProgress("Loading basic scanner…");
        if (!window.Tesseract) await loadScriptOnce("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
        const worker = await window.Tesseract.createWorker("eng");
        try {
          for (let i = 0; i < files.length; i++) {
            setProgress(`Reading photo ${i + 1} of ${files.length} (basic scanner, two passes)…`);
            const blob = await prepareImageForOcr(files[i]);
            let text = "";
            for (const psm of ["6", "4"]) {
              try { await worker.setParameters({ tessedit_pageseg_mode: psm }); } catch { /* older builds */ }
              const res = await worker.recognize(blob);
              text += "\n" + res.data.text;
            }
            found = found.concat(extractRowsFromOcr(text, custom));
          }
        } finally { try { await worker.terminate(); } catch { /* ignore */ } }
      }
      if (!found.length) { setErr("No shipment numbers were found in the photo(s). Try a closer, brighter, flatter photo — or paste the list."); return; }
      goReview(found);
    } catch (e) {
      const msg = friendlyScanError(e);
      if (msg) setErr(msg);
    } finally {
      setBusy(false); setProgress("");
    }
  };

  const usePaste = () => {
    const found = parseManifestText(pasteText);
    if (!found.length) { setErr("Type or paste at least one arrival number."); return; }
    goReview(found);
  };

  const whSet = useMemo(() => new Set(existing.filter((s) => s.status === "IN_WAREHOUSE").map((s) => shipKey(s))), [existing]);
  const statuses = useMemo(() => {
    const seen = new Set();
    return rows.map((r) => {
      const k = (r.arrival || r.awb).trim().toUpperCase();
      if (!k) return "EMPTY";
      if (whSet.has(k)) return "IN_WH";
      if (seen.has(k)) return "DUP";
      seen.add(k);
      return "NEW";
    });
  }, [rows, whSet]);
  const toReceive = rows.filter((r, i) => r.include && statuses[i] === "NEW");
  const skipped = rows.length - toReceive.length;
  const expected = Number(expectedTotal) || 0;
  const countedRows = rows.filter((r, i) => statuses[i] !== "EMPTY").length;

  const updateRow = (rid, patch) => setRows((list) => list.map((r) => (r.rid === rid ? { ...r, ...patch } : r)));
  const removeRow = (rid) => setRows((list) => list.filter((r) => r.rid !== rid));
  const addRow = () => setRows((list) => [...list, { rid: uid("r_"), arrival: "", awb: "", origin: "", include: true }]);

  const save = () => {
    if (!name.trim() || toReceive.length === 0) return;
    if (backdate && new Date(`${bdDate}T${bdTime}:00`).getTime() > Date.now() + 60000) { setBdError("That date/time is in the future"); return; }
    onSave(
      toReceive.map((r) => ({ arrival: r.arrival.trim().toUpperCase(), awb: r.awb.trim().toUpperCase(), origin: r.origin.trim().toUpperCase() })),
      { brought_by_name: name.trim(), brought_by_id: idCard.trim(), remarks_in: remarks.trim(), backdateDate: backdate ? bdDate : null, backdateTime: backdate ? bdTime : null },
    );
  };

  const tag = (st) => st === "NEW" ? <Badge tone="inside">NEW</Badge> : st === "IN_WH" ? <Badge tone="overtime">ALREADY IN WAREHOUSE</Badge> : st === "DUP" ? <Badge tone="overtime">DUPLICATE</Badge> : <Badge tone="neutral">EMPTY</Badge>;

  if (step === "get") {
    return (
      <Modal title="Scan or Paste Manifest" onClose={onClose} wide>
        <div style={{ fontSize: 12.5, color: C.ink50, lineHeight: 1.55, marginBottom: 10 }}>
          {scanCap === "checking" ? "Checking what scanning is available…" : scanCap
            ? <>Photograph the manifest and <b>Claude reads every arrival number and origin for you</b>. You'll review the list before anything is saved.</>
            : <>Basic scanner on this device — it can miss or misread digits, so check the list carefully. For the most accurate scanning, use the Claude-hosted link. (Pasting a list always works.)</>}
        </div>
        <div style={{ background: C.paperDim, borderRadius: 8, padding: "8px 11px", fontSize: 12, color: C.ink50, marginBottom: 12, lineHeight: 1.5 }}>
          <b style={{ color: C.ink }}>For the best result:</b> one page per photo, flat on a table, good light, the whole page in frame and the text sharp. Long manifest? Take one photo per page — you can scan more pages after this one.
        </div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
          <label style={{ display: "inline-flex", alignItems: "center", gap: 7, background: C.navy, color: "#fff", borderRadius: 8, padding: "10px 14px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
            <Camera size={16} /> Take photo
            <input type="file" accept="image/*" capture="environment" onChange={addFiles} style={{ display: "none" }} />
          </label>
          <label style={{ display: "inline-flex", alignItems: "center", gap: 7, background: "#fff", color: C.navy, border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 14px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
            <Download size={16} /> Choose photos
            <input type="file" accept="image/*" multiple onChange={addFiles} style={{ display: "none" }} />
          </label>
        </div>

        {files.length > 0 && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
            {previews.map((u, i) => (
              <div key={u} style={{ position: "relative", width: 72, height: 72, borderRadius: 8, overflow: "hidden", border: `1px solid ${C.line}` }}>
                <img src={u} alt={`manifest ${i + 1}`} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                <button type="button" onClick={() => setFiles((f) => f.filter((_, j) => j !== i))} style={{ position: "absolute", top: 2, right: 2, background: "rgba(15,23,42,0.75)", color: "#fff", border: "none", borderRadius: "50%", width: 20, height: 20, cursor: "pointer", fontSize: 12, lineHeight: 1 }}>×</button>
              </div>
            ))}
          </div>
        )}

        <Field label="How many shipments does the manifest say there are? (optional — lets me warn if any were missed)">
          <input type="number" min="1" style={inputStyle} value={expectedTotal} onChange={(e) => setExpectedTotal(e.target.value)} placeholder="e.g. 92" />

        {rows.length > 0 && <div style={{ fontSize: 12.5, color: C.navy, marginBottom: 8, fontWeight: 600 }}>{rows.length} already read — new results will be added to them.</div>}
        {err && <div style={{ background: "#FEE2E2", color: C.redDeep, borderRadius: 8, padding: "9px 11px", fontSize: 12.5, marginBottom: 12 }}>{err}</div>}
        {progress && <div style={{ fontSize: 12.5, color: C.navy, marginBottom: 10, fontWeight: 600 }}>{progress}</div>}

        <Btn full tone="navy" icon={Search} onClick={runScan} disabled={busy || files.length === 0}>
          {busy ? "Reading…" : files.length ? `Read ${files.length} photo${files.length > 1 ? "s" : ""}` : "Add a photo first"}
        </Btn>
        {rows.length > 0 && <div style={{ marginTop: 8 }}><Btn full tone="ghost" onClick={() => setStep("review")}>Back to the list ({rows.length})</Btn></div>}

        <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "18px 0 10px" }}>
          <span style={{ flex: 1, height: 1, background: C.line }} /><span style={{ fontSize: 11.5, color: C.ink50, fontWeight: 600 }}>OR PASTE / TYPE A LIST</span><span style={{ flex: 1, height: 1, background: C.line }} />
        </div>
        <textarea style={{ ...inputStyle, minHeight: 90, fontFamily: FONT_MONO, fontSize: 13 }} value={pasteText} onChange={(e) => { setPasteText(e.target.value); setErr(""); }}
          placeholder={"One shipment per line. Optional: arrival, origin\n1042215, AUH\n1042216, LON"} />
        <div style={{ height: 10 }} />
        <Btn full tone="paper" onClick={usePaste} disabled={busy || !pasteText.trim()}>Use this list</Btn>
      </Modal>
    );
  }

  return (
    <Modal title={`Review ${rows.length} shipment${rows.length === 1 ? "" : "s"}`} onClose={onClose} wide>
      <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
        <button type="button" onClick={() => setStep("get")} style={{ background: "none", border: "none", color: C.navy, fontSize: 12.5, fontWeight: 700, cursor: "pointer", padding: 0 }}>+ Scan another page / photo</button>
      </div>
      {expected > 0 && (
        <div style={{ background: countedRows === expected ? "#D1FAE5" : "#FEF3C7", color: countedRows === expected ? C.greenDeep : C.amberDeep, borderRadius: 8, padding: "9px 11px", fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>
          {countedRows === expected ? `✓ ${countedRows} read — matches the manifest total.`
            : countedRows < expected ? `Only ${countedRows} read but the manifest says ${expected}. ${expected - countedRows} may be missing — scan another page or add them below.`
            : `${countedRows} read but the manifest says ${expected} — check for duplicates or wrong lines.`}
        </div>
      )}
      <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 10, lineHeight: 1.5 }}>Fix any number that was misread, untick or remove anything that shouldn't be received. Nothing is saved until you press the green button.</div>

      <div style={{ maxHeight: 320, overflowY: "auto", border: `1px solid ${C.line}`, borderRadius: 9, marginBottom: 8 }}>
        {rows.map((r, i) => {
          const st = statuses[i];
          const oName = originName(r.origin, custom);
          return (
            <div key={r.rid} style={{ padding: "8px 10px", borderBottom: i < rows.length - 1 ? `1px solid ${C.line}` : "none", background: st === "NEW" ? "#fff" : "#FFFBEB" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <input type="checkbox" checked={r.include && st === "NEW"} disabled={st !== "NEW"} onChange={(e) => updateRow(r.rid, { include: e.target.checked })} />
                <input style={{ ...inputStyle, fontFamily: FONT_MONO, padding: "6px 8px", flex: 1, minWidth: 0 }} value={r.arrival} onChange={(e) => updateRow(r.rid, { arrival: e.target.value })} placeholder="Arrival no." />
                <input style={{ ...inputStyle, fontFamily: FONT_MONO, padding: "6px 8px", flex: 1, minWidth: 0 }} value={r.awb} onChange={(e) => updateRow(r.rid, { awb: e.target.value })} placeholder="AWB (optional)" />
                <button type="button" onClick={() => removeRow(r.rid)} title="Remove" style={{ background: "none", border: "none", color: C.redDeep, cursor: "pointer", padding: 2, flexShrink: 0 }}><X size={15} /></button>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6, paddingLeft: 24 }}>
                <input style={{ ...inputStyle, fontFamily: FONT_MONO, padding: "5px 8px", width: 66, textTransform: "uppercase" }} value={r.origin} maxLength={4} onChange={(e) => updateRow(r.rid, { origin: e.target.value.toUpperCase() })} placeholder="ORG" />
                <span style={{ fontSize: 11.5, color: oName ? C.greenDeep : C.ink50, flex: 1, minWidth: 0 }}>{oName || (r.origin ? "code not in list" : "origin")}</span>
                <div style={{ flexShrink: 0 }}>{tag(st)}</div>
              </div>
            </div>
          );
        })}
      </div>
      <button type="button" onClick={addRow} style={{ background: "none", border: "none", color: C.navy, fontSize: 12.5, fontWeight: 600, cursor: "pointer", padding: 0, marginBottom: 14 }}>+ Add a missing shipment</button>

      <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 14 }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>Brought in by (applies to all)</div>
        <Field label="Person's name"><input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} /></Field>
        <Field label="Their ID number"><input style={inputStyle} value={idCard} onChange={(e) => setIdCard(e.target.value)} /></Field>
        <Field label="Remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} placeholder="e.g. flight / manifest number" /></Field>
        <BackdateDateTime label="Arrived earlier? Set the real date & time" active={backdate} setActive={setBackdate}
          date={bdDate} setDate={setBdDate} time={bdTime} setTime={setBdTime} error={bdError} setError={setBdError} />
      </div>

      <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 8 }}>{toReceive.length} to receive{skipped > 0 ? ` · ${skipped} skipped (already in warehouse, duplicate, empty or unticked)` : ""}</div>
      <Btn full tone="green" icon={DoorOpen} onClick={save} disabled={!name.trim() || toReceive.length === 0}>
        Receive {toReceive.length} Shipment{toReceive.length === 1 ? "" : "s"}
      </Btn>
    </Modal>
  );
}

function ShipmentReceiveForm({ existing, custom, onClose, onSave }) {
  const [arrival, setArrival] = useState("");
  const [awb, setAwb] = useState("");
  const [origin, setOrigin] = useState("");
  const [name, setName] = useState("");
  const [idCard, setIdCard] = useState("");
  const [remarks, setRemarks] = useState("");
  const [backdate, setBackdate] = useState(false);
  const [bdDate, setBdDate] = useState(todayStr());
  const [bdTime, setBdTime] = useState(nowTimeStr().slice(0, 5));
  const [bdError, setBdError] = useState("");
  const [err, setErr] = useState("");

  const save = () => {
    const arr = arrival.trim().toUpperCase(), aw = awb.trim().toUpperCase();
    const key = arr || aw;
    if (!key || !name.trim()) return;
    if (existing.some((s) => s.status === "IN_WAREHOUSE" && shipKey(s) === key)) { setErr("This one is already in the warehouse — release it first or check the number."); return; }
    if (backdate && new Date(`${bdDate}T${bdTime}:00`).getTime() > Date.now() + 60000) { setBdError("That date/time is in the future"); return; }
    onSave({
      arrival_no: arr, awb: aw, origin: origin.trim().toUpperCase(), brought_by_name: name.trim(), brought_by_id: idCard.trim(),
      remarks_in: remarks.trim(), backdateDate: backdate ? bdDate : null, backdateTime: backdate ? bdTime : null,
    });
  };

  return (
    <Modal title="Receive Shipment" onClose={onClose}>
      <Field label="Arrival Number"><input autoFocus style={{ ...inputStyle, fontFamily: FONT_MONO }} value={arrival} onChange={(e) => { setArrival(e.target.value); setErr(""); }} placeholder="e.g. 1042215" autoCapitalize="characters" /></Field>
      {err && <div style={{ fontSize: 12.5, color: C.redDeep, marginTop: -6, marginBottom: 10 }}>{err}</div>}
      <Field label="AWB Number (optional)"><input style={{ ...inputStyle, fontFamily: FONT_MONO }} value={awb} onChange={(e) => { setAwb(e.target.value); setErr(""); }} placeholder="e.g. 176-48201935" autoCapitalize="characters" /></Field>
      <OriginField value={origin} onChange={setOrigin} custom={custom} />
      <Field label="Brought By (person's name)"><input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} /></Field>
      <Field label="Their ID Number"><input style={inputStyle} value={idCard} onChange={(e) => setIdCard(e.target.value)} /></Field>
      <Field label="Remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} placeholder="e.g. 2 cartons, fragile" /></Field>
      <BackdateDateTime label="Arrived earlier? Set the real date & time" active={backdate} setActive={setBackdate}
        date={bdDate} setDate={setBdDate} time={bdTime} setTime={setBdTime} error={bdError} setError={setBdError} />
      <Btn full tone="green" icon={DoorOpen} onClick={save} disabled={!(arrival.trim() || awb.trim()) || !name.trim()}>Receive into Warehouse</Btn>
    </Modal>
  );
}

  const save = () => {

  };

  return (
    <Modal title="Release Shipment" onClose={onClose}>
      <div style={{ background: C.paperDim, borderRadius: 8, padding: "10px 12px", marginBottom: 14 }}>
        <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 15 }}>{shipRef(shipment)}</div>

  const [lookup, setLookup] = useState("");

function LeaveScreen({ session, employees, empById, leaves, persistLeaves, notify }) {
  const [showForm, setShowForm] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const today = todayStr();

  const sorted = useMemo(() => [...leaves].sort((a, b) => b.date_from.localeCompare(a.date_from)), [leaves]);
  const current = sorted.filter((l) => l.date_to >= today);
  const past = sorted.filter((l) => l.date_to < today);

  const addLeave = async (data) => {
    const rec = { id: uid("lv_"), ...data, recorded_by: session.name, created_at: Date.now() };
    await persistLeaves([rec, ...leaves]);
    notify("Leave recorded");
    setShowForm(false);
  };

  const removeLeave = async (id) => {
    await persistLeaves(leaves.filter((l) => l.id !== id));
    notify("Leave entry removed");
    setConfirmDelete(null);
  };

  const LeaveRow = ({ l, removable }) => {
    const e = empById[l.employee_id];
    if (!e) return null;
    const range = l.date_from === l.date_to ? fmtDate(l.date_from) : `${fmtDate(l.date_from)} – ${fmtDate(l.date_to)}`;
    return (
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "11px 14px", borderBottom: `1px solid ${C.line}` }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontWeight: 600, fontSize: 14 }}>{e.name}</span>
            <Badge tone={l.type === "Sick Leave" || l.type === "Absent" ? "missing" : "neutral"}>{l.type.toUpperCase()}</Badge>
          </div>
          <div style={{ fontSize: 12, color: C.ink50, marginTop: 2 }}>
            {range}{l.reason ? ` — ${l.reason}` : ""} · recorded by {l.recorded_by}
          </div>
        </div>
        {removable && session.role === "admin" && (
          <button onClick={() => setConfirmDelete(l)} style={{ background: "none", border: "none", color: C.redDeep, cursor: "pointer", flexShrink: 0 }}><Trash2 size={15} /></button>
        )}
      </div>
    );
  };

  return (
    <div>
      <SectionTitle title="Leave & Absences" sub={`${current.length} current or upcoming`} action={{ label: "+ Mark Leave", onClick: () => setShowForm(true) }} />

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 20 }}>
        {current.length === 0 ? <EmptyState icon={UserX} title="No one is currently marked on leave" /> : current.map((l) => <LeaveRow key={l.id} l={l} removable />)}
      </div>

      {past.length > 0 && (
        <>
          <SectionTitle title="Past Leave" />
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
            {past.slice(0, 30).map((l) => <LeaveRow key={l.id} l={l} removable />)}
          </div>
        </>
      )}

      {showForm && <LeaveForm employees={employees} onClose={() => setShowForm(false)} onSave={addLeave} />}

      {confirmDelete && (
        <Modal title="Remove Leave Entry" onClose={() => setConfirmDelete(null)}>
          <p style={{ fontSize: 14, color: C.ink, lineHeight: 1.5 }}>
            Remove this leave entry for <b>{empById[confirmDelete.employee_id]?.name}</b>?
          </p>
          <div style={{ display: "flex", gap: 8 }}>
            <Btn tone="ghost" onClick={() => setConfirmDelete(null)}>Cancel</Btn>
            <Btn tone="red" onClick={() => removeLeave(confirmDelete.id)}>Remove</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function EmployeesScreen({ employees, persistEmployees, notify }) {
  const [q, setQ] = useState("");
  const [statusFilter, setStatusFilter] = useState("active");
  const [editing, setEditing] = useState(null); // employee or {} for new
  const [confirmDeactivate, setConfirmDeactivate] = useState(null);
  const [bulkOpen, setBulkOpen] = useState(false);

  const filtered = employees.filter((e) => {
    if (statusFilter === "active" && !e.active) return false;
    if (statusFilter === "inactive" && e.active) return false;
    if (!q.trim()) return true;
    const t = q.toLowerCase();
    return e.name.toLowerCase().includes(t) || e.employee_number.toLowerCase().includes(t) || e.company.toLowerCase().includes(t) || e.department.toLowerCase().includes(t);
  });

  const save = async (data) => {
    if (!data.employee_number.trim() || !data.name.trim()) { notify("Employee ID and name are required", "error"); return; }
    const dupe = employees.find((e) => e.employee_number.trim().toLowerCase() === data.employee_number.trim().toLowerCase() && e.id !== data.id);
    if (dupe) { notify("That Employee ID is already in use", "error"); return; }
    let next;
    if (data.id) {
      next = employees.map((e) => (e.id === data.id ? { ...e, ...data, updated_at: Date.now() } : e));
      notify("Employee updated");
    } else {
      next = [{ ...data, id: uid("e_"), active: true, created_at: Date.now(), updated_at: Date.now() }, ...employees];
      notify("Employee added");
    }
    await persistEmployees(next);
    setEditing(null);
  };

  const toggleActive = async (emp) => {
    const next = employees.map((e) => (e.id === emp.id ? { ...e, active: !e.active, updated_at: Date.now() } : e));
    await persistEmployees(next);
    notify(emp.active ? `${emp.name} deactivated` : `${emp.name} reactivated`);
    setConfirmDeactivate(null);
  };

  const demoCount = employees.filter((e) => e.demo).length;

  const removeDemo = async () => {
    await persistEmployees(employees.filter((e) => !e.demo));
    notify(`Removed ${demoCount} demo employee${demoCount === 1 ? "" : "s"}`);
  };

  return (
    <div>
      <SectionTitle title="Employee Management" sub={`${employees.filter((e) => e.active).length} active · ${employees.filter((e) => !e.active).length} inactive`}
        action={{ label: "+ Add employee", onClick: () => setEditing({}) }} />

      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <Btn size="sm" tone="paper" icon={UserPlus} onClick={() => setBulkOpen(true)}>Bulk add employees</Btn>
        {demoCount > 0 && <Btn size="sm" tone="ghost" icon={Trash2} onClick={removeDemo}>Remove {demoCount} demo employee{demoCount === 1 ? "" : "s"}</Btn>}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 180 }}>
          <Search size={15} style={{ position: "absolute", left: 10, top: 11, color: C.ink50 }} />
          <input style={{ ...inputStyle, paddingLeft: 32 }} placeholder="Search employees…" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <select style={{ ...inputStyle, width: "auto" }} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
          <option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option>
        </select>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {filtered.length === 0 && <EmptyState icon={Users} title="No employees found" />}
        {filtered.map((e) => (
          <div key={e.id} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{e.name}</span>
                {!e.active && <Badge tone="missing">INACTIVE</Badge>}
                {e.demo && <Badge tone="neutral">DEMO</Badge>}
              </div>
              <div style={{ fontSize: 12.5, color: C.ink50, marginTop: 2 }}>
                <span style={{ fontFamily: FONT_MONO }}>{e.employee_number}</span> · {e.company} · {e.department} · {e.designation}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
              <button onClick={() => setEditing(e)} style={{ background: C.paperDim, border: "none", borderRadius: 7, padding: 8, cursor: "pointer", color: C.navy }}><Edit3 size={15} /></button>
              <button onClick={() => setConfirmDeactivate(e)} style={{ background: e.active ? "#F7E7E5" : "#EAF4EC", border: "none", borderRadius: 7, padding: 8, cursor: "pointer", color: e.active ? C.redDeep : C.greenDeep }}>
                {e.active ? <Trash2 size={15} /> : <RefreshCw size={15} />}
              </button>
            </div>
          </div>
        ))}
      </div>

      {editing !== null && <EmployeeForm employee={editing} onClose={() => setEditing(null)} onSave={save} />}

      {bulkOpen && (
        <BulkAddModal employees={employees} onClose={() => setBulkOpen(false)}
          onAdd={async (newOnes) => { await persistEmployees([...newOnes, ...employees]); setBulkOpen(false); notify(`Added ${newOnes.length} employee${newOnes.length === 1 ? "" : "s"}`); }} />
      )}

      {confirmDeactivate && (
        <Modal title={confirmDeactivate.active ? "Deactivate Employee" : "Reactivate Employee"} onClose={() => setConfirmDeactivate(null)}>
          <p style={{ fontSize: 14, color: C.ink, lineHeight: 1.5 }}>
            {confirmDeactivate.active
              ? <>Deactivate <b>{confirmDeactivate.name}</b>? They won't be checkable-in at the gate, but their attendance history is kept permanently.</>
              : <>Reactivate <b>{confirmDeactivate.name}</b>? They will be checkable-in at the gate again.</>}
          </p>
          <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
            <Btn tone="ghost" onClick={() => setConfirmDeactivate(null)}>Cancel</Btn>
            <Btn tone={confirmDeactivate.active ? "red" : "green"} onClick={() => toggleActive(confirmDeactivate)}>
              {confirmDeactivate.active ? "Deactivate" : "Reactivate"}
            </Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   BULK ADD EMPLOYEES
   Paste one employee per line so a full roster can be added in seconds
   instead of one at a time. Employee IDs are generated automatically.
--------------------------------------------------------------------- */
function nextEmployeeNumber(employees, offset) {
  let max = 1000;
  employees.forEach((e) => {
    const m = /(\d+)\s*$/.exec(e.employee_number || "");
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return `EMP-${max + offset}`;
}

function BulkAddModal({ employees, onClose, onAdd }) {
  const [raw, setRaw] = useState("");
  const [defCompany, setDefCompany] = useState("");
  const [defDept, setDefDept] = useState("");
  const [defDesignation, setDefDesignation] = useState("");

  const parsed = useMemo(() => {
    return raw.split("\n").map((line) => line.trim()).filter(Boolean).map((line) => {
      const parts = line.split(",").map((p) => p.trim());
      return {
        name: parts[0] || "",
        company: parts[1] || defCompany,
        department: parts[2] || defDept,
        designation: parts[3] || defDesignation,
        phone: parts[4] || "",
      };
    }).filter((p) => p.name);
  }, [raw, defCompany, defDept, defDesignation]);

  const existingNames = useMemo(() => new Set(employees.map((e) => e.name.trim().toLowerCase())), [employees]);
  const duplicateCount = parsed.filter((p) => existingNames.has(p.name.trim().toLowerCase())).length;

  const confirm = () => {
    if (parsed.length === 0) return;
    const created = parsed.map((p, i) => ({
      id: uid("e_"), employee_number: nextEmployeeNumber(employees, i + 1), name: p.name,
      company: p.company, department: p.department, designation: p.designation, phone: p.phone,
      active: true, created_at: Date.now(), updated_at: Date.now(),
    }));
    onAdd(created);
  };

  return (
    <Modal title="Bulk Add Employees" onClose={onClose} wide>
      <p style={{ fontSize: 12.5, color: C.ink50, marginTop: 0, lineHeight: 1.6 }}>
        Paste one employee per line. Each line can just be a name, or add more detail separated by commas:<br />
        <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, background: C.paperDim, padding: "1px 5px", borderRadius: 4 }}>
          Name, Company, Department, Designation, Phone
        </span><br />
        Employee IDs are assigned automatically. Blank fields use the defaults below.
      </p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
        <Field label="Default company"><input style={inputStyle} value={defCompany} onChange={(e) => setDefCompany(e.target.value)} placeholder="optional" /></Field>
        <Field label="Default department"><input style={inputStyle} value={defDept} onChange={(e) => setDefDept(e.target.value)} placeholder="optional" /></Field>
        <Field label="Default designation"><input style={inputStyle} value={defDesignation} onChange={(e) => setDefDesignation(e.target.value)} placeholder="optional" /></Field>
      </div>

      <Field label="Employees (one per line)">
        <textarea
          style={{ ...inputStyle, minHeight: 160, fontFamily: FONT_MONO, fontSize: 13 }}
          value={raw}
          onChange={(e) => setRaw(e.target.value)}
          placeholder={"James Mwangi\nAlice Wanjiru, Northgate Logistics, Warehouse, Driver\nDavid Njoroge, Northgate Logistics, IT, Technician, 0712345678"}
        />
      </Field>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, fontSize: 12.5, color: C.ink50 }}>
        <span>{parsed.length} employee{parsed.length === 1 ? "" : "s"} ready to add</span>
        {duplicateCount > 0 && <span style={{ color: C.amberDeep }}>{duplicateCount} name{duplicateCount === 1 ? "" : "s"} match existing employees</span>}
      </div>

      {parsed.length > 0 && (
        <div style={{ maxHeight: 160, overflowY: "auto", border: `1px solid ${C.line}`, borderRadius: 8, marginBottom: 14 }}>
          {parsed.map((p, i) => (
            <div key={i} style={{ padding: "7px 10px", fontSize: 12.5, borderBottom: i < parsed.length - 1 ? `1px solid ${C.line}` : "none", display: "flex", justifyContent: "space-between" }}>
              <span style={{ fontWeight: 600 }}>{p.name}</span>
              <span style={{ color: C.ink50 }}>{[p.company, p.department, p.designation].filter(Boolean).join(" · ") || "—"}</span>
            </div>
          ))}
        </div>
      )}

      <Btn full tone="navy" icon={UserPlus} onClick={confirm} disabled={parsed.length === 0}>
        Add {parsed.length || ""} Employee{parsed.length === 1 ? "" : "s"}
      </Btn>
    </Modal>
  );
}

function PeriodReport({ mode, employees, attendance, empById, settings }) {
  const [date, setDate] = useState(todayStr());
  const [month, setMonth] = useState(todayStr().slice(0, 7));

  let from, to, label;
  if (mode === "daily") { from = to = date; label = fmtDate(date); }
  else if (mode === "weekly") {
    const start = startOfWeek(new Date(date + "T00:00:00"));
    const end = new Date(start); end.setDate(end.getDate() + 6);
    from = todayStr(start); to = todayStr(end); label = `${fmtDate(from)} – ${fmtDate(to)}`;
  } else {
    from = `${month}-01`;
    const [y, m] = month.split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    to = `${month}-${String(last).padStart(2, "0")}`;
    label = new Date(from + "T00:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }

  const shiftHours = settings.shift_hours || 9;
  const rows = attendance.filter((a) => a.date >= from && a.date <= to).map((a) => ({ ...a, emp: empById[a.employee_id] })).filter((r) => r.emp);
  rows.sort((a, b) => (b.date + b.time_in).localeCompare(a.date + a.time_in));
  const overtimeTotal = rows.reduce((s, r) => s + overtimeMinutes(r.total_minutes, shiftHours), 0);
  const overtimeCount = rows.filter((r) => overtimeMinutes(r.total_minutes, shiftHours) > 0).length;
  const missingCheckout = rows.filter((r) => r.status === "INSIDE" && r.date < todayStr()).length;
  const totalMinutes = rows.reduce((s, r) => s + (r.total_minutes || 0), 0);

  const headers = [
    { label: "Date", get: (r) => r.date }, { label: "Employee", get: (r) => r.emp.name }, { label: "Employee ID", get: (r) => r.emp.employee_number },
    { label: "Company", get: (r) => r.emp.company }, { label: "Time In", get: (r) => r.time_in }, { label: "Date Out", get: (r) => (r.time_out ? (r.date_out || r.date) : "") }, { label: "Time Out", get: (r) => r.time_out || "" },
    { label: "Total Hours", get: (r) => r.total_minutes != null ? fmtDuration(r.total_minutes) : "" }, { label: "Status", get: (r) => r.status },
    { label: "Overtime", get: (r) => fmtDuration(overtimeMinutes(r.total_minutes, shiftHours)) }, { label: "Recorded By", get: (r) => r.status === "INSIDE" ? r.checked_in_by : r.checked_out_by },
  ];

  return (
    <div>
      <div style={{ display: "flex", gap: 10, alignItems: "flex-end", marginBottom: 14, flexWrap: "wrap" }}>
        {mode === "monthly" ? (
          <Field label="Month"><input type="month" style={inputStyle} value={month} onChange={(e) => setMonth(e.target.value)} /></Field>
        ) : (
          <Field label={mode === "weekly" ? "Any date in week" : "Date"}><input type="date" style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        )}
        <Btn size="sm" tone="paper" icon={Download} onClick={() => downloadFile(`${mode}-report-${from}_${to}.csv`, toCSV(rows, headers), "text/csv")}>CSV</Btn>
        <Btn size="sm" tone="paper" icon={FileDown} onClick={() => window.print()}>PDF (Print)</Btn>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))", gap: 10, marginBottom: 16 }}>
        <StatCard label="Period" value={label} icon={CalendarDays} tone="navy" />
        <StatCard label="Total Records" value={rows.length} icon={ClipboardList} tone="slate" />
        <StatCard label="Overtime Records" value={overtimeCount} icon={AlertTriangle} tone="amber" />
        <StatCard label="Total Overtime" value={fmtDuration(overtimeTotal)} icon={TimerReset} tone="amber" />
        <StatCard label="Missing Check-outs" value={missingCheckout} icon={XCircle} tone="red" />
        <StatCard label="Total Hours Logged" value={fmtDuration(totalMinutes)} icon={Clock} tone="green" />
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        {rows.length === 0 ? <EmptyState icon={BarChart3} title="No attendance in this period" /> : (
          <TableScroll headers={["Date", "Employee", "ID", "Time In", "Time Out", "Hours", "Status"]}>
            {rows.map((r) => (
              <tr key={r.id}>
                <Td>{r.date}</Td><Td>{r.emp.name}</Td><TdMono>{r.emp.employee_number}</TdMono>
                <TdMono>{fmtTime(r.time_in)}</TdMono><TdMono>{fmtTimeOut(r)}</TdMono>
                <Td>{r.total_minutes != null ? fmtDuration(r.total_minutes) : "—"}</Td><Td><StatusBadge a={r} shiftHours={settings.shift_hours} /></Td>
              </tr>
            ))}
          </TableScroll>
        )}
      </div>
    </div>
  );
}

            <StatCard label="Total Hours" value={fmtDuration(totalMinutes)} icon={Clock} tone="slate" />
            <StatCard label="Average Hours/Day" value={fmtDuration(avgMinutes)} icon={BarChart3} tone="green" />
            <StatCard label="Overtime Days" value={overtimeCount} icon={AlertTriangle} tone="amber" />

          </div>
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>

                ))}

  );
}

  const saveShift = async () => {
    const h = parseFloat(shiftHours);
    if (!h || h <= 0) { notify("Enter a shift length greater than 0", "error"); return; }
    await persistSettings({ ...settings, shift_hours: h });
    notify("Settings saved");
  };

  const saveChannel = async (section) => {
    const ch = channels[section];
    if (ch.enabled && !ch.recipient_email.trim()) { notify("Enter the recipient's email address", "error"); return; }
    await persistSettings({ ...settings, report_channels: channels });
    notify("Report settings saved");
  };
  const updateChannel = (section, patch) => setChannels((c) => ({ ...c, [section]: { ...c[section], ...patch } }));

  const addUser = async () => {
    if (!newUser.name.trim() || !newUser.username.trim() || newUser.password.length < 4) {
      notify("Provide name, username, and a password of at least 4 characters", "error"); return;
    }
    if (users.some((u) => u.username.toLowerCase() === newUser.username.trim().toLowerCase())) {
      notify("That username already exists", "error"); return;
    }
    const hash = await sha256(newUser.password);
    await persistUsers([{ id: uid("u_"), name: newUser.name, username: newUser.username, passwordHash: hash, role: newUser.role, group: (newUser.group || "").trim(), active: true, created_at: Date.now() }, ...users]);
    setNewUser({ name: "", username: "", password: "", role: "guard", group: "" });
    notify("Account created");
  };

  const toggleUserActive = async (u) => {
    await persistUsers(users.map((x) => (x.id === u.id ? { ...x, active: !x.active } : x)));
  };

  const [editingUser, setEditingUser] = useState(null);
  const saveUserEdit = async (data) => {
    if (!data.name.trim() || !data.username.trim()) { notify("Name and username are required", "error"); return; }
    const dupe = users.some((u) => u.id !== editingUser.id && u.username.trim().toLowerCase() === data.username.trim().toLowerCase());
    if (dupe) { notify("That username is already taken", "error"); return; }
    let patch = { name: data.name.trim(), username: data.username.trim(), group: (data.group || "").trim() };
    if (data.newPassword) {
      if (data.newPassword.length < 4) { notify("New password must be at least 4 characters", "error"); return; }
      patch.passwordHash = await sha256(data.newPassword);
    }
    await persistUsers(users.map((u) => (u.id === editingUser.id ? { ...u, ...patch } : u)));
    setEditingUser(null);
    notify("Account updated");
  };

  return (
    <div>
      <SectionTitle title="Settings" />

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 4px" }}>Devices &amp; Syncing</h3>
        {syncMode === "synced" ? (
          <>
            <p style={{ fontSize: 12.5, color: C.ink50, margin: "0 0 10px", lineHeight: 1.5 }}>
              This device is <b style={{ color: C.greenDeep }}>synced via Claude</b> — anyone who opens this same link
              sees the same live employees, attendance, and leave records, updating in real time.
            </p>
            {canWriteShared === false ? (
              <div style={{ background: "#F7E7E5", color: C.redDeep, borderRadius: 8, padding: "10px 12px", fontSize: 12.5, lineHeight: 1.6 }}>
                <b>This device can view but not save changes.</b> The person who owns this page needs to give you edit
                access: open the page's <b>Share</b> menu and set your access (or general link access) to at least
                <b> Contributor</b>. Writing data also requires being signed in to a Claude account.
              </div>
            ) : (
              <div style={{ background: "#EAF4EC", color: C.greenDeep, borderRadius: 8, padding: "10px 12px", fontSize: 12.5, lineHeight: 1.6 }}>
                This device can both read and save changes.
              </div>
            )}
            <p style={{ fontSize: 11.5, color: C.ink50, margin: "10px 0 0", lineHeight: 1.6 }}>
              To let a guard's phone save check-ins here too: open the <b>Share</b> menu on this page (top of the Claude
              window, not inside this app), invite their account or set link access to Contributor or above, then have
              them open the same link and sign in. A downloaded HTML file never syncs this way — see Firebase Sync below
              for an independent option.
            </p>
          </>
        ) : syncMode === "firebase" ? (
          <div style={{ background: "#EAF4EC", color: C.greenDeep, borderRadius: 8, padding: "10px 12px", fontSize: 12.5, lineHeight: 1.6 }}>
            Connected to your own Firebase project — this device reads and writes live, shared with every other device
            connected to the same Firebase project. See Firebase Sync below for connection details.
          </div>
        ) : (
          <p style={{ fontSize: 12.5, color: C.ink50, margin: 0, lineHeight: 1.6 }}>
            This copy is <b style={{ color: C.amberDeep }}>local to this device only</b> — data here stays in this
            browser and won't appear on other phones. This happens when the app is opened as a downloaded file, or in a
            preview that doesn't support shared syncing. Use the hosted Claude link for Claude-based syncing, or connect
            your own Firebase project below for an independent setup (e.g. hosted on GitHub Pages).
          </p>
        )}
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 4px" }}>Firebase Sync</h3>
        <p style={{ fontSize: 12.5, color: C.ink50, margin: "0 0 12px", lineHeight: 1.6 }}>
          Connect your own Firebase project for syncing that works independently of Claude — useful if this app is
          downloaded and hosted elsewhere (e.g. GitHub Pages). <b>This only works when the page is opened outside
          Claude's preview</b> — Claude's own viewer blocks the network calls Firebase needs.
        </p>

        {firebaseError && (
          <div style={{ background: "#F7E7E5", color: C.redDeep, borderRadius: 8, padding: "10px 12px", fontSize: 12.5, lineHeight: 1.6, marginBottom: 12 }}>
            <b>Sign-in / connection problem:</b> {firebaseError}
          </div>
        )}

        {fbSaved && (
          <div style={{ background: "#EAF4EC", color: C.greenDeep, borderRadius: 8, padding: "10px 12px", fontSize: 12.5, lineHeight: 1.6, marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
            <span>Saved. Reload this page for it to take effect.</span>
            <Btn size="sm" tone="green" icon={RefreshCw} onClick={() => window.location.reload()}>Reload Now</Btn>
          </div>
        )}

        <details style={{ marginBottom: 14 }}>
          <summary style={{ cursor: "pointer", fontSize: 12.5, fontWeight: 600, color: C.navy }}>How to get these values from Firebase</summary>
          <ol style={{ fontSize: 12, color: C.ink50, lineHeight: 1.8, paddingLeft: 18, margin: "8px 0 0" }}>
            <li>Go to <span style={{ fontFamily: FONT_MONO }}>console.firebase.google.com</span> and create a project (free tier is enough).</li>
            <li><b>Build → Firestore Database → Create database</b> (any region, start in production mode).</li>
            <li><b>Build → Authentication → Sign-in method</b> → enable <b>Email/Password</b> (anonymous sign-in is not used). Under <b>Users</b>, add each person's account: administrators sign in with their real email address; guards sign in with their username, which maps to a private email-format address.</li>
            <li>In <b>Firestore</b>, create a <b>staff</b> collection with one document per person. The document ID must be that person's <b>Firebase Auth UID</b>, with fields <b>name</b> (text), <b>role</b> (text, e.g. admin), <b>active</b> (true) and <b>locationIds</b> (array of location IDs). <b>email</b> is recommended; <b>username</b> is only needed for guards.</li>
            <li>In <b>Firestore → Rules</b>, replace the rules with: <span style={{ fontFamily: FONT_MONO, display: "block", background: C.paperDim, padding: 8, borderRadius: 6, marginTop: 4 }}>{`allow read, write: if request.auth != null;`}</span></li>
            <li>Project settings (gear icon) → <b>General</b> → scroll to "Your apps" → add a <b>Web app</b> → copy the values it gives you into the fields below.</li>
          </ol>
        </details>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="API Key"><input style={inputStyle} value={fbForm.apiKey} onChange={(e) => setFbForm((f) => ({ ...f, apiKey: e.target.value }))} /></Field>
          <Field label="Auth Domain"><input style={inputStyle} value={fbForm.authDomain} onChange={(e) => setFbForm((f) => ({ ...f, authDomain: e.target.value }))} placeholder="project.firebaseapp.com" /></Field>
          <Field label="Project ID"><input style={inputStyle} value={fbForm.projectId} onChange={(e) => setFbForm((f) => ({ ...f, projectId: e.target.value }))} /></Field>
          <Field label="App ID"><input style={inputStyle} value={fbForm.appId} onChange={(e) => setFbForm((f) => ({ ...f, appId: e.target.value }))} /></Field>
          <Field label="Storage Bucket (optional)"><input style={inputStyle} value={fbForm.storageBucket} onChange={(e) => setFbForm((f) => ({ ...f, storageBucket: e.target.value }))} /></Field>
          <Field label="Messaging Sender ID (optional)"><input style={inputStyle} value={fbForm.messagingSenderId} onChange={(e) => setFbForm((f) => ({ ...f, messagingSenderId: e.target.value }))} /></Field>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
          <Btn tone="navy" onClick={connectFirebase}>Save &amp; Connect</Btn>
          {syncMode === "firebase" && <Btn tone="red" onClick={disconnectFirebase}>Disconnect</Btn>}
        </div>

        <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 12 }}>
          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 4 }}>Give guards and your manager access</div>
          <p style={{ fontSize: 12, color: C.ink50, margin: "0 0 8px", lineHeight: 1.6 }}>
            They can't reach this Settings screen on their own phones — instead, send them this one code (over
            WhatsApp, SMS, etc). On their phone, before logging in, they tap "Connect to the shared database" on the
            login screen and paste it in.
          </p>
          <Btn size="sm" tone="paper" icon={ShieldCheck} onClick={copyConnectionCode}>Copy Connection Code</Btn>
          {fbForm.apiKey && fbForm.authDomain && fbForm.projectId && fbForm.appId && (
            <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.ink50, background: C.paperDim, padding: 8, borderRadius: 6, marginTop: 8, wordBreak: "break-all", userSelect: "all" }}>
              {encodeFirebaseConfig(fbForm)}
            </div>
          )}
        </div>
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 4px" }}>Shift Length</h3>
        <p style={{ fontSize: 12.5, color: C.ink50, margin: "0 0 12px", lineHeight: 1.5 }}>
          There's no fixed arrival or departure time — employees can check in whenever they arrive. A shift is considered
          complete this many hours after check-in; anything worked beyond that is counted as overtime, shown throughout
          the app and in reports.
        </p>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
          <Field label="Standard shift length (hours)">
            <input type="number" min="1" max="24" step="0.5" style={{ ...inputStyle, maxWidth: 140 }} value={shiftHours} onChange={(e) => setShiftHours(e.target.value)} />
          </Field>
          <Btn tone="navy" onClick={saveShift}>Save</Btn>
        </div>
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 4px" }}>Report Delivery</h3>
        <p style={{ fontSize: 12.5, color: C.ink50, margin: "0 0 14px", lineHeight: 1.5 }}>
          Each section can go to a different manager — e.g. attendance to HR, security to your security manager,
          inventory to procurement. Since this app has no background server, it can't send email on its own: whoever
          opens the app sees a reminder when a report is due, and one tap builds it and opens your email app with the
          CSV ready to attach.
        </p>
        {["attendance", "security", "inventory", "shipments"].map((section) => {
          const ch = channels[section];
          const label = { attendance: "Attendance", security: "Security (Visitors & Contractors)", inventory: "Inventory", shipments: "Shipments" }[section];
          return (
            <div key={section} style={{ borderTop: section !== "attendance" ? `1px dashed ${C.line}` : "none", paddingTop: section !== "attendance" ? 14 : 0, marginTop: section !== "attendance" ? 14 : 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 8 }}>{label}</div>
              <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, cursor: "pointer" }}>
                <input type="checkbox" checked={ch.enabled} onChange={(e) => updateChannel(section, { enabled: e.target.checked })} />
                <span style={{ fontSize: 13 }}>Enable scheduled reminders for this section</span>
              </label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <Field label="Recipient's name"><input style={inputStyle} value={ch.recipient_name} onChange={(e) => updateChannel(section, { recipient_name: e.target.value })} /></Field>
                <Field label="Recipient's email"><input type="email" style={inputStyle} value={ch.recipient_email} onChange={(e) => updateChannel(section, { recipient_email: e.target.value })} placeholder="manager@company.com" /></Field>
                <Field label="Frequency">
                  <select style={inputStyle} value={ch.frequency} onChange={(e) => updateChannel(section, { frequency: e.target.value })}>
                    <option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option>
                  </select>
                </Field>
                <Field label="Reminder time"><input type="time" style={inputStyle} value={ch.time} onChange={(e) => updateChannel(section, { time: e.target.value })} /></Field>
              </div>
              <div style={{ fontSize: 11.5, color: C.ink50, marginBottom: 10 }}>Last sent: {ch.last_sent ? fmtDate(ch.last_sent) : "never"}</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <Btn size="sm" tone="navy" onClick={() => saveChannel(section)}>Save</Btn>
                <Btn size="sm" tone="paper" icon={FileDown} onClick={() => sendReport(section, ch.frequency)} disabled={!ch.recipient_email.trim()}>Send now</Btn>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 12px" }}>Guard &amp; Admin Accounts</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 14 }}>
          {users.map((u) => (
            <div key={u.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", background: C.paperDim, borderRadius: 7 }}>
              <div>
                <span style={{ fontWeight: 600, fontSize: 13.5 }}>{u.name}</span>
                <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink50, marginLeft: 8 }}>{u.username} · {u.role} · {userGroup(u)}</span>
                {!u.active && <span style={{ marginLeft: 8 }}><Badge tone="missing">DISABLED</Badge></span>}
              </div>
              <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                <button onClick={() => setEditingUser(u)} style={{ background: "none", border: `1px solid ${C.line}`, borderRadius: 6, padding: "4px 8px", fontSize: 11.5, cursor: "pointer" }}>Edit</button>
                <button onClick={() => toggleUserActive(u)} style={{ background: "none", border: `1px solid ${C.line}`, borderRadius: 6, padding: "4px 8px", fontSize: 11.5, cursor: "pointer" }}>
                  {u.active ? "Disable" : "Enable"}
                </button>
              </div>
            </div>
          ))}
        </div>
        {editingUser && <UserEditForm user={editingUser} onClose={() => setEditingUser(null)} onSave={saveUserEdit} />}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="Full name"><input style={inputStyle} value={newUser.name} onChange={(e) => setNewUser((n) => ({ ...n, name: e.target.value }))} /></Field>
          <Field label="Username"><input style={inputStyle} value={newUser.username} onChange={(e) => setNewUser((n) => ({ ...n, username: e.target.value }))} /></Field>
          <Field label="Group / Chamber (login page)"><input style={inputStyle} value={newUser.group} onChange={(e) => setNewUser((n) => ({ ...n, group: e.target.value }))} placeholder="e.g. Chamber 107" /></Field>
          <Field label="Password"><input type="password" style={inputStyle} value={newUser.password} onChange={(e) => setNewUser((n) => ({ ...n, password: e.target.value }))} /></Field>
          <Field label="Role">
            <select style={inputStyle} value={newUser.role} onChange={(e) => setNewUser((n) => ({ ...n, role: e.target.value }))}>
              <option value="guard">Security Guard</option><option value="admin">Manager / Admin</option>
            </select>
          </Field>
        </div>
        <Btn tone="navy" icon={UserPlus} onClick={addUser}>Create Account</Btn>
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 8px" }}>Data Management</h3>
        <p style={{ fontSize: 13, color: C.ink50, marginTop: 0, marginBottom: 14 }}>
          This app starts with your login accounts only — no fake employees or attendance. Use the options below only if
          you want to load a sample dataset for testing, or wipe everything to start completely over.
        </p>

        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 4 }}>Load sample data</div>
          <div style={{ fontSize: 12, color: C.ink50, marginBottom: 8 }}>Replaces everything with 15 demo employees and sample attendance, for testing. Your real data (if any) will be lost.</div>
          {!confirmSample ? (
            <Btn tone="paper" icon={RefreshCw} onClick={() => setConfirmSample(true)}>Load Sample Data</Btn>
          ) : (
            <div style={{ display: "flex", gap: 8 }}>
              <Btn tone="ghost" onClick={() => setConfirmSample(false)}>Cancel</Btn>
              <Btn tone="amber" disabled={busy} onClick={async () => { await loadSample(); setConfirmSample(false); }}>{busy ? "Loading…" : "Confirm — Load Sample Data"}</Btn>
            </div>
          )}
        </div>

        <div>
          <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 4 }}>Erase everything — fresh start</div>
          <div style={{ fontSize: 12, color: C.ink50, marginBottom: 8 }}>Permanently deletes all employees, attendance, and audit history. Your login accounts are kept so you can still sign in afterward.</div>
          {!confirmErase ? (
            <Btn tone="red" icon={Trash2} onClick={() => setConfirmErase(true)}>Erase Everything</Btn>
          ) : (
            <div style={{ display: "flex", gap: 8 }}>
              <Btn tone="ghost" onClick={() => setConfirmErase(false)}>Cancel</Btn>
              <Btn tone="red" disabled={busy} onClick={async () => { await eraseAll(); setConfirmErase(false); }}>{busy ? "Erasing…" : "Confirm — Erase Everything"}</Btn>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>
</body>
</html>
